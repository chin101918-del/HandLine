      const STORAGE_KEY_V2 = 'phfs_canvas_state_v2';
      const STORAGE_KEY_V1 = 'phfs_canvas_state_v1';

      function createProject(name, familyName) {
        const now = new Date().toISOString();
        return {
          id: 'proj_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          name,
          familyName,
          styleName: 'Regular',

          unitsPerEm: 1000,

          updatedAt: now
        };
      }

      const defaultState = {
        schemaVersion: 2,
        lang: 'th',
        tab: 'studio',
        category: 'thai_consonants',
        filterMode: 'all',
        previewMode: 'editor_simulated', // primary: current project Variation Engine; secondary: compiled/uploaded .TTF
        mixProjectIds: [], // additional drawn projects included for cross-project character variation
        inputMode: 'finger_drawing', // 'pencil_only' | 'finger_drawing'
        varScriptTab: 'thai', // 'thai' | 'english'
        variation: {
          seed: 20261125,
          thai: { intensity: 45, sizeVariation: 12, slantAngle: 0, charSpacing: 14, wordSpacing: 16 },
          english: { intensity: 45, sizeVariation: 14, slantAngle: 0, charSpacing: 16, wordSpacing: 18 }
        },

        previewSize: 44,

        previewSpacing: 1,
        projects: [createProject('ลายมือของฉัน 01', 'MyThaiHand')],

      };
      defaultState.activeProjectId = defaultState.projects[0].id;

      // Safe v1 -> v2 Data Migration (never discards existing handwriting!)
      // Full IndexedDB persistence layer (HandLineFontDB v2: font_sets + meta) with localStorage fallback
      const IDB_NAME = 'HandLineFontDB';
      const IDB_VER = 2;

      function openHandLineDB() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
          const timer = setTimeout(() => reject(new Error('IndexedDB open timeout')), 1200);
          const req = indexedDB.open(IDB_NAME, IDB_VER);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('font_sets')) db.createObjectStore('font_sets', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
          };
          req.onsuccess = () => { clearTimeout(timer); resolve(req.result); };
          req.onerror = () => { clearTimeout(timer); reject(req.error); };
        });
      }

      function saveToIndexedDB(projects, currentState) {
        openHandLineDB().then(db => {
          const tx = db.transaction(['font_sets', 'meta'], 'readwrite');
          const store = tx.objectStore('font_sets');
          projects.forEach(p => store.put(p));
          if (currentState) {
            tx.objectStore('meta').put({
              key: 'app_settings',
              activeProjectId: currentState.activeProjectId,
              variation: currentState.variation,
              inputMode: currentState.inputMode,
              guides: currentState.guides,
              lang: currentState.lang,
              previewText: currentState.previewText,
              previewSize: currentState.previewSize,
              previewLineHeight: currentState.previewLineHeight,
              previewSpacing: currentState.previewSpacing,
              cellWidth: currentState.cellWidth
            });
          }
        }).catch(() => { /* fallback handled by localStorage */ });
      }

      async function loadFromIndexedDB() {
        try {
          const db = await openHandLineDB();
          const tx = db.transaction(['font_sets', 'meta'], 'readonly');
          const projects = await new Promise((res, rej) => {
            const r = tx.objectStore('font_sets').getAll();
            r.onsuccess = () => res(r.result || []);
            r.onerror = () => rej(r.error);
          });
          const meta = await new Promise((res) => {
            const r = tx.objectStore('meta').get('app_settings');
            r.onsuccess = () => res(r.result || null);
            r.onerror = () => res(null);
          });
          return { projects, meta };
        } catch (e) {
          return { projects: [], meta: null };
        }
      }

      function ensureGlyphInstances(g) {
        if (!g) return [];
        if (Array.isArray(g.instances) && g.instances.length > 0) return g.instances;
        if (Array.isArray(g.strokes) && g.strokes.length > 0) {
          g.instances = [{ id: 'inst_mig_' + g.codepoint, strokes: g.strokes, createdAt: g.updatedAt || new Date().toISOString() }];
          g.activeInstanceIdx = 0;
          return g.instances;
        }
        g.instances = [{ id: 'inst_0_' + (g.codepoint || 0), strokes: [], createdAt: new Date().toISOString() }];
        g.activeInstanceIdx = 0;
        return g.instances;
      }

      function migrateProject(p) {
        const fam = p.familyName || 'MyThaiHand';
        const style = p.styleName || 'Regular';
        const glyphs = p.glyphs || {};
        Object.values(glyphs).forEach(g => ensureGlyphInstances(g));
        return {
          ...p,
          slantAngle: typeof p.slantAngle === 'number' ? p.slantAngle : 0,
          fullName: p.fullName || `${fam} ${style}`,
          postscriptName: p.postscriptName || `${fam}-${style}`.replace(/[^A-Za-z0-9_-]/g, ''),
          copyrightText: p.copyrightText || `Copyright (c) 2026 ${p.designer || fam}`,
          versions: Array.isArray(p.versions) ? p.versions : [],
          glyphs
        };
      }

      function loadState() {
        try {
          const rawV2 = localStorage.getItem(STORAGE_KEY_V2);
          if (rawV2) {
            const parsed = JSON.parse(rawV2);
            if (parsed && Array.isArray(parsed.projects) && parsed.projects.length > 0) {
              return {
                ...defaultState,
                ...parsed,
                projects: parsed.projects.map(migrateProject),
                guides: { ...defaultState.guides, ...(parsed.guides || {}) }
              };
            }
          }
          // Migrate from v1 seamlessly
          const rawV1 = localStorage.getItem(STORAGE_KEY_V1);
          if (rawV1) {
            const old = JSON.parse(rawV1);
            if (old && Array.isArray(old.projects) && old.projects.length > 0) {
              const migrated = {
                ...defaultState,
                ...old,
                schemaVersion: 2,
                projects: old.projects.map(migrateProject),
                guides: { ...defaultState.guides, ...(old.guides || {}) }
              };
              localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(migrated));
              return migrated;
            }
          }
        } catch (e) {
          // Ignore storage restrictions
        }
        return JSON.parse(JSON.stringify(defaultState));
      }

      let state = loadState();
      const undoStacks = {};
      const redoStacks = {};

      function saveState() {
        saveToIndexedDB(state.projects, state);
        try {
          localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(state));
        } catch (e) {
          showToast(state.lang === 'th' ? 'พื้นที่จัดเก็บเต็ม กรุณาสำรองไฟล์ JSON' : 'Storage quota reached — export JSON backup');
        }
        updateSidebarStats();
      }

      function getActiveProject() {
        return state.projects.find(p => p.id === state.activeProjectId) || state.projects[0];
      }

      function t(key) {
        return (I18N[state.lang] && I18N[state.lang][key]) || key;
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => el.classList.add('hidden'), 2800);
      }

      // Compute geometry-derived anchors & bounds in 1000 UPM space for the Vector/Anchor Inspector
      function computeGlyphGeometry(glyph) {
        const strokes = (glyph && glyph.strokes) || [];
        const cw = (glyph && glyph.canvasWidth) || state.cellWidth;
        const ch = (glyph && glyph.canvasHeight) || Math.round(cw * 1.25);
        const basePx = ch * state.guides.baseline;
        const ascPx = ch * state.guides.ascender;
        const scale = 880 / Math.max(basePx - ascPx, 1);
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        strokes.forEach(s => s.points.forEach(p => {
          const fx = p.x * scale;
          const fy = (basePx - p.y) * scale;
          if (fx < minX) minX = fx;
          if (fx > maxX) maxX = fx;
          if (fy < minY) minY = fy;
          if (fy > maxY) maxY = fy;
        }));
        if (!isFinite(minX)) {
          return { xMin: 0, yMin: 0, xMax: 0, yMax: 0, advanceWidth: 340, lsb: 55, rsb: 55, anchors: { top: [260, 560], bottom: [260, -40] } };
        }
        const cp = glyph.codepoint;
        const isComb = COMBINING_SET.has(glyph.character);
        const lsb = glyph.lsb != null ? glyph.lsb : (isComb ? Math.round(-(maxX - minX) / 2) : 55);
        const w = Math.round(maxX - minX);
        const adv = glyph.advanceWidth != null ? glyph.advanceWidth : (isComb ? 0 : Math.max(w + lsb * 2, 250));
        const rsb = glyph.rsb != null ? glyph.rsb : (isComb ? -Math.round(w / 2) : adv - (lsb + w));
        const defaultAnchors = isComb
          ? (BELOW_MARKS.has(cp) ? { _bottom: [0, Math.round(maxY + 26)] } : (TONE_MARKS.has(cp) ? { _tone: [0, Math.round(minY - 22)] } : { _top: [0, Math.round(minY - 24)], top_tone: [0, Math.round(maxY + 36)] }))
          : {
              top: [Math.round(lsb + w * (TALL_ASCENDERS.has(cp) ? 0.36 : 0.52)), Math.max(Math.round(maxY + 35), 530)],
              bottom: [Math.round(lsb + w * 0.54), Math.min(Math.round(minY - 28), -32)]
            };
        return {
          xMin: lsb,
          yMin: Math.round(minY),
          xMax: lsb + w,
          yMax: Math.round(maxY),
          advanceWidth: adv,
          lsb,
          rsb,
          anchors: { ...defaultAnchors, ...(glyph.anchors || {}) }
        };
      }

      function loadSampleGlyphs() {
        const proj = getActiveProject();
        const w = state.cellWidth;
        const h = Math.round(w * 1.25);
        const mk = (pts, width = 3.2) => ({
          id: 's_' + Math.random().toString(36).slice(2, 8),
          width,
          points: pts.map(([rx, ry, p = 0.58]) => ({ x: rx * w, y: ry * h, pressure: p }))
        });
        const samples = {
          0x0E01: { char: 'ก', cat: 'thai_consonants', strokes: [mk([[0.28,0.74,0.5],[0.29,0.50,0.65],[0.36,0.44,0.6],[0.32,0.39,0.55],[0.48,0.31,0.7],[0.68,0.37,0.65],[0.71,0.55,0.6],[0.72,0.74,0.5]])] },
          0x0E2A: { char: 'ส', cat: 'thai_consonants', strokes: [mk([[0.28,0.74],[0.29,0.46],[0.45,0.36],[0.66,0.44],[0.68,0.74]]), mk([[0.58,0.42],[0.78,0.26]])] },
          0x0E27: { char: 'ว', cat: 'thai_consonants', strokes: [mk([[0.32,0.68],[0.44,0.74],[0.64,0.68],[0.66,0.46],[0.52,0.36],[0.36,0.40]])] },
          0x0E14: { char: 'ด', cat: 'thai_consonants', strokes: [mk([[0.52,0.56],[0.42,0.68],[0.30,0.62],[0.32,0.44],[0.50,0.34],[0.68,0.44],[0.70,0.74]])] },
          0x0E1B: { char: 'ป', cat: 'thai_consonants', strokes: [mk([[0.28,0.40],[0.30,0.73],[0.68,0.73],[0.70,0.16]])] },
          0x0E31: { char: 'ั', cat: 'thai_vowels', strokes: [mk([[0.34,0.26],[0.48,0.34],[0.66,0.25]])] },
          0x0E35: { char: 'ี', cat: 'thai_vowels', strokes: [mk([[0.32,0.32],[0.50,0.24],[0.66,0.32],[0.32,0.32]]), mk([[0.64,0.32],[0.66,0.20]])] },
          0x0E48: { char: '่', cat: 'thai_tones', strokes: [mk([[0.50,0.16],[0.50,0.28]])] },
          0x0E49: { char: '้', cat: 'thai_tones', strokes: [mk([[0.38,0.26],[0.48,0.18],[0.58,0.24],[0.68,0.16]])] },
          0x0041: { char: 'A', cat: 'latin_upper', strokes: [mk([[0.26,0.74],[0.50,0.28],[0.74,0.74]]), mk([[0.35,0.56],[0.65,0.56]])] }
        };
        Object.entries(samples).forEach(([cpStr, item]) => {
          const cp = Number(cpStr);
          // Create 2 distinct handwritten instances (subtle natural stroke variation) without overwriting user's own samples
          const altStrokes = item.strokes.map(st => ({
            id: st.id + '_alt1',
            width: Number((st.width * 1.08).toFixed(2)),
            points: st.points.map((pt, idx) => ({
              x: Number((pt.x + (idx % 2 === 0 ? 2.4 : -1.8)).toFixed(2)),
              y: Number((pt.y + (idx % 2 === 0 ? -1.4 : 1.6)).toFixed(2)),
              pressure: pt.pressure
            }))
          }));
          const existing = proj.glyphs[cp];
          const existingValid = existing && Array.isArray(existing.instances)
            ? existing.instances.filter(it => it.strokes && it.strokes.length > 0)
            : [];
          const instances = existingValid.length >= 2
            ? existingValid
            : [
                { id: 'inst_s1_' + cp, strokes: item.strokes, createdAt: new Date().toISOString(), metadata: { source: 'sample' } },
                { id: 'inst_s2_' + cp, strokes: altStrokes, createdAt: new Date().toISOString(), metadata: { source: 'sample' } }
              ];
          proj.glyphs[cp] = {
            codepoint: cp, character: item.char, category: item.cat,
            canvasWidth: w, canvasHeight: h,
            strokes: instances[0].strokes,
            instances,
            activeInstanceIdx: 0,
            isCompleted: true, updatedAt: new Date().toISOString()
          };
        });
        proj.updatedAt = new Date().toISOString();
        saveState();
        renderAll();
        showToast(state.lang === 'th' ? 'เติมลายมือตัวอย่าง 10 อักขระเรียบร้อยแล้ว' : 'Loaded 10 sample glyphs');
      }

      // --- Sidebar & Navigation ---
      function updateSidebarStats() {
        const proj = getActiveProject();
        const done = Object.values(proj.glyphs).filter(g => g.strokes && g.strokes.length > 0).length;
        const pct = Math.round((done / CHARACTER_SET.length) * 100);

        if (textEl) textEl.textContent = `${done} / ${CHARACTER_SET.length} ${t('charsUnit')} (${pct}%)`;

      function renderSidebar() {

      // --- Character Cell Drawing ---
      function drawCellCanvas(canvas, spec, strokes, width, height, extraStroke = null) {
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        const dpr = window.devicePixelRatio || 1;
        const tw = Math.round(width * dpr), th = Math.round(height * dpr);
        if (canvas.width !== tw || canvas.height !== th) { canvas.width = tw; canvas.height = th; }

        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, width, height);

        const drawGuide = (ratio, color, dashed = true) => {
          const y = Math.round(height * ratio) + 0.5;
          ctx.save();
          ctx.strokeStyle = color;
          ctx.lineWidth = 1;
          if (dashed) ctx.setLineDash([3, 3]);
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
          ctx.restore();
        };

        drawGuide(state.guides.ascender, 'rgba(148, 163, 184, 0.36)', true);
        drawGuide(state.guides.capHeight, 'rgba(148, 163, 184, 0.24)', true);
        drawGuide(state.guides.xHeight, 'rgba(37, 99, 235, 0.20)', true);
        drawGuide(state.guides.baseline, 'rgba(29, 29, 31, 0.28)', false);
        drawGuide(state.guides.descender, 'rgba(148, 163, 184, 0.36)', true);

        if (state.showCenterGuide) {
          const cx = Math.round(width / 2) + 0.5;
          ctx.save();
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.24)';
          ctx.setLineDash([2, 4]);
          ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, height); ctx.stroke();
          ctx.restore();
        }

        const list = extraStroke ? [...strokes, extraStroke] : strokes;
        if (state.showGhostChar && list.length === 0) {
          ctx.save();
          ctx.fillStyle = 'rgba(29, 29, 31, 0.08)';
          ctx.font = `400 ${Math.round(height * 0.46)}px "Noto Sans Thai", "Inter", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'alphabetic';
          ctx.fillText(spec.isCombining ? '◌' + spec.char : spec.char, width / 2, height * state.guides.baseline);
          ctx.restore();
        }

        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = '#1D1D1F'; ctx.fillStyle = '#1D1D1F';

        for (const s of list) {
          const pts = s.points;
          if (!pts || !pts.length) continue;
          if (pts.length === 1) {
            const p = pts[0];
            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.max(1, s.width * 0.5 * (state.pressureSensitive ? 0.65 + 0.7 * p.pressure : 1)), 0, Math.PI * 2);
            ctx.fill();
            continue;
          }
          for (let i = 1; i < pts.length; i++) {
            const p0 = pts[i - 1], p1 = pts[i];
            const pr = state.pressureSensitive ? (p0.pressure + p1.pressure) / 2 : 0.5;
            ctx.lineWidth = Math.max(1.1, s.width * (0.65 + 0.7 * pr));
            ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
          }
        }
        ctx.restore();
      }

      function setGlyphStrokes(cp, spec, nextStrokes, recordUndo = true) {
        const proj = getActiveProject();
        const existing = proj.glyphs[cp] || {};
        const prev = existing.strokes || [];
        if (recordUndo) {
          undoStacks[cp] = [...(undoStacks[cp] || []).slice(-19), prev];
          redoStacks[cp] = [];
        }
        const h = Math.round(state.cellWidth * 1.25);
        const insts = ensureGlyphInstances(existing.codepoint ? existing : { codepoint: cp, strokes: [] });
        const activeIdx = Math.min(existing.activeInstanceIdx || 0, insts.length - 1);
        insts[activeIdx] = { ...insts[activeIdx], strokes: nextStrokes };
        proj.glyphs[cp] = {
          ...existing,
          codepoint: cp,
          character: spec.char,
          category: spec.category,
          canvasWidth: state.cellWidth,
          canvasHeight: h,
          strokes: nextStrokes,
          instances: insts,
          activeInstanceIdx: activeIdx,
          isCompleted: insts.some(it => it.strokes && it.strokes.length > 0),
          updatedAt: new Date().toISOString()
        };
        proj.updatedAt = new Date().toISOString();
        saveState();
      }

      // Vector Outline, Bearings & Anchor Inspector Modal
      function openGlyphInspectorModal(spec) {
        const proj = getActiveProject();
        const glyph = proj.glyphs[spec.codepoint] || {
          codepoint: spec.codepoint, character: spec.char, category: spec.category,
          canvasWidth: state.cellWidth, canvasHeight: Math.round(state.cellWidth * 1.25), strokes: []
        };
        const geom = computeGlyphGeometry(glyph);
        const overlay = document.getElementById('modalOverlay');
        const card = document.getElementById('modalCard');

        const anchorEntries = Object.entries(geom.anchors);
        const anchorInputs = anchorEntries.map(([name, [ax, ay]]) => `
          <div class="grid grid-cols-3 gap-2 items-center text-xs">
            <span class="font-mono text-[#424245]">${name}</span>
            <input type="number" data-ax="${name}" value="${ax}" class="px-2 py-1 rounded-lg border border-[#D2D2D7]" />
            <input type="number" data-ay="${name}" value="${ay}" class="px-2 py-1 rounded-lg border border-[#D2D2D7]" />
          </div>
        `).join('');

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-base font-semibold">${state.lang === 'th' ? 'ตัวแก้ไขเวกเตอร์และ Anchor' : 'Vector Metrics & Anchor Inspector'} — ${spec.isCombining ? '◌' + spec.char : spec.char} (U+${spec.codepoint.toString(16).toUpperCase().padStart(4,'0')})</h3>
              <p class="text-xs text-[#6E6E73] mt-0.5">${state.lang === 'th' ? 'เส้นลายมือต้นฉบับแยกจากเมตาดาตาเวกเตอร์ (1000 UPM)' : 'Original strokes remain separate from compiled TrueType metrics & anchors (1000 UPM)'}</p>
            </div>
            <button id="closeInspBtn" type="button" class="p-1.5 rounded-lg hover:bg-[#F2F2F7]"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div class="mt-4 grid grid-cols-3 gap-3 text-xs">
            <label class="space-y-1">
              <span class="text-[#6E6E73]">Advance Width</span>
              <input id="inspAdv" type="number" value="${geom.advanceWidth}" class="w-full px-2.5 py-1.5 rounded-xl border border-[#D2D2D7]" />
            </label>
            <label class="space-y-1">
              <span class="text-[#6E6E73]">LSB</span>
              <input id="inspLsb" type="number" value="${geom.lsb}" class="w-full px-2.5 py-1.5 rounded-xl border border-[#D2D2D7]" />
            </label>
            <label class="space-y-1">
              <span class="text-[#6E6E73]">RSB</span>
              <input id="inspRsb" type="number" value="${geom.rsb}" class="w-full px-2.5 py-1.5 rounded-xl border border-[#D2D2D7]" />
            </label>
          </div>
          <div class="mt-3 p-3 rounded-xl bg-[#F5F5F7] text-[11px] font-mono text-[#424245]">
            Bounds: xMin=${geom.xMin}, yMin=${geom.yMin}, xMax=${geom.xMax}, yMax=${geom.yMax} · Strokes=${glyph.strokes.length} · Combining=${spec.isCombining}
          </div>
          <div class="mt-4 space-y-2">
            <div class="text-xs font-semibold">${state.lang === 'th' ? 'พิกัด OpenType Anchors (X, Y)' : 'OpenType Anchor Coordinates (X, Y)'}</div>
            ${anchorInputs || '<p class="text-xs text-[#8E8E93]">No Thai mark anchors needed for this glyph.</p>'}
          </div>
          <div class="mt-5 flex justify-end gap-2">
            <button id="cancelInspBtn" type="button" class="px-3.5 py-2 rounded-xl border border-[#D2D2D7] text-xs font-medium">${state.lang === 'th' ? 'ปิด' : 'Close'}</button>
            <button id="saveInspBtn" type="button" class="px-4 py-2 rounded-xl bg-[#1D1D1F] text-white text-xs font-medium">${state.lang === 'th' ? 'บันทึกพิกัด' : 'Save Metrics & Anchors'}</button>
          </div>
        `;
        overlay.classList.remove('hidden');
        if (window.lucide) window.lucide.createIcons();
        const close = () => overlay.classList.add('hidden');
        document.getElementById('closeInspBtn').addEventListener('click', close);
        document.getElementById('cancelInspBtn').addEventListener('click', close);
        document.getElementById('saveInspBtn').addEventListener('click', () => {
          const nextAnchors = {};
          anchorEntries.forEach(([name]) => {
            const ax = Number(card.querySelector(`[data-ax="${name}"]`).value);
            const ay = Number(card.querySelector(`[data-ay="${name}"]`).value);
            nextAnchors[name] = [ax, ay];
          });
          proj.glyphs[spec.codepoint] = {
            ...glyph,
            advanceWidth: Number(document.getElementById('inspAdv').value),
            lsb: Number(document.getElementById('inspLsb').value),
            rsb: Number(document.getElementById('inspRsb').value),
            anchors: nextAnchors,
            updatedAt: new Date().toISOString()
          };
          saveState();
          close();
          showToast(state.lang === 'th' ? 'บันทึกพิกัดเวกเตอร์และ Anchor แล้ว' : 'Saved glyph metrics & anchors');
        });
      }

      function attachCellEvents(card, canvas, spec) {
        let activeStroke = null;
        let activePointerId = null;
        let lastPenTime = 0;
        let pendingTouchStart = null;
        const proj = getActiveProject();
        const getStrokes = () => (proj.glyphs[spec.codepoint] && proj.glyphs[spec.codepoint].strokes) || [];
        const w = state.cellWidth, h = Math.round(w * 1.25);

        const updateCardChrome = () => {
          const strokes = getStrokes();
          const done = strokes.length > 0;
          const badge = card.querySelector('[data-badge]');
          if (badge) {
            badge.className = done
              ? 'w-4 h-4 rounded-full bg-[#1D1D1F] text-white flex items-center justify-center text-[10px]'
              : 'w-2 h-2 rounded-full bg-[#E5E5EA]';
            badge.innerHTML = done ? '✓' : '';
          }
          const undoBtn = card.querySelector('[data-undo]');
          const redoBtn = card.querySelector('[data-redo]');
          const clearBtn = card.querySelector('[data-clear]');
          if (undoBtn) undoBtn.disabled = !(undoStacks[spec.codepoint] && undoStacks[spec.codepoint].length > 0);
          if (redoBtn) redoBtn.disabled = !(redoStacks[spec.codepoint] && redoStacks[spec.codepoint].length > 0);
          if (clearBtn) clearBtn.disabled = !done;
        };

        const getPoint = (e) => {
          const rect = canvas.getBoundingClientRect();
          const pr = (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : 0.52;
          return { x: Number((e.clientX - rect.left).toFixed(2)), y: Number((e.clientY - rect.top).toFixed(2)), pressure: Number(pr.toFixed(3)) };
        };

        const eraseNear = (pt) => {
          const strokes = getStrokes();
          const thr = Math.max(9, state.strokeWidth * 2.8);
          const next = strokes.filter(s => !s.points.some(p => Math.hypot(p.x - pt.x, p.y - pt.y) <= thr));
          if (next.length !== strokes.length) {
            setGlyphStrokes(spec.codepoint, spec, next, true);
            drawCellCanvas(canvas, spec, next, w, h);
            updateCardChrome();
          }
        };

        canvas.addEventListener('pointerdown', (e) => {
          // Apple Pencil Palm Rejection & Input Protection
          const now = e.timeStamp || Date.now();
          const pType = e.pointerType || 'mouse';
          if (pType === 'touch') {
            if (state.inputMode === 'pencil_only') return;
            if (activePointerId !== null) return;
            if (lastPenTime > 0 && now - lastPenTime < 450) return;
            if (Math.max(e.width || 1, e.height || 1) >= 24) return; // palm-sized contact
          }
          if (pType === 'pen') lastPenTime = now;
          e.preventDefault();
          activePointerId = e.pointerId;
          state.selectedCp = spec.codepoint;
          document.querySelectorAll('[data-cell-card]').forEach(c => {
            c.classList.remove('border-[#1D1D1F]', 'ring-2', 'ring-black/5');
            c.classList.add('border-[#E5E5EA]');
          });
          card.classList.remove('border-[#E5E5EA]');
          card.classList.add('border-[#1D1D1F]', 'ring-2', 'ring-black/5');
          try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
          const pt = getPoint(e);
          if (state.tool === 'eraser') { eraseNear(pt); return; }
          pendingTouchStart = pType === 'touch' ? pt : null;
          activeStroke = { id: 'st_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), width: state.strokeWidth, points: [pt] };
          if (pType !== 'touch') drawCellCanvas(canvas, spec, getStrokes(), w, h, activeStroke);
        });

        canvas.addEventListener('pointermove', (e) => {
          if (state.tool === 'eraser') { if (e.buttons > 0) eraseNear(getPoint(e)); return; }
          if (!activeStroke) return;
          e.preventDefault();
          const pt = getPoint(e);
          const pts = activeStroke.points;
          const prev = pts[pts.length - 1];
          if (!prev || Math.hypot(pt.x - prev.x, pt.y - prev.y) >= 0.75) {
            pts.push(pt);
            drawCellCanvas(canvas, spec, getStrokes(), w, h, activeStroke);
          }
        });

        const finishStroke = (e) => {
          if (e && activePointerId !== null && e.pointerId !== activePointerId) return;
          activePointerId = null;
          if (!activeStroke) return;
          const finished = activeStroke; activeStroke = null;
          // Suppress accidental stationary touch micro-dots (< 2.2px travel)
          if (pendingTouchStart && finished.points.length <= 2) {
            const last = finished.points[finished.points.length - 1];
            if (Math.hypot(last.x - pendingTouchStart.x, last.y - pendingTouchStart.y) < 2.2) {
              pendingTouchStart = null;
              drawCellCanvas(canvas, spec, getStrokes(), w, h);
              return;
            }
          }
          pendingTouchStart = null;
          const next = [...getStrokes(), finished];
          setGlyphStrokes(spec.codepoint, spec, next, true);
          drawCellCanvas(canvas, spec, next, w, h);
          updateCardChrome();
        };
        canvas.addEventListener('pointerup', finishStroke);
        canvas.addEventListener('pointercancel', finishStroke);
        canvas.addEventListener('lostpointercapture', () => { activePointerId = null; activeStroke = null; pendingTouchStart = null; });

        card.querySelector('[data-undo]').addEventListener('click', (e) => {
          e.stopPropagation();
          const stack = undoStacks[spec.codepoint] || [];
          if (!stack.length) return;
          const prev = stack.pop();
          redoStacks[spec.codepoint] = [...(redoStacks[spec.codepoint] || []), getStrokes()];
          setGlyphStrokes(spec.codepoint, spec, prev, false);
          drawCellCanvas(canvas, spec, prev, w, h);
          updateCardChrome();
        });
        card.querySelector('[data-redo]').addEventListener('click', (e) => {
          e.stopPropagation();
          const stack = redoStacks[spec.codepoint] || [];
          if (!stack.length) return;
          const next = stack.pop();
          undoStacks[spec.codepoint] = [...(undoStacks[spec.codepoint] || []), getStrokes()];
          setGlyphStrokes(spec.codepoint, spec, next, false);
          drawCellCanvas(canvas, spec, next, w, h);
          updateCardChrome();
        });
        card.querySelector('[data-inspect]').addEventListener('click', (e) => {
          e.stopPropagation();
          openGlyphInspectorModal(spec);
        });
        card.querySelector('[data-clear]').addEventListener('click', (e) => {
          e.stopPropagation();
          if (!getStrokes().length) return;
          setGlyphStrokes(spec.codepoint, spec, [], true);
          drawCellCanvas(canvas, spec, [], w, h);
          updateCardChrome();
        });

        const cycleInstBtn = card.querySelector('[data-cycle-inst]');
        const addInstBtn = card.querySelector('[data-add-inst]');
        const gRec = proj.glyphs[spec.codepoint];
        const instCount = gRec && Array.isArray(gRec.instances) ? gRec.instances.length : 1;
        if (cycleInstBtn && instCount > 1) {
          cycleInstBtn.classList.remove('hidden');
          cycleInstBtn.textContent = `${(gRec.activeInstanceIdx || 0) + 1}/${instCount}`;
          cycleInstBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const list = ensureGlyphInstances(gRec);
            const nextIdx = ((gRec.activeInstanceIdx || 0) + 1) % list.length;
            gRec.activeInstanceIdx = nextIdx;
            gRec.strokes = list[nextIdx].strokes || [];
            saveState();
            renderAll();
          });
        }
        if (addInstBtn) {
          addInstBtn.textContent = '+1';
          addInstBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const cur = proj.glyphs[spec.codepoint] || { codepoint: spec.codepoint, character: spec.char, category: spec.category, canvasWidth: w, canvasHeight: h, strokes: [] };
            const list = ensureGlyphInstances(cur);
            list.push({ id: 'inst_' + Date.now(), strokes: [], createdAt: new Date().toISOString() });
            cur.instances = list;
            cur.activeInstanceIdx = list.length - 1;
            cur.strokes = [];
            proj.glyphs[spec.codepoint] = cur;
            saveState();
            renderAll();
            showToast(state.lang === 'th' ? `เพิ่มตัวอย่างที่ ${list.length} ของ "${spec.char}" แล้ว (ของเดิมยังอยู่ครบ)` : `Added sample #${list.length} for ${spec.char}`);
          });
        }
        drawCellCanvas(canvas, spec, getStrokes(), w, h);
        updateCardChrome();
      }

      // --- Real Deterministic Handwriting Variation Engine (Mulberry32 Seeded) ---
      function createSeededRng(seed) {
        let a = (Number(seed) || 1) >>> 0;
        return () => {
          a = (a + 0x6D2B79F5) >>> 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function getValidInstances(glyph) {
        if (!glyph) return [];
        if (Array.isArray(glyph.instances) && glyph.instances.length > 0) {
          const valid = glyph.instances.filter(inst => inst && Array.isArray(inst.strokes) && inst.strokes.length > 0);
          if (valid.length > 0) return valid;
        }
        if (Array.isArray(glyph.strokes) && glyph.strokes.length > 0) {
          return [{ id: 'primary_' + glyph.codepoint, strokes: glyph.strokes }];
        }
        return [];
      }

      function getPreviewSourceProjects(primaryProj) {
        const selectedIds = new Set(Array.isArray(state.mixProjectIds) ? state.mixProjectIds : []);
        const extras = state.projects.filter(p => p.id !== primaryProj.id && selectedIds.has(p.id));
        return [primaryProj, ...extras];
      }

      function collectVariationInstances(cp, sourceProjects) {
        const pool = [];
        for (const p of sourceProjects) {
          const glyph = p && p.glyphs ? p.glyphs[cp] : null;
          if (!glyph) continue;
          const valid = getValidInstances(glyph);
          for (const inst of valid) {
            pool.push({
              ...inst,
              id: `${p.id}::${inst.id}`,
              sourceProjectId: p.id,
              sourceProjectName: p.name,
              canvasWidth: inst.canvasWidth || glyph.canvasWidth || 96,
              canvasHeight: inst.canvasHeight || glyph.canvasHeight || 120
            });
          }
        }
        return pool;
      }

      function computePreviewLayout(text, proj, variation, fontSize, lineHeight, baseTracking, guides, maxWidth, extraProjects = null) {
        const rng = createSeededRng(variation.seed);
        const lastChosenByCp = {};
        const padX = 28;
        const lineStep = fontSize * lineHeight;
        let cursorX = padX;
        let baselineY = padX + fontSize * 1.15;
        let activeBase = null;
        const items = [];
        const chars = Array.from(text);

        for (let i = 0; i < chars.length; i++) {
          const ch = chars[i];
          if (ch === '\n') {
            cursorX = padX;
            baselineY += lineStep;
            activeBase = null;
            items.push({ type: 'newline', char: '\n', index: i });
            continue;
          }

          const cp = ch.codePointAt(0);
          const isThai = cp >= 0x0E00 && cp <= 0x0E7F;
          const script = isThai ? 'thai' : 'english';
          const cfg = isThai ? variation.thai : variation.english;
          const intensity = Math.max(0, Math.min(100, Number(cfg.intensity) || 0)) / 100;

          if (ch === ' ') {
            // Word spacing applies ONLY to actual whitespace characters, independent of charSpacing!
            const wsCfg = (activeBase && activeBase.isThai) ? variation.thai : variation.english;
            const wsInt = Math.max(0, Math.min(100, Number(wsCfg.intensity) || 0)) / 100;
            const wsPct = Math.max(0, Math.min(50, Number(wsCfg.wordSpacing) || 0)) / 100;
            const baseSpace = fontSize * 0.36;
            const wordDelta = wsInt === 0 ? 0 : (rng() * 2 - 1) * wsPct * baseSpace * wsInt;
            const advance = Math.max(fontSize * 0.14, baseSpace + wordDelta + baseTracking);
            items.push({
              type: 'space', char: ' ', index: i, x: cursorX, y: baselineY,
              advance: Number(advance.toFixed(2)), wordDelta: Number(wordDelta.toFixed(2))
            });
            cursorX += advance;
            activeBase = null;
            continue;
          }

          const isAbove = ABOVE_VOWELS.has(cp);
          const isTone = TONE_MARKS.has(cp);
          const isBelow = BELOW_MARKS.has(cp);
          const isCombining = isAbove || isTone || isBelow;

          const sourceProjects = Array.isArray(extraProjects) && extraProjects.length > 0
            ? [proj, ...extraProjects.filter(p => p && p.id !== proj.id)]
            : getPreviewSourceProjects(proj);
          const glyph = proj.glyphs[cp];
          const validInsts = collectVariationInstances(cp, sourceProjects);

          // Real Glyph Instance Selection (ignores empty instances; primary at 0%; avoids consecutive repeat when >=2)
          let chosenIdx = 0;
          if (validInsts.length > 1 && intensity > 0) {
            const prev = lastChosenByCp[cp];
            const shouldVary = intensity >= 0.99 || rng() < intensity;
            if (shouldVary) {
              const candidates = [];
              for (let k = 0; k < validInsts.length; k++) {
                if (k !== prev) candidates.push(k);
              }
              chosenIdx = candidates[Math.floor(rng() * candidates.length)];
            } else {
              chosenIdx = 0;
            }
          }
          lastChosenByCp[cp] = chosenIdx;
          const selectedInst = validInsts.length > 0 ? validInsts[chosenIdx] : null;

          if (isCombining && activeBase) {
            // Thai combining mark inherits base scale, slant, and vertical offset — NEVER detaches or gets spacing!
            const isToneStacked = isTone && activeBase.hasUpperMark;
            if (isAbove) activeBase.hasUpperMark = true;
            let mMinX = Infinity, mMaxX = -Infinity;
            if (selectedInst) {
              selectedInst.strokes.forEach(st => st.points.forEach(p => { if (p.x < mMinX) mMinX = p.x; if (p.x > mMaxX) mMaxX = p.x; }));
            }
            items.push({
              type: 'glyph', char: ch, codepoint: cp, index: i, script, isCombining: true,
              validInstanceCount: validInsts.length,
              instanceIndex: chosenIdx,
              instanceId: selectedInst ? selectedInst.id : null,
              strokes: selectedInst ? selectedInst.strokes : null,
              sourceProjectId: selectedInst ? selectedInst.sourceProjectId : proj.id,
              canvasWidth: (selectedInst && selectedInst.canvasWidth) || (glyph && glyph.canvasWidth) || 96,
              canvasHeight: (selectedInst && selectedInst.canvasHeight) || (glyph && glyph.canvasHeight) || 120,
              minX: isFinite(mMinX) ? mMinX : 0,
              maxX: isFinite(mMaxX) ? mMaxX : 50,
              scaleFactor: activeBase.scaleFactor,
              slantDeg: activeBase.slantDeg,
              baselineY: activeBase.baselineY,
              baseCenterX: activeBase.xCenter,
              baseCp: activeBase.cp,
              stackAboveVowel: isToneStacked,
              charSpaceDelta: 0,
              charSpaceAfter: 0,
              attachedBaseIndex: activeBase.index
            });
            continue;
          }

          // Per-glyph size variation (seeded, bounded, baseline-consistent)
          const sizePct = Math.max(0, Math.min(50, Number(cfg.sizeVariation) || 0)) / 100;
          const scaleFactor = intensity === 0
            ? 1.0
            : Number(Math.max(0.65, Math.min(1.45, 1 + (rng() * 2 - 1) * sizePct * intensity)).toFixed(4));

          // Per-glyph slant (explicit base slant + subtle seeded jitter scaled by intensity)
          const baseSlant = Math.max(-25, Math.min(25, Number(cfg.slantAngle) || 0));
          const slantJitter = intensity === 0 ? 0 : (rng() * 2 - 1) * 3.5 * intensity;
          const slantDeg = Number(Math.max(-25, Math.min(25, baseSlant + slantJitter)).toFixed(2));

          const baselineJitterPx = intensity === 0 ? 0 : Number(((rng() * 2 - 1) * fontSize * 0.03 * intensity).toFixed(2));

          // Independent Character Spacing variation (applies between character clusters, never inside Thai mark clusters)
          const charSpacePct = Math.max(0, Math.min(50, Number(cfg.charSpacing) || 0)) / 100;
          const charSpaceDelta = intensity === 0 ? 0 : (rng() * 2 - 1) * charSpacePct * (fontSize * 0.28) * intensity;
          const charSpaceAfter = Number((fontSize * 0.12 + baseTracking + charSpaceDelta).toFixed(2));

          const chCanvas = (selectedInst && selectedInst.canvasHeight) || (glyph && glyph.canvasHeight) || 120;
          const span = Math.max(chCanvas * (guides.baseline - guides.ascender), 1);
          const scale = (fontSize * scaleFactor) / span;
          let minX = Infinity, maxX = -Infinity;
          if (selectedInst) {
            selectedInst.strokes.forEach(st => st.points.forEach(p => {
              if (p.x < minX) minX = p.x;
              if (p.x > maxX) maxX = p.x;
            }));
          }
          const glyphW = (selectedInst && isFinite(minX))
            ? Math.max((maxX - minX) * scale, fontSize * 0.22 * scaleFactor)
            : fontSize * 0.56 * scaleFactor;

          if (cursorX + glyphW > maxWidth - padX && cursorX > padX) {
            cursorX = padX;
            baselineY += lineStep;
          }

          const x = Number(cursorX.toFixed(2));
          const y = Number((baselineY + baselineJitterPx).toFixed(2));
          items.push({
            type: 'glyph', char: ch, codepoint: cp, index: i, script, isCombining: false,
            validInstanceCount: validInsts.length,
            instanceIndex: chosenIdx,
            instanceId: selectedInst ? selectedInst.id : null,
            strokes: selectedInst ? selectedInst.strokes : null,
            sourceProjectId: selectedInst ? selectedInst.sourceProjectId : proj.id,
            canvasWidth: (selectedInst && selectedInst.canvasWidth) || (glyph && glyph.canvasWidth) || 96,
            canvasHeight: chCanvas,
            minX: isFinite(minX) ? minX : 0,
            maxX: isFinite(maxX) ? maxX : 50,
            glyphW: Number(glyphW.toFixed(2)),
            x,
            baselineY: y,
            scaleFactor,
            slantDeg,
            charSpaceDelta: Number(charSpaceDelta.toFixed(2)),
            charSpaceAfter,
            attachedBaseIndex: null
          });

          activeBase = {
            index: i,
            xCenter: x + glyphW * 0.5,
            baselineY: y,
            scaleFactor,
            slantDeg,
            cp,
            isThai,
            hasUpperMark: false
          };
          cursorX += glyphW + Math.max(-fontSize * 0.06, charSpaceAfter);
        }
        return items;
      }

      // Live HandLine Variation Preview (Current Project's Actual Multi-Instance Handwriting)
      function renderEditorSimulatedPreview(canvas, text, fontSize, lineHeight, letterSpacing) {
        const ctx = canvas.getContext('2d');
        if (!ctx) return null;
        const proj = getActiveProject();
        const dpr = window.devicePixelRatio || 1;
        const width = canvas.clientWidth || 720, height = 280;
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        ctx.save(); ctx.scale(dpr, dpr);
        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, width, height);

        const layout = computePreviewLayout(text, proj, state.variation, fontSize, lineHeight, letterSpacing, state.guides, width);

        for (const item of layout) {
          if (item.type !== 'glyph') continue;
          const span = Math.max(item.canvasHeight * (state.guides.baseline - state.guides.ascender), 1);
          const scale = (fontSize * item.scaleFactor) / span;
          const shear = Math.tan((item.slantDeg * Math.PI) / 180);

          if (item.strokes && item.strokes.length > 0) {
            let offsetX, offsetY;
            let pivotX, pivotY;
            if (item.isCombining) {
              const markCenter = ((item.minX + item.maxX) / 2) * scale;
              const tallShift = TALL_ASCENDERS.has(item.baseCp) ? -fontSize * item.scaleFactor * 0.14 : 0;
              offsetX = item.baseCenterX - markCenter + tallShift;
              offsetY = item.baselineY - item.canvasHeight * state.guides.baseline * scale;
              if (item.stackAboveVowel) offsetY -= fontSize * item.scaleFactor * 0.24;
              pivotX = item.baseCenterX;
              pivotY = item.baselineY;
            } else {
              offsetX = item.x - item.minX * scale;
              offsetY = item.baselineY - item.canvasHeight * state.guides.baseline * scale;
              pivotX = item.x + item.glyphW * 0.5;
              pivotY = item.baselineY;
            }

            // Apply real geometric slant shear anchored at the base glyph's baseline so Thai marks stay locked!
            ctx.save();
            ctx.translate(pivotX, pivotY);
            if (Math.abs(shear) > 1e-4) ctx.transform(1, 0, -shear, 1, 0, 0);
            ctx.translate(-pivotX, -pivotY);

            ctx.strokeStyle = '#1D1D1F';
            ctx.fillStyle = '#1D1D1F';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            for (const st of item.strokes) {
              const pts = st.points;
              if (!pts || !pts.length) continue;
              if (pts.length === 1) {
                ctx.beginPath();
                ctx.arc(offsetX + pts[0].x * scale, offsetY + pts[0].y * scale, Math.max(1, st.width * scale * 0.5), 0, Math.PI * 2);
                ctx.fill();
                continue;
              }
              for (let k = 1; k < pts.length; k++) {
                const p0 = pts[k - 1], p1 = pts[k];
                ctx.lineWidth = Math.max(1.1, st.width * scale * (0.65 + 0.7 * ((p0.pressure + p1.pressure) / 2)));
                ctx.beginPath();
                ctx.moveTo(offsetX + p0.x * scale, offsetY + p0.y * scale);
                ctx.lineTo(offsetX + p1.x * scale, offsetY + p1.y * scale);
                ctx.stroke();
              }
            }
            ctx.restore();
          } else {
            // Unwritten character fallback rendered with exact same variation scale & slant
            ctx.save();
            const px = item.isCombining ? item.baseCenterX : item.x;
            const py = item.baselineY;
            ctx.translate(px, py);
            if (Math.abs(shear) > 1e-4) ctx.transform(1, 0, -shear, 1, 0, 0);
            ctx.fillStyle = '#C7C7CC';
            ctx.font = `400 ${Math.round(fontSize * item.scaleFactor)}px "Noto Sans Thai", "Inter", sans-serif`;
            ctx.textBaseline = 'alphabetic';
            ctx.fillText(item.char, 0, 0);
            ctx.restore();
          }
        }
        ctx.restore();
        return layout;
      }

      function generateFeaSnippet(proj) {
        const drawn = Object.values(proj.glyphs).filter(g => g.strokes && g.strokes.length > 0);
        const bases = drawn.filter(g => g.codepoint >= 0x0E01 && g.codepoint <= 0x0E2E);
        const above = drawn.filter(g => ABOVE_VOWELS.has(g.codepoint));
        const tones = drawn.filter(g => TONE_MARKS.has(g.codepoint));
        const lines = ['languagesystem DFLT dflt;', 'languagesystem thai dflt;', 'languagesystem latn dflt;', ''];
        above.forEach(g => {
          const geom = computeGlyphGeometry(g);
          const [ax, ay] = geom.anchors._top || [0, 540];
          lines.push(`markClass uni${g.codepoint.toString(16).toUpperCase().padStart(4,'0')} <anchor ${ax} ${ay}> @MC_top;`);
        });
        tones.forEach(g => {
          const geom = computeGlyphGeometry(g);
          const [ax, ay] = geom.anchors._tone || [0, 600];
          lines.push(`markClass uni${g.codepoint.toString(16).toUpperCase().padStart(4,'0')} <anchor ${ax} ${ay}> @MC_tone;`);
        });
        if (bases.length && (above.length || tones.length)) {
          lines.push('', 'feature mark {', '  lookup thai_mark_to_base {');
          bases.slice(0, 8).forEach(b => {
            const geom = computeGlyphGeometry(b);
            const [tx, ty] = geom.anchors.top || [300, 600];
            lines.push(`    pos base uni${b.codepoint.toString(16).toUpperCase().padStart(4,'0')} <anchor ${tx} ${ty}> mark @MC_top;`);
          });
          lines.push('  } thai_mark_to_base;', '} mark;');
        }
        if (above.length && tones.length) {
          lines.push('', 'feature mkmk {', '  lookup thai_tone_above_vowel {');
          above.slice(0, 5).forEach(v => {
            const geom = computeGlyphGeometry(v);
            const [vx, vy] = geom.anchors.top_tone || [0, 740];
            lines.push(`    pos mark uni${v.codepoint.toString(16).toUpperCase().padStart(4,'0')} <anchor ${vx} ${vy}> mark @MC_tone;`);
          });
          lines.push('  } thai_tone_above_vowel;', '} mkmk;');
        }
        return lines.join('\n');
      }

        document.getElementById('studioSampleBtn').addEventListener('click', loadSampleGlyphs);

        document.getElementById('toolEraserBtn').addEventListener('click', () => { state.tool = 'eraser'; renderAll(); });
        document.getElementById('strokeWidthSlider').addEventListener('input', (e) => { state.strokeWidth = Number(e.target.value); e.target.previousElementSibling.textContent = state.strokeWidth.toFixed(1) + 'px'; saveState(); });
        document.getElementById('toggleCenterGuide').addEventListener('change', (e) => { state.showCenterGuide = e.target.checked; saveState(); renderAll(); });

      function renderPreview(main) {
        const presetBtns = PRESET_SENTENCES.map((s, idx) => `
          <button type="button" data-preset="${idx}" class="px-3 py-1.5 rounded-xl bg-white border border-[#E5E5EA] hover:border-[#1D1D1F] text-xs truncate max-w-[280px]">${s}</button>

        const activeFontFamily = state.customLoadedFontFamily || 'SampleThaiHandwriting';
        const activeFontLabel = state.customLoadedFontName || 'SampleThaiHandwriting-Regular.ttf (Compiled with FontTools GDEF/GPOS/GSUB)';

        main.innerHTML = `
          <div class="max-w-5xl mx-auto space-y-5">
            <div class="flex flex-wrap items-end justify-between gap-3">
              <div>
                <h1 class="text-2xl font-semibold tracking-tight">${t('previewTitle')}</h1>

                <div class="inline-flex rounded-xl bg-white p-1 border border-[#E5E5EA] text-xs">
                <button id="modeSimBtn" type="button" class="px-3 py-1.5 rounded-lg font-medium ${state.previewMode === 'editor_simulated' ? 'bg-[#1D1D1F] text-white' : 'text-[#6E6E73]'}">

                </button>
                <button id="modeRealBtn" type="button" class="px-3 py-1.5 rounded-lg font-medium ${state.previewMode === 'real_ttf' ? 'bg-[#1D1D1F] text-white' : 'text-[#6E6E73]'}">
                  ${state.lang === 'th' ? 'ตัวอย่าง / อัปโหลด .TTF' : 'Sample / Uploaded .TTF'}
                </button>
                </div>
              </div>
            </div>

            <div class="flex flex-wrap gap-2">${presetBtns}</div>
            <textarea id="previewInput" rows="3" class="w-full rounded-2xl border border-[#E5E5EA] bg-white p-4 text-sm focus:outline-none focus:border-[#1D1D1F]">${state.previewText}</textarea>

            <!-- Handwriting Variation Engine & Slant Controls -->
            <div class="bg-white rounded-2xl border border-[#E5E5EA] p-4 space-y-3 text-xs">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  <span class="font-semibold">${state.lang === 'th' ? 'Handwriting Variation Engine & Slant' : 'Handwriting Variation Engine & Slant'}</span>
                  <div class="inline-flex rounded-lg bg-[#F5F5F7] p-0.5 border border-[#E5E5EA]">
                    <button id="varTabThai" type="button" class="px-2.5 py-1 rounded-md font-medium ${state.varScriptTab === 'thai' ? 'bg-[#1D1D1F] text-white' : 'text-[#6E6E73]'}">ไทย (Thai)</button>
                    <button id="varTabEng" type="button" class="px-2.5 py-1 rounded-md font-medium ${state.varScriptTab === 'english' ? 'bg-[#1D1D1F] text-white' : 'text-[#6E6E73]'}">English</button>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <label class="flex items-center gap-1 text-[#6E6E73]">Seed: <input id="varSeedInput" type="number" value="${state.variation.seed}" class="w-24 px-2 py-1 rounded-lg border border-[#D2D2D7] text-[#1D1D1F] font-mono" /></label>
                  <button id="varRandomBtn" type="button" class="px-2.5 py-1 rounded-lg bg-[#1D1D1F] text-white font-medium">Randomize</button>
                  <button id="varResetBtn" type="button" class="px-2.5 py-1 rounded-lg border border-[#D2D2D7] hover:bg-[#F5F5F7] font-medium">Reset</button>
                </div>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
                <label class="space-y-1"><span class="text-[#6E6E73]">Intensity: <strong id="vIntVal">${state.variation[state.varScriptTab].intensity}%</strong></span><input id="vIntSlider" type="range" min="0" max="100" value="${state.variation[state.varScriptTab].intensity}" class="w-full" /></label>
                <label class="space-y-1"><span class="text-[#6E6E73]">Size Var: <strong id="vSizeVal">${state.variation[state.varScriptTab].sizeVariation}%</strong></span><input id="vSizeSlider" type="range" min="0" max="50" value="${state.variation[state.varScriptTab].sizeVariation}" class="w-full" /></label>
                <label class="space-y-1"><span class="text-[#6E6E73]">Slant: <strong id="vSlantVal">${state.variation[state.varScriptTab].slantAngle}°</strong></span><input id="vSlantSlider" type="range" min="-25" max="25" value="${state.variation[state.varScriptTab].slantAngle}" class="w-full" /></label>
                <label class="space-y-1"><span class="text-[#6E6E73]">Char Space: <strong id="vCharVal">${state.variation[state.varScriptTab].charSpacing}%</strong></span><input id="vCharSlider" type="range" min="0" max="50" value="${state.variation[state.varScriptTab].charSpacing}" class="w-full" /></label>
                <label class="space-y-1"><span class="text-[#6E6E73]">Word Space: <strong id="vWordVal">${state.variation[state.varScriptTab].wordSpacing}%</strong></span><input id="vWordSlider" type="range" min="0" max="50" value="${state.variation[state.varScriptTab].wordSpacing}" class="w-full" /></label>
              </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-4 bg-white rounded-2xl border border-[#E5E5EA] px-4 py-3 text-xs">
              <div class="flex flex-wrap items-center gap-6">
                <label class="flex items-center gap-2"><span class="text-[#6E6E73]">${state.lang === 'th' ? 'ขนาด' : 'Size'}: <strong id="pvSizeVal">${state.previewSize}px</strong></span><input id="pvSizeSlider" type="range" min="24" max="84" value="${state.previewSize}" /></label>
                <label class="flex items-center gap-2"><span class="text-[#6E6E73]">${state.lang === 'th' ? 'ระยะบรรทัด' : 'Line Height'}: <strong id="pvLhVal">${state.previewLineHeight}</strong></span><input id="pvLhSlider" type="range" min="1.2" max="2.4" step="0.1" value="${state.previewLineHeight}" /></label>
                <label class="flex items-center gap-2"><span class="text-[#6E6E73]">${state.lang === 'th' ? 'ช่องไฟ' : 'Tracking'}: <strong id="pvSpVal">${state.previewSpacing}px</strong></span><input id="pvSpSlider" type="range" min="-2" max="12" step="1" value="${state.previewSpacing}" /></label>

              ${state.previewMode === 'real_ttf' ? `
                <label class="cursor-pointer px-3 py-1.5 rounded-xl bg-[#F5F5F7] hover:bg-[#E5E5EA] font-medium">
