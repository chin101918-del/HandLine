    :root {
      --bg-canvas: #F5F5F7;
      --bg-surface: #FFFFFF;

      font-family: 'Inter', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;

      touch-action: none;
      user-select: none;

      border-radius: 999px;
      padding: 0.06em 0.45em;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .rich-editor:empty:before {
      content: attr(data-placeholder);
      color: #A1A1AA;
      pointer-events: none;
    }
    .rich-editor ul { list-style-type: disc; padding-left: 1.4rem; margin: 0.2rem 0; }
    .rich-editor ol { list-style-type: decimal; padding-left: 1.4rem; margin: 0.2rem 0; }
    .rich-editor li { margin: 0.15rem 0; }
      [data-tb-input]::selection,
    [data-tb-input] *::selection {
      color: transparent !important;
      background: rgba(0, 113, 227, 0.16);
    }
    [data-tb-input]:empty::before {
      content: attr(data-placeholder);
      color: #A1A1AA;
      font-size: 14px;
      pointer-events: none;

      // Sleek Integrated Apple-style Color Picker (replaces clunky native OS <input type="color"> popup)
      function hexToHsv(hex) {
        let c = (hex || '#1D1D1F').replace('#', '').trim();
        if (c.length === 3) c = c.split('').map(x => x + x).join('');
        if (!/^[0-9a-fA-F]{6}$/.test(c)) c = '1D1D1F';
        const r = parseInt(c.slice(0, 2), 16) / 255;
        const g = parseInt(c.slice(2, 4), 16) / 255;
        const b = parseInt(c.slice(4, 6), 16) / 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
        let h = 0;
        if (d !== 0) {
          if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
          else if (max === g) h = ((b - r) / d + 2) * 60;
          else h = ((r - g) / d + 4) * 60;
        }
        const s = max === 0 ? 0 : d / max;
        return { h, s, v: max };
      }
      function hsvToHex(h, s, v) {
        const c = v * s;
        const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
        const m = v - c;
        let r = 0, g = 0, b = 0;
        if (h < 60) { r = c; g = x; }
        else if (h < 120) { r = x; g = c; }
        else if (h < 180) { g = c; b = x; }
        else if (h < 240) { g = x; b = c; }
        else if (h < 300) { r = x; b = c; }
        else { r = c; b = x; }
        const toHex = (n) => Math.round((n + m) * 255).toString(16).padStart(2, '0');
        return ('#' + toHex(r) + toHex(g) + toHex(b)).toUpperCase();
      }

      // --- IndexedDB + Debounced Persistence (fixes 2nd-stroke lag!) ---
      function openHandLineDB() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
          const timer = setTimeout(() => reject(new Error('IDB timeout')), 1200);
          const req = indexedDB.open(IDB_NAME, IDB_VER);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('font_sets')) db.createObjectStore('font_sets', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
          };
          req.onsuccess = () => { clearTimeout(timer); resolve(req.result); };
          req.onerror = () => { clearTimeout(timer); reject(req.error); };
        });
      }

          if (currentState) {
            tx.objectStore('meta').put({

              activeProjectId: currentState.activeProjectId,
              variation: currentState.variation,
              inputMode: currentState.inputMode,

      // --- Smooth Curve Drawing (Quadratic Midpoint Bezier) ---
      function drawSmoothStroke(ctx, stroke, scale = 1, offsetX = 0, offsetY = 0, pressureSensitive = true, inkColor = '#1D1D1F') {
        const pts = stroke.points;
        if (!pts || pts.length === 0) return;
        ctx.strokeStyle = inkColor;
        ctx.fillStyle = inkColor;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (pts.length === 1) {
          const p = pts[0];
          const r = Math.max(1, stroke.width * scale * 0.5 * (pressureSensitive ? 0.65 + 0.7 * (p.pressure ?? 0.5) : 1));
          ctx.beginPath();
          ctx.arc(offsetX + p.x * scale, offsetY + p.y * scale, r, 0, Math.PI * 2);
          ctx.fill();
          return;
        }

        if (pts.length === 2) {
          const p0 = pts[0], p1 = pts[1];
          const pr = pressureSensitive ? ((p0.pressure ?? 0.5) + (p1.pressure ?? 0.5)) / 2 : 0.5;
          ctx.lineWidth = Math.max(1.1, stroke.width * scale * (0.65 + 0.7 * pr));
          ctx.beginPath();
          ctx.moveTo(offsetX + p0.x * scale, offsetY + p0.y * scale);
          ctx.lineTo(offsetX + p1.x * scale, offsetY + p1.y * scale);
          ctx.stroke();
          return;
        }

        // Smooth quadratic Bézier curve through midpoints
        let prevMidX = offsetX + ((pts[0].x + pts[1].x) * 0.5) * scale;
        let prevMidY = offsetY + ((pts[0].y + pts[1].y) * 0.5) * scale;

        // First half-segment
        ctx.lineWidth = Math.max(1.1, stroke.width * scale * (pressureSensitive ? 0.65 + 0.7 * (pts[0].pressure ?? 0.5) : 1));
        ctx.beginPath();
        ctx.moveTo(offsetX + pts[0].x * scale, offsetY + pts[0].y * scale);
        ctx.lineTo(prevMidX, prevMidY);
        ctx.stroke();

        for (let i = 1; i < pts.length - 1; i++) {
          const curr = pts[i];
          const next = pts[i + 1];
          const midX = offsetX + ((curr.x + next.x) * 0.5) * scale;
          const midY = offsetY + ((curr.y + next.y) * 0.5) * scale;
          const pr = pressureSensitive ? (curr.pressure ?? 0.5) : 0.5;
          ctx.lineWidth = Math.max(1.1, stroke.width * scale * (0.65 + 0.7 * pr));
          ctx.beginPath();
          ctx.moveTo(prevMidX, prevMidY);
          ctx.quadraticCurveTo(offsetX + curr.x * scale, offsetY + curr.y * scale, midX, midY);
          ctx.stroke();
          prevMidX = midX;
          prevMidY = midY;
        }

        // Final half-segment
        const last = pts[pts.length - 1];
        ctx.lineWidth = Math.max(1.1, stroke.width * scale * (pressureSensitive ? 0.65 + 0.7 * (last.pressure ?? 0.5) : 1));
        ctx.beginPath();
        ctx.moveTo(prevMidX, prevMidY);
        ctx.lineTo(offsetX + last.x * scale, offsetY + last.y * scale);
        ctx.stroke();
      }

      // --- Seeded Variation Engine + Cross-Project Character Variation ---
      function createSeededRng(seed) {
        let a = (Number(seed) || 1) >>> 0;
        return () => {
          a = (a + 0x6D2B79F5) >>> 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function getValidInstances(glyph) {
        if (!glyph) return [];
        if (Array.isArray(glyph.instances) && glyph.instances.length > 0) {
          const valid = glyph.instances.filter(inst => inst && Array.isArray(inst.strokes) && inst.strokes.length > 0);
          if (valid.length > 0) return valid;
        }
        if (Array.isArray(glyph.strokes) && glyph.strokes.length > 0) {
          return [{ id: 'primary_' + glyph.codepoint, strokes: glyph.strokes }];
        }
        return [];
      }

      function collectVariationInstances(cp, sourceProjects) {
        const pool = [];
        for (const p of sourceProjects) {
          if (!p) continue;
          if (p.fontType === 'ttf' && p.ttfFamily) {
            pool.push({
              id: `${p.id}::ttf`,
              isTtf: true,
              ttfFamily: p.ttfFamily,
              strokes: null,
              sourceProjectId: p.id,
              sourceProjectName: p.name,
              canvasWidth: 96,
              canvasHeight: 120
            });
            continue;
          }
          const glyph = p.glyphs ? p.glyphs[cp] : null;
          if (!glyph) continue;
          const valid = getValidInstances(glyph);
          for (const inst of valid) {
            pool.push({
              ...inst,
              id: `${p.id}::${inst.id}`,
              sourceProjectId: p.id,
              sourceProjectName: p.name,
              canvasWidth: inst.canvasWidth || glyph.canvasWidth || 96,
              canvasHeight: inst.canvasHeight || glyph.canvasHeight || 120
            });
          }
        }
        return pool;
      }

      // Parse rich lines (bullet `- ` / `* `, numbered `1. `, and `==highlight==` pill spans)
      function parseRichPreviewLines(rawText) {
        return rawText.split('\n').map(line => {
          let listType = null;
          let listPrefix = '';
          let content = line;

          const bulletMatch = line.match(/^\s*[-*]\s+(.*)$/);
          const numMatch = line.match(/^\s*(\d+\.)\s+(.*)$/);
          if (bulletMatch) {
            listType = 'bullet';
            listPrefix = '•';
            content = bulletMatch[1];
          } else if (numMatch) {
            listType = 'number';
            listPrefix = numMatch[1];
            content = numMatch[2];
          }

          // Split into plain & ==highlighted== segments
          const segments = [];
          const regex = /==([^=]+)==/g;
          let lastIdx = 0;
          let m;
          while ((m = regex.exec(content)) !== null) {
            if (m.index > lastIdx) segments.push({ text: content.slice(lastIdx, m.index), highlighted: false });
            segments.push({ text: m[1], highlighted: true });
            lastIdx = regex.lastIndex;
          }
          if (lastIdx < content.length) segments.push({ text: content.slice(lastIdx), highlighted: false });
          if (segments.length === 0) segments.push({ text: '', highlighted: false });

          return { listType, listPrefix, segments };
        });
      }

      function extractRichLinesFromEditor(editorEl) {
        if (!editorEl) return [];
        const lines = [];

        const collectSegments = (node, activeHl = null, out = []) => {
          if (node.nodeType === 3) {
            const txt = node.nodeValue || '';
            if (txt) out.push({ text: txt, highlighted: Boolean(activeHl), hlColor: activeHl });
            return out;
          }
          if (node.nodeType !== 1) return out;
          const tag = node.tagName.toUpperCase();
          if (tag === 'BR') return out;
          let nextHl = activeHl;
          if (tag === 'MARK' || node.classList.contains('pill-hl') || node.getAttribute('data-hl-color')) {
            nextHl = node.getAttribute('data-hl-color') || node.style.backgroundColor || state.previewHighlightColor;
          }
          for (const child of Array.from(node.childNodes)) {
            collectSegments(child, nextHl, out);
          }
          return out;
        };

        const walkBlock = (container) => {
          let inlineBuf = [];
          const flushInline = () => {
            if (inlineBuf.length > 0) {
              lines.push({ listType: null, listPrefix: '', segments: inlineBuf });
              inlineBuf = [];
            }
          };

          for (const child of Array.from(container.childNodes)) {
            if (child.nodeType === 3) {
              const txt = (child.nodeValue || '').replace(/\r/g, '');
              if (txt) inlineBuf.push({ text: txt, highlighted: false, hlColor: null });
              continue;
            }
            if (child.nodeType !== 1) continue;
            const tag = child.tagName.toUpperCase();
            if (tag === 'UL' || tag === 'OL') {
              flushInline();
              let num = 1;
              for (const li of Array.from(child.children)) {
                if (li.tagName.toUpperCase() !== 'LI') continue;
                const segs = collectSegments(li, null, []);
                lines.push({
                  listType: tag === 'UL' ? 'bullet' : 'number',
                  listPrefix: tag === 'UL' ? '•' : `${num++}.`,
                  segments: segs.length ? segs : [{ text: '', highlighted: false, hlColor: null }]
                });
              }
            } else if (tag === 'DIV' || tag === 'P') {
              flushInline();
              const hasNestedList = Array.from(child.children).some(c => ['UL', 'OL', 'DIV', 'P'].includes(c.tagName.toUpperCase()));
              if (hasNestedList) {
                walkBlock(child);
              } else {
                const segs = collectSegments(child, null, []);
                lines.push({
                  listType: null,
                  listPrefix: '',
                  segments: segs.length ? segs : [{ text: '', highlighted: false, hlColor: null }]
                });
              }
            } else if (tag === 'BR') {
              flushInline();
              lines.push({ listType: null, listPrefix: '', segments: [{ text: '', highlighted: false, hlColor: null }] });
            } else {
              collectSegments(child, null, inlineBuf);
            }
          }
          flushInline();
        };

        walkBlock(editorEl);
        return lines.length ? lines : [{ listType: null, listPrefix: '', segments: [{ text: '', highlighted: false, hlColor: null }] }];
      }

      function computePreviewLayout(input, proj, variation, fontSize, lineHeight, baseTracking, guides, maxWidth, extraProjects = null, measureCtx = null, isA4 = false) {
        const rng = createSeededRng(variation.seed);
        const lastChosenByCp = {};
        const padX = isA4 ? Math.round(maxWidth * 0.09) : 28;
        const lineStep = fontSize * lineHeight;
        let baselineY = padX + fontSize * 1.15;
        const items = [];
        const pills = [];
        const markers = [];
        const richLines = Array.isArray(input) ? input : parseRichPreviewLines(String(input || ''));

        const sourceProjects = Array.isArray(extraProjects) && extraProjects.length > 0
          ? [proj, ...extraProjects.filter(p => p && p.id !== proj.id)]
          : getPreviewSourceProjects(proj);

        for (let lineIdx = 0; lineIdx < richLines.length; lineIdx++) {
          const line = richLines[lineIdx];
          const indentPx = line.listType ? Math.round(fontSize * 0.95) : 0;
          let cursorX = padX + indentPx;
          let activeBase = null;

          if (line.listType) {
            let mx = padX;
            const prefixChars = Array.from(line.listPrefix);
            const mCfg = variation.english;
            const mInt = Math.max(0, Math.min(100, Number(mCfg.intensity) || 0)) / 100;
            for (const mch of prefixChars) {
              const mcp = mch.codePointAt(0);
              const mInsts = collectVariationInstances(mcp, sourceProjects);
              let mChosen = 0;
              if (mInsts.length > 1 && mInt > 0) {
                const prevM = lastChosenByCp[mcp];
                const cands = [];
                for (let k = 0; k < mInsts.length; k++) if (k !== prevM) cands.push(k);
                mChosen = cands[Math.floor(rng() * cands.length)];
              }
              lastChosenByCp[mcp] = mChosen;
              const mSel = mInsts.length > 0 ? mInsts[mChosen] : null;
              const mSizePct = Math.max(0, Math.min(50, Number(mCfg.sizeVariation) || 0)) / 100;
              const mScale = mInt === 0 ? 1.0 : Number(Math.max(0.75, Math.min(1.3, 1 + (rng() * 2 - 1) * mSizePct * mInt)).toFixed(4));
              const mSlant = Number(Math.max(-25, Math.min(25, (Number(mCfg.slantAngle) || 0) + (mInt === 0 ? 0 : (rng() * 2 - 1) * 3.0 * mInt))).toFixed(2));
              const mChH = (mSel && mSel.canvasHeight) || 120;
              const mSpan = Math.max(mChH * (guides.baseline - guides.ascender), 1);
              const mPxScale = (fontSize * 0.88 * mScale) / mSpan;
              let mmMinX = Infinity, mmMaxX = -Infinity;
              if (mSel && mSel.strokes) {
                mSel.strokes.forEach(st => st.points.forEach(pt => { if (pt.x < mmMinX) mmMinX = pt.x; if (pt.x > mmMaxX) mmMaxX = pt.x; }));
              }
              let mw;
              if (mSel && mSel.strokes && isFinite(mmMinX)) {
                mw = Math.max((mmMaxX - mmMinX) * mPxScale, fontSize * 0.18 * mScale);
              } else if (measureCtx) {
                const mFam = (mSel && mSel.isTtf && mSel.ttfFamily) ? `"${mSel.ttfFamily}", "Noto Sans Thai", sans-serif` : '"Noto Sans Thai", "Inter", sans-serif';
                measureCtx.font = `400 ${Math.round(fontSize * 0.88 * mScale)}px ${mFam}`;
                mw = Math.max(measureCtx.measureText(mch).width, fontSize * 0.18 * mScale);
              } else {
                mw = fontSize * 0.34 * mScale;
              }
              items.push({
                type: 'glyph', char: mch, codepoint: mcp, script: 'english', isCombining: false, isListMarker: true,
                sourceProjectId: mSel ? mSel.sourceProjectId : proj.id,
                instanceIndex: mChosen,
                instanceId: mSel ? mSel.id : null,
                isTtf: Boolean(mSel && mSel.isTtf),
                ttfFamily: mSel && mSel.ttfFamily ? mSel.ttfFamily : null,
                strokes: mSel ? mSel.strokes : null,
                canvasWidth: (mSel && mSel.canvasWidth) || 96,
                canvasHeight: mChH,
                minX: isFinite(mmMinX) ? mmMinX : 0, maxX: isFinite(mmMaxX) ? mmMaxX : 50,
                glyphW: Number(mw.toFixed(2)), x: Number(mx.toFixed(2)), baselineY: Number(baselineY.toFixed(2)),
                scaleFactor: Number((mScale * 0.88).toFixed(4)), slantDeg: mSlant, charSpaceDelta: 0, charSpaceAfter: 0, attachedBaseIndex: null
              });
              mx += mw + fontSize * 0.05;
            }
          }

          for (const seg of line.segments) {
            const segChars = Array.from(seg.text);
            let pillStartX = seg.highlighted ? cursorX : null;
            let pillLineY = baselineY;

            for (let i = 0; i < segChars.length; i++) {
              const ch = segChars[i];
              const cp = ch.codePointAt(0);
              const isThai = cp >= 0x0E00 && cp <= 0x0E7F;
              const script = isThai ? 'thai' : 'english';
              const cfg = isThai ? variation.thai : variation.english;
              const intensity = Math.max(0, Math.min(100, Number(cfg.intensity) || 0)) / 100;

              if (ch === ' ') {
                const wsCfg = (activeBase && activeBase.isThai) ? variation.thai : variation.english;
                const wsInt = Math.max(0, Math.min(100, Number(wsCfg.intensity) || 0)) / 100;
                const wsPct = Math.max(0, Math.min(50, Number(wsCfg.wordSpacing) || 0)) / 100;
                const baseSpace = fontSize * 0.36;
                const wordDelta = wsInt === 0 ? 0 : (rng() * 2 - 1) * wsPct * baseSpace * wsInt;
                const advance = Math.max(fontSize * 0.14, baseSpace + wordDelta + baseTracking);
                items.push({ type: 'space', char: ' ', x: cursorX, y: baselineY, advance: Number(advance.toFixed(2)), wordDelta: Number(wordDelta.toFixed(2)) });
                cursorX += advance;
                activeBase = null;
                continue;
              }

              const isAbove = ABOVE_VOWELS.has(cp);
              const isTone = TONE_MARKS.has(cp);
              const isBelow = BELOW_MARKS.has(cp);
              const isCombining = isAbove || isTone || isBelow;
              const validInsts = collectVariationInstances(cp, sourceProjects);

              let chosenIdx = 0;
              if (validInsts.length > 1 && intensity > 0) {
                const prev = lastChosenByCp[cp];
                const shouldVary = intensity >= 0.99 || rng() < intensity;
                if (shouldVary) {
                  const cands = [];
                  for (let k = 0; k < validInsts.length; k++) if (k !== prev) cands.push(k);
                  chosenIdx = cands[Math.floor(rng() * cands.length)];
                }
              }
              lastChosenByCp[cp] = chosenIdx;
              const selectedInst = validInsts.length > 0 ? validInsts[chosenIdx] : null;

              if (isCombining && activeBase) {
                const isToneStacked = isTone && activeBase.hasUpperMark;
                if (isAbove) activeBase.hasUpperMark = true;
                let mMinX = Infinity, mMaxX = -Infinity;
                if (selectedInst && selectedInst.strokes) {
                  selectedInst.strokes.forEach(st => st.points.forEach(p => { if (p.x < mMinX) mMinX = p.x; if (p.x > mMaxX) mMaxX = p.x; }));
                }
                items.push({
                  type: 'glyph', char: ch, codepoint: cp, script, isCombining: true,
                  sourceProjectId: selectedInst ? selectedInst.sourceProjectId : proj.id,
                  instanceIndex: chosenIdx,
                  instanceId: selectedInst ? selectedInst.id : null,
                  isTtf: Boolean(selectedInst && selectedInst.isTtf),
                  ttfFamily: selectedInst && selectedInst.ttfFamily ? selectedInst.ttfFamily : null,
                  strokes: selectedInst ? selectedInst.strokes : null,
                  canvasWidth: (selectedInst && selectedInst.canvasWidth) || 96,
                  canvasHeight: (selectedInst && selectedInst.canvasHeight) || 120,
                  minX: isFinite(mMinX) ? mMinX : 0, maxX: isFinite(mMaxX) ? mMaxX : 50,
                  scaleFactor: activeBase.scaleFactor, slantDeg: activeBase.slantDeg,
                  baselineY: activeBase.baselineY, baseCenterX: activeBase.xCenter,
                  baseCp: activeBase.cp, stackAboveVowel: isToneStacked,
                  charSpaceDelta: 0, charSpaceAfter: 0, attachedBaseIndex: activeBase.itemIdx
                });
                continue;
              }

              const sizePct = Math.max(0, Math.min(50, Number(cfg.sizeVariation) || 0)) / 100;
              const scaleFactor = intensity === 0 ? 1.0 : Number(Math.max(0.65, Math.min(1.45, 1 + (rng() * 2 - 1) * sizePct * intensity)).toFixed(4));
              const baseSlant = Math.max(-25, Math.min(25, Number(cfg.slantAngle) || 0));
              const slantJitter = intensity === 0 ? 0 : (rng() * 2 - 1) * 3.5 * intensity;
              const slantDeg = Number(Math.max(-25, Math.min(25, baseSlant + slantJitter)).toFixed(2));
              const baselineJitterPx = intensity === 0 ? 0 : Number(((rng() * 2 - 1) * fontSize * 0.03 * intensity).toFixed(2));
              const charSpacePct = Math.max(0, Math.min(50, Number(cfg.charSpacing) || 0)) / 100;
              const charSpaceDelta = intensity === 0 ? 0 : (rng() * 2 - 1) * charSpacePct * (fontSize * 0.28) * intensity;
              const isDrawnGlyph = Boolean(selectedInst && selectedInst.strokes && selectedInst.strokes.length > 0);
              const baseCharGap = isDrawnGlyph ? fontSize * 0.04 : 0;
              const charSpaceAfter = Number((baseCharGap + baseTracking + charSpaceDelta).toFixed(2));

              const chCanvas = (selectedInst && selectedInst.canvasHeight) || 120;
              const span = Math.max(chCanvas * (guides.baseline - guides.ascender), 1);
              const scale = (fontSize * scaleFactor) / span;
              let minX = Infinity, maxX = -Infinity;
              if (selectedInst && selectedInst.strokes) {
                selectedInst.strokes.forEach(st => st.points.forEach(p => { if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x; }));
              }
              let glyphW;
              if (selectedInst && selectedInst.strokes && isFinite(minX)) {
                glyphW = Math.max((maxX - minX) * scale, fontSize * 0.18 * scaleFactor);
              } else if (measureCtx) {
                const fam = (selectedInst && selectedInst.isTtf && selectedInst.ttfFamily)
                  ? `"${selectedInst.ttfFamily}", "Noto Sans Thai", sans-serif`
                  : '"Noto Sans Thai", "Inter", sans-serif';
                measureCtx.font = `400 ${Math.round(fontSize * scaleFactor)}px ${fam}`;
                glyphW = Math.max(measureCtx.measureText(ch).width, fontSize * 0.16 * scaleFactor);
              } else {
                glyphW = fontSize * 0.50 * scaleFactor;
              }

              if (cursorX + glyphW > maxWidth - padX && cursorX > padX + indentPx) {
                if (seg.highlighted && pillStartX !== null && cursorX > pillStartX) {
                  pills.push({ x: pillStartX, y: pillLineY, width: cursorX - pillStartX, color: seg.hlColor || state.previewHighlightColor });
                }
                cursorX = padX + indentPx;
                baselineY += lineStep;
                if (seg.highlighted) { pillStartX = cursorX; pillLineY = baselineY; }
              }

              const x = Number(cursorX.toFixed(2));
              const y = Number((baselineY + baselineJitterPx).toFixed(2));
              const itemIdx = items.length;
              items.push({
                type: 'glyph', char: ch, codepoint: cp, script, isCombining: false,
                sourceProjectId: selectedInst ? selectedInst.sourceProjectId : proj.id,
                instanceIndex: chosenIdx,
                instanceId: selectedInst ? selectedInst.id : null,
                isTtf: Boolean(selectedInst && selectedInst.isTtf),
                ttfFamily: selectedInst && selectedInst.ttfFamily ? selectedInst.ttfFamily : null,
                strokes: selectedInst ? selectedInst.strokes : null,
                canvasWidth: (selectedInst && selectedInst.canvasWidth) || 96,
                canvasHeight: chCanvas,
                minX: isFinite(minX) ? minX : 0, maxX: isFinite(maxX) ? maxX : 50,
                glyphW: Number(glyphW.toFixed(2)), x, baselineY: y,
                scaleFactor, slantDeg, charSpaceDelta: Number(charSpaceDelta.toFixed(2)),
                charSpaceAfter, attachedBaseIndex: null
              });

              activeBase = { itemIdx, xCenter: x + glyphW * 0.5, baselineY: y, scaleFactor, slantDeg, cp, isThai, hasUpperMark: false };
              cursorX += glyphW + Math.max(-fontSize * 0.06, charSpaceAfter);
            }

            if (seg.highlighted && pillStartX !== null && cursorX > pillStartX) {
              pills.push({ x: pillStartX, y: pillLineY, width: cursorX - pillStartX, color: seg.hlColor || state.previewHighlightColor });
            }
          }
          baselineY += lineStep;
        }
        return { items, pills, markers, totalHeight: Math.max(280, Math.round(baselineY + 24)) };
      }

      // Draw Pill-Shaped Highlight Capsule
      function drawPillRect(ctx, x, y, w, h, color) {
        const r = Math.min(h / 2, w / 2);
        ctx.save();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.arcTo(x + w, y, x + w, y + r, r);
        ctx.lineTo(x + w, y + h - r);
        ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
        ctx.lineTo(x + r, y + h);
        ctx.arcTo(x, y + h, x, y + h - r, r);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y, x + r, y, r);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function renderVariationPreviewCanvas(canvas, text, fontSize, lineHeight, letterSpacing) {
        const ctx = canvas.getContext('2d');
        if (!ctx) return null;
        const proj = getActiveProject();
        const dpr = window.devicePixelRatio || 1;
        const isA4 = Boolean(state.a4PreviewMode);
        const parentW = canvas.parentElement ? canvas.parentElement.clientWidth : 0;
        const width = Math.max(280, Math.round(isA4 ? Math.min(parentW || 794, 794) : (parentW || canvas.clientWidth || 720)));
        const result = computePreviewLayout(text, proj, state.variation, fontSize, lineHeight, letterSpacing, state.guides, width, null, ctx, isA4);
        const a4Height = Math.round(width * (297 / 210));
        const height = isA4 ? Math.max(a4Height, result.totalHeight) : Math.max(360, result.totalHeight);

        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);
        // Draw imported PDF page as background if present
        if (loadedPdfBgCanvas && (isA4 || loadedPdfDoc)) {
          ctx.drawImage(loadedPdfBgCanvas, 0, 0, width, height);
        }

        // 1. Draw Pill-Shaped Highlights underneath text
        const pillPadX = Math.round(fontSize * 0.24);
        const pillH = Math.round(fontSize * 1.18);
        for (const p of result.pills) {
          drawPillRect(ctx, p.x - pillPadX, p.y - fontSize * 0.86, p.width + pillPadX * 2, pillH, p.color || state.previewHighlightColor);
        }

        // 2. Draw Bullet & Numbered List Markers
        ctx.fillStyle = state.previewTextColor;
        for (const mk of result.markers) {
          if (mk.type === 'bullet') {
            ctx.beginPath();
            ctx.arc(mk.x, mk.y - fontSize * 0.30, Math.max(2.5, fontSize * 0.085), 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.font = `500 ${Math.round(fontSize * 0.62)}px "Inter", "Noto Sans Thai", sans-serif`;
            ctx.textBaseline = 'alphabetic';
            ctx.fillText(mk.prefix, mk.x, mk.y - fontSize * 0.04);
          }
        }

        // Helper to draw a layout's items with perfect Thai cluster shaping (zero shifted vowels/tones!)
        const drawLayoutItems = (itemsList, baseFontSize, inkColor, dx = 0, dy = 0, fallbackAlpha = 0.30) => {
          for (let idx = 0; idx < itemsList.length; idx++) {
            const item = itemsList[idx];
            if (item.type !== 'glyph') continue;
            const span = Math.max(item.canvasHeight * (state.guides.baseline - state.guides.ascender), 1);
            const scale = (baseFontSize * item.scaleFactor) / span;
            const shear = Math.tan((item.slantDeg * Math.PI) / 180);

            if (item.strokes && item.strokes.length > 0) {
              let offsetX, offsetY, pivotX, pivotY;
              if (item.isCombining) {
                const markCenter = ((item.minX + item.maxX) / 2) * scale;
                const tallShift = TALL_ASCENDERS.has(item.baseCp) ? -baseFontSize * item.scaleFactor * 0.14 : 0;
                offsetX = dx + item.baseCenterX - markCenter + tallShift;
                offsetY = dy + item.baselineY - item.canvasHeight * state.guides.baseline * scale;
                if (item.stackAboveVowel) offsetY -= baseFontSize * item.scaleFactor * 0.24;
                pivotX = dx + item.baseCenterX;
                pivotY = dy + item.baselineY;
              } else {
                offsetX = dx + item.x - item.minX * scale;
                offsetY = dy + item.baselineY - item.canvasHeight * state.guides.baseline * scale;
                pivotX = dx + item.x + item.glyphW * 0.5;
                pivotY = dy + item.baselineY;
              }

              ctx.save();
              ctx.translate(pivotX, pivotY);
              if (Math.abs(shear) > 1e-4) ctx.transform(1, 0, -shear, 1, 0, 0);
              ctx.translate(-pivotX, -pivotY);
              for (const st of item.strokes) {
                drawSmoothStroke(ctx, st, scale, offsetX, offsetY, state.pressureSensitive, inkColor);
              }
              ctx.restore();
            } else {
              // If this is a non-drawn base glyph followed by non-drawn Thai combining marks,
              // group them into a single shaped string so browser OpenType keeps Thai marks 100% aligned!
              if (item.isCombining && item._drawnWithBase) continue;
              let clusterText = item.char;
              if (!item.isCombining) {
                let look = idx + 1;
                while (look < itemsList.length) {
                  const nxt = itemsList[look];
                  if (nxt.type === 'glyph' && nxt.isCombining && (!nxt.strokes || nxt.strokes.length === 0)) {
                    clusterText += nxt.char;
                    nxt._drawnWithBase = true;
                    look++;
                  } else {
                    break;
                  }
                }
              }
              ctx.save();
              const px = dx + (item.isCombining ? item.baseCenterX : item.x);
              const py = dy + item.baselineY;
              ctx.translate(px, py);
              if (Math.abs(shear) > 1e-4) ctx.transform(1, 0, -shear, 1, 0, 0);
              ctx.fillStyle = inkColor;
              ctx.globalAlpha = (item.isTtf || item.isListMarker) ? 1.0 : fallbackAlpha;
              const fam = item.isTtf && item.ttfFamily ? `"${item.ttfFamily}", "Noto Sans Thai", sans-serif` : '"Noto Sans Thai", "Inter", sans-serif';
              ctx.font = `400 ${Math.round(baseFontSize * item.scaleFactor)}px ${fam}`;
              ctx.textAlign = item.isCombining ? 'center' : 'left';
              ctx.textBaseline = 'alphabetic';
              ctx.fillText(clusterText, 0, 0);
              ctx.restore();
            }
          }
        };

        // 3. Draw Main Document Glyphs
        drawLayoutItems(result.items, fontSize, state.previewTextColor, 0, 0, 0.30);
        // 4. Draw Floating Handwriting Textboxes in REALTIME (even while actively typing!)
        const pageBoxes = (state.textboxes || []).filter(tb => (tb.page || 1) === (loadedPdfDoc ? loadedPdfPageNum : 1));
        for (const tb of pageBoxes) {
          if (!tb.text) continue;
          const bx = Math.round((tb.xRatio || 0.1) * width);
          const by = Math.round((tb.yRatio || 0.1) * height);
          const tbSize = tb.fontSize || Math.round(fontSize * 0.78);
          const tbColor = tb.color || state.previewTextColor;
          const tbLayout = computePreviewLayout(tb.text, proj, state.variation, tbSize, 1.45, letterSpacing, state.guides, Math.max(180, width - bx - 16), null, ctx, false);
          drawLayoutItems(tbLayout.items, tbSize, tbColor, bx - 28, by - 28, 0.85);
        }
        ctx.restore();
        return result.items;
      }

      // Render Rich HTML for Real .TTF Preview mode (with Pill Highlight + Text Color + Lists)
      function renderRichTtfHtml(rawText, hlColor) {
        const esc = (str) => str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return parseRichPreviewLines(rawText).map(line => {
          const inner = line.segments.map(seg =>
            seg.highlighted
              ? `<span class="pill-hl" style="background-color:${hlColor};">${esc(seg.text)}</span>`
              : esc(seg.text)
          ).join('');
          if (line.listType === 'bullet') {
            return `<div class="flex items-baseline gap-2.5"><span class="select-none opacity-80">•</span><div class="flex-1">${inner || '&nbsp;'}</div></div>`;
          }
          if (line.listType === 'number') {
            return `<div class="flex items-baseline gap-2.5"><span class="select-none opacity-80 text-[0.68em] font-sans">${esc(line.listPrefix)}</span><div class="flex-1">${inner || '&nbsp;'}</div></div>`;
          }
          return `<div>${inner || '&nbsp;'}</div>`;
        }).join('');
      }

      // --- Writing Studio: Lag-Free Offscreen Cached Cell Drawing ---
      function renderBaseLayer(baseCanvas, spec, strokes, width, height) {
        const ctx = baseCanvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const tw = Math.round(width * dpr), th = Math.round(height * dpr);
        if (baseCanvas.width !== tw || baseCanvas.height !== th) { baseCanvas.width = tw; baseCanvas.height = th; }
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, width, height);

        const drawGuide = (ratio, color, dashed = true) => {
          const y = Math.round(height * ratio) + 0.5;
          ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1;
          if (dashed) ctx.setLineDash([3, 3]);
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
          ctx.restore();
        };
        drawGuide(state.guides.ascender, 'rgba(148, 163, 184, 0.30)', true);
        drawGuide(state.guides.capHeight, 'rgba(148, 163, 184, 0.20)', true);
        drawGuide(state.guides.xHeight, 'rgba(37, 99, 235, 0.16)', true);
        drawGuide(state.guides.baseline, 'rgba(29, 29, 31, 0.24)', false);
        drawGuide(state.guides.descender, 'rgba(148, 163, 184, 0.30)', true);

        if (state.showCenterGuide) {
          const cx = Math.round(width / 2) + 0.5;
          ctx.save(); ctx.strokeStyle = 'rgba(148, 163, 184, 0.20)'; ctx.setLineDash([2, 4]);
          ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, height); ctx.stroke(); ctx.restore();
        }

        if (state.showGhostChar && strokes.length === 0) {
          ctx.save();
          ctx.fillStyle = 'rgba(29, 29, 31, 0.08)';
          ctx.font = `400 ${Math.round(height * 0.46)}px "Noto Sans Thai", "Inter", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'alphabetic';
          ctx.fillText(spec.isCombining ? '◌' + spec.char : spec.char, width / 2, height * state.guides.baseline);
          ctx.restore();
        }

        for (const s of strokes) {
          drawSmoothStroke(ctx, s, 1, 0, 0, state.pressureSensitive, '#1D1D1F');
        }
        ctx.restore();
      }

      function setGlyphStrokes(cp, spec, nextStrokes) {
        const proj = getActiveProject();
        const existing = proj.glyphs[cp] || {};
        const insts = ensureGlyphInstances(existing.codepoint ? existing : { codepoint: cp, strokes: [] });
        const activeIdx = Math.min(existing.activeInstanceIdx || 0, insts.length - 1);
        insts[activeIdx] = { ...insts[activeIdx], strokes: nextStrokes };
        const h = Math.round(state.cellWidth * 1.25);
        proj.glyphs[cp] = {
          ...existing,
          codepoint: cp,
          character: spec.char,
          category: spec.category,
          canvasWidth: state.cellWidth,
          canvasHeight: h,
          strokes: nextStrokes,
          instances: insts,
          activeInstanceIdx: activeIdx,
          isCompleted: insts.some(it => it.strokes && it.strokes.length > 0),
          updatedAt: new Date().toISOString()
        };
        proj.updatedAt = new Date().toISOString();
        saveState(false); // Debounced! Never lags on 2nd stroke
      }

      function attachCellEvents(card, canvas, spec) {
        const proj = getActiveProject();
        const getStrokes = () => (proj.glyphs[spec.codepoint] && proj.glyphs[spec.codepoint].strokes) || [];
        const w = state.cellWidth, h = Math.round(w * 1.25);
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);

        // Offscreen base canvas caches guides + committed strokes -> 2nd/3rd/4th strokes stay 120fps smooth!
        const baseCache = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        let activeStroke = null;
        let activePointerId = null;
        let lastPenTime = 0;
        let pendingTouchStart = null;
        let rafPending = false;
        let cachedRect = null;

        const rebuildBaseCache = () => {
          renderBaseLayer(baseCache, spec, getStrokes(), w, h);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(baseCache, 0, 0);
        };

        const renderFrame = () => {
          rafPending = false;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(baseCache, 0, 0);
          if (activeStroke) {
            ctx.save();
            ctx.scale(dpr, dpr);
            drawSmoothStroke(ctx, activeStroke, 1, 0, 0, state.pressureSensitive, '#1D1D1F');
            ctx.restore();
          }
        };

        const scheduleRender = () => {
          if (!rafPending) {
            rafPending = true;
            requestAnimationFrame(renderFrame);
          }
        };

        const updateCardChrome = () => {
          const done = getStrokes().length > 0;
          const badge = card.querySelector('[data-badge]');
          if (badge) {
            badge.className = done
              ? 'w-2 h-2 rounded-full bg-[#1D1D1F]'
              : 'w-2 h-2 rounded-full bg-[#E5E5EA]';
          }
          const clearBtn = card.querySelector('[data-clear]');
          if (clearBtn) clearBtn.disabled = !done;
        };

        const getPoint = (e) => {
          const rect = cachedRect || canvas.getBoundingClientRect();
          const pr = (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : 0.52;
          return {
            x: Number((e.clientX - rect.left).toFixed(2)),
            y: Number((e.clientY - rect.top).toFixed(2)),
            pressure: Number(pr.toFixed(3))
          };
        };



        canvas.addEventListener('pointerdown', (e) => {
          const now = e.timeStamp || Date.now();
          const pType = e.pointerType || 'mouse';
          if (pType === 'touch') {
            if (state.inputMode === 'pencil_only') return;
            if (activePointerId !== null) return;
            if (lastPenTime > 0 && now - lastPenTime < 450) return;
            if (Math.max(e.width || 1, e.height || 1) >= 24) return;
          }
          if (pType === 'pen') lastPenTime = now;
          e.preventDefault();

          // Only update selection border if switching cells (avoids DOM thrashing on 2nd stroke!)
          if (state.selectedCp !== spec.codepoint) {
            const prevCard = document.querySelector(`[data-cell-card="${state.selectedCp}"]`);
            if (prevCard) {
              prevCard.classList.remove('border-[#1D1D1F]', 'ring-2', 'ring-black/5');
              prevCard.classList.add('border-[#E5E5EA]');
            }
            state.selectedCp = spec.codepoint;
            card.classList.remove('border-[#E5E5EA]');
            card.classList.add('border-[#1D1D1F]', 'ring-2', 'ring-black/5');
          }

          activePointerId = e.pointerId;
          cachedRect = canvas.getBoundingClientRect();
          try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

          const pt = getPoint(e);
          pendingTouchStart = pType === 'touch' ? pt : null;
          activeStroke = { id: 'st_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5), width: (proj.strokeWidth || state.strokeWidth || 3.2), points: [pt] };
          if (pType !== 'touch') scheduleRender();
        });

        canvas.addEventListener('pointermove', (e) => {
          if (!activeStroke || activePointerId !== e.pointerId) return;
          e.preventDefault();
          const raw = getPoint(e);
          const pts = activeStroke.points;
          const prev = pts[pts.length - 1];
          const dist = Math.hypot(raw.x - prev.x, raw.y - prev.y);
          if (dist >= 1.1) {
            // Exponential moving average smoothing for silky handwriting strokes
            const alpha = 1 - Math.min(0.75, Math.max(0.1, state.smoothing || 0.45));
            const smoothed = {
              x: Number((prev.x + (raw.x - prev.x) * alpha).toFixed(2)),
              y: Number((prev.y + (raw.y - prev.y) * alpha).toFixed(2)),
              pressure: Number((prev.pressure * 0.4 + raw.pressure * 0.6).toFixed(3))
            };
            pts.push(smoothed);
            scheduleRender();
          }
        });

        const finishStroke = (e) => {
          if (e && activePointerId !== null && e.pointerId !== activePointerId) return;
          activePointerId = null;
          cachedRect = null;
          if (!activeStroke) return;
          const finished = activeStroke;
          activeStroke = null;
          if (pendingTouchStart && finished.points.length <= 2) {
            const last = finished.points[finished.points.length - 1];
            if (Math.hypot(last.x - pendingTouchStart.x, last.y - pendingTouchStart.y) < 2.2) {
              pendingTouchStart = null;
              rebuildBaseCache();
              return;
            }
          }
          pendingTouchStart = null;
          const next = [...getStrokes(), finished];
          setGlyphStrokes(spec.codepoint, spec, next);
          rebuildBaseCache();
          updateCardChrome();
        };

        canvas.addEventListener('pointerup', finishStroke);
        canvas.addEventListener('pointercancel', finishStroke);
        canvas.addEventListener('lostpointercapture', () => { activePointerId = null; cachedRect = null; activeStroke = null; pendingTouchStart = null; });

        // Single minimalist Clear button per card
        card.querySelector('[data-clear]').addEventListener('click', (e) => {
          e.stopPropagation();
          if (!getStrokes().length) return;
          setGlyphStrokes(spec.codepoint, spec, []);
          rebuildBaseCache();
          updateCardChrome();
        });

        rebuildBaseCache();
        updateCardChrome();
      }

                const parsed = JSON.parse(reader.result);
                const restored = createProject(parsed.family_name || parsed.name || file.name.replace(/\.json$/i, ''), parsed.family_name || parsed.familyName || 'LineLuxImported');
                if (typeof parsed.strokeWidth === 'number') restored.strokeWidth = parsed.strokeWidth;
                if (Array.isArray(parsed.glyphs)) {
                  parsed.glyphs.forEach(g => {
                    const insts = [{ id: 'imp_' + g.codepoint, strokes: g.strokes || [], createdAt: new Date().toISOString() }];
                    if (Array.isArray(g.alternate_strokes)) g.alternate_strokes.forEach((st, i) => insts.push({ id: `imp_${g.codepoint}_${i}`, strokes: st, createdAt: new Date().toISOString() }));
                    restored.glyphs[g.codepoint] = { codepoint: g.codepoint, character: g.character, category: g.category || 'thai_consonants', canvasWidth: g.canvas_width || 96, canvasHeight: g.canvas_height || 120, strokes: insts[0].strokes, instances: insts, activeInstanceIdx: 0, isCompleted: true, updatedAt: new Date().toISOString() };
                  });
                }
                state.projects.unshift(restored);
                saveState(true); renderAll();
                showToast(state.lang === 'th' ? `นำเข้าฟอนต์ ${restored.name} (.JSON) แล้ว` : `Imported ${restored.name} (.JSON)`);
              } catch (_) {
                showToast(state.lang === 'th' ? 'ไฟล์ JSON ไม่ถูกต้อง' : 'Invalid JSON file');
              }
            };
            reader.readAsText(file);
          } else if (lower.endsWith('.ttf') || lower.endsWith('.otf')) {
            try {
              const buf = await file.arrayBuffer();
              const fam = 'LineLuxTTF_' + Date.now();
              const face = new FontFace(fam, buf);
              await face.load();
              document.fonts.add(face);
              const bytes = new Uint8Array(buf);
              let bin = '';
              for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
              const b64 = btoa(bin);
              const cleanName = file.name.replace(/\.(ttf|otf)$/i, '');
              const ttfProj = {
                ...createProject(cleanName, cleanName.replace(/[^A-Za-z0-9]/g, '') || 'ImportedTTF'),
                fontType: 'ttf',
                ttfFamily: fam,
                ttfBase64: b64
              };
              state.projects.unshift(ttfProj);
              saveState(true); renderAll();
              showToast(state.lang === 'th' ? `นำเข้าฟอนต์ ${cleanName} (.TTF) แล้ว` : `Imported ${cleanName} (.TTF)`);
            } catch (_) {
              showToast(state.lang === 'th' ? 'ไม่สามารถโหลดไฟล์ .TTF ได้' : 'Could not load .TTF file');
            }
          }
        });

        main.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { state.activeProjectId = b.getAttribute('data-open'); state.tab = 'my-fonts'; state.librarySubView = 'studio'; saveState(true); renderAll(); }));
        main.querySelectorAll('[data-rename]').forEach(b => b.addEventListener('click', () => {
          const target = state.projects.find(p => p.id === b.getAttribute('data-rename'));
          if (!target) return;
          const overlay = document.getElementById('modalOverlay'), card = document.getElementById('modalCard');
          card.innerHTML = `
            <h3 class="text-base font-semibold">${state.lang === 'th' ? 'เปลี่ยนชื่อฟอนต์' : 'Rename Font'}</h3>
            <input id="renameInput" type="text" value="${target.name}" class="mt-3 w-full px-3 py-2 rounded-xl border border-[#D2D2D7] text-sm" />
            <div class="mt-4 flex justify-end gap-2">
              <button id="cancelRenBtn" type="button" class="px-3.5 py-2 rounded-xl border border-[#D2D2D7] text-xs">${state.lang === 'th' ? 'ยกเลิก' : 'Cancel'}</button>
              <button id="saveRenBtn" type="button" class="px-4 py-2 rounded-xl bg-[#1D1D1F] text-white text-xs font-medium">${state.lang === 'th' ? 'บันทึก' : 'Save'}</button>
            </div>`;
          overlay.classList.remove('hidden');
          document.getElementById('cancelRenBtn').addEventListener('click', () => overlay.classList.add('hidden'));
          document.getElementById('saveRenBtn').addEventListener('click', () => {
            const val = document.getElementById('renameInput').value.trim();
            if (val) { target.name = val; saveState(true); renderAll(); }
            overlay.classList.add('hidden');
          });
        }));
        main.querySelectorAll('[data-dup]').forEach(b => b.addEventListener('click', () => {
          const src = state.projects.find(p => p.id === b.getAttribute('data-dup'));
          if (!src) return;
          const copy = JSON.parse(JSON.stringify(src));
          copy.id = 'proj_' + Date.now(); copy.name = src.name + ' (Copy)';
          state.projects.unshift(copy); saveState(true); renderAll();
        }));
        main.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
          const id = b.getAttribute('data-del');
          state.projects = state.projects.filter(p => p.id !== id);
          if (state.activeProjectId === id) state.activeProjectId = state.projects[0].id;
          saveState(true); renderAll();
        }));
      }

      // --- 3. Writing Studio (Ultra-Minimalist Header + Single Clear Button Per Card + 120fps Smooth Strokes) ---
      function renderStudio(main) {
        const proj = getActiveProject();
        const cellW = state.cellWidth, cellH = Math.round(cellW * 1.25);
        const filtered = CHARACTER_SET.filter(c => {
          if (c.category !== state.category) return false;
          const done = getValidInstances(proj.glyphs[c.codepoint]).length > 0;
          if (state.filterMode === 'todo') return !done;
          if (state.filterMode === 'done') return done;
          return true;
        });

        const catButtons = CATEGORIES.map(cat => `
          <button type="button" data-cat="${cat.id}" class="px-3 py-1.5 rounded-xl text-xs font-medium transition-colors ${
            state.category === cat.id ? 'bg-[#1D1D1F] text-white' : 'text-[#424245] hover:bg-[#F2F2F7]'
          }">${cat[state.lang]}</button>

        main.innerHTML = `
          <div class="max-w-7xl mx-auto space-y-4">
            <div class="flex items-center justify-between gap-3">
              <button id="backToLibraryBtn" type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white border border-[#E5E5EA] hover:border-[#1D1D1F] text-xs font-medium transition-colors">

          state.librarySubView = 'list';
          saveState(true);
          renderAll();
        });
        main.querySelectorAll('[data-cat]').forEach(btn => btn.addEventListener('click', () => { state.category = btn.getAttribute('data-cat'); saveState(true); renderAll(); }));
        main.querySelectorAll('[data-studio-filter]').forEach(btn => btn.addEventListener('click', () => {
          state.filterMode = btn.getAttribute('data-studio-filter');
          saveState(true);
          renderAll();

        const boardSlider = document.getElementById('studioBoardSizeSlider');
        boardSlider.addEventListener('input', (e) => {
          state.cellWidth = Number(e.target.value);
          document.getElementById('studioBoardSizeVal').textContent = state.cellWidth + 'px';

        boardSlider.addEventListener('change', () => {

        swSlider.addEventListener('input', (e) => {

          proj.strokeWidth = wVal;

        });
        swSlider.addEventListener('change', () => {
          const wVal = proj.strokeWidth || 3.2;
          Object.values(proj.glyphs || {}).forEach(g => {
            if (Array.isArray(g.strokes)) g.strokes.forEach(st => { st.width = wVal; });
            if (Array.isArray(g.instances)) g.instances.forEach(inst => {
              if (Array.isArray(inst.strokes)) inst.strokes.forEach(st => { st.width = wVal; });
            });
          });
          saveState(true);
          renderAll();
        });
      }

            const tb = (state.textboxes || []).find(t => t.id === id);
            if (!panel || !tb) return;
            const willOpen = panel.classList.contains('hidden');
            panel.classList.toggle('hidden');
            if (willOpen) {
              mountSleekColorPicker(panel, tb.color || '#1D1D1F', (hex) => {
                tb.color = hex;
                const dot = overlayLayer.querySelector(`[data-tb-dot="${id}"]`);
                if (dot) dot.style.background = hex;
                const inpEl = overlayLayer.querySelector(`[data-tb-input="${id}"]`);
                if (inpEl) inpEl.style.caretColor = hex;
                const cv2 = document.getElementById('thaiPreviewCanvas');
                if (cv2) renderVariationPreviewCanvas(cv2, loadedPdfDoc ? [] : extractRichLinesFromEditor(editorEl), state.previewSize, state.previewLineHeight, state.previewSpacing);
              }, () => {
                saveState(true);
              });
            }
          }));
          overlayLayer.querySelectorAll('[data-tb-del]').forEach(btn => btn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const id = btn.getAttribute('data-tb-del');
            if (activeEditingTextboxId === id) activeEditingTextboxId = null;
            state.textboxes = (state.textboxes || []).filter(t => t.id !== id);
            saveState(true); syncRender();
          }));

          overlayLayer.querySelectorAll('[data-tb-drag]').forEach(handle => {
            handle.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              const id = handle.getAttribute('data-tb-drag');
              const tb = (state.textboxes || []).find(t => t.id === id);
              if (!tb || !cv) return;
              const startX = e.clientX, startY = e.clientY;
              const origX = tb.xRatio, origY = tb.yRatio;
              const rect = cv.getBoundingClientRect();
              const onMove = (ev) => {
                tb.xRatio = Math.max(0.02, Math.min(0.88, origX + (ev.clientX - startX) / Math.max(rect.width, 1)));
                tb.yRatio = Math.max(0.04, Math.min(0.92, origY + (ev.clientY - startY) / Math.max(rect.height, 1)));
                syncRender();
              };
              const onUp = () => {
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onUp);
                saveState(true);
              };
              window.addEventListener('pointermove', onMove);
              window.addEventListener('pointerup', onUp);
            });
          });
        };

        const syncRender = () => {
          const cv = document.getElementById('thaiPreviewCanvas');
          if (!cv || !editorEl) return;
          // In PDF overlay mode, hide main editor prose on the PDF unless user wants it (use Textboxes for PDF form filling!)
          const richLines = loadedPdfDoc ? [] : extractRichLinesFromEditor(editorEl);
          const items = renderVariationPreviewCanvas(cv, richLines, state.previewSize, state.previewLineHeight, state.previewSpacing);
          renderTextboxHandles();
          const diag = document.getElementById('varDiagText');
          if (diag && items) {
            const glyphs = items.filter(it => it.type === 'glyph');
            const altUsed = glyphs.filter(it => it.instanceIndex > 0).length;
            diag.textContent = loadedPdfDoc
              ? `PDF Form · ${(state.textboxes || []).filter(t => (t.page || 1) === curPage).length} Textbox`
              : `Seed ${state.variation.seed} · Alternates ${altUsed}/${glyphs.length}`;
          }
        };
        syncRender();

        const saveEditorHtml = () => {
          state.previewHtml = editorEl.innerHTML;
          saveState(false);
          syncRender();
        };

        editorEl.addEventListener('input', () => {
          const sel = window.getSelection();
          if (sel && sel.rangeCount && sel.anchorNode && sel.anchorNode.nodeType === 3) {
            const node = sel.anchorNode;
            const offset = sel.anchorOffset;
            const txt = node.nodeValue || '';
            if (offset >= 2 && txt.slice(offset - 2, offset) === '->') {
              node.nodeValue = txt.slice(0, offset - 2) + '→' + txt.slice(offset);
              const r = document.createRange(); r.setStart(node, offset - 1); r.collapse(true);
              sel.removeAllRanges(); sel.addRange(r);
            }
          }
          saveEditorHtml();
        });

        editorEl.addEventListener('keyup', (e) => {
          if (e.key !== ' ') return;
          const sel = window.getSelection();
          if (!sel || !sel.rangeCount) return;
          const node = sel.anchorNode;
          if (!node || node.nodeType !== 3) return;
          const txt = node.nodeValue || '';
          if (txt === '- ' || txt === '* ') {
            node.nodeValue = ''; document.execCommand('insertUnorderedList'); saveEditorHtml();
          } else if (/^1\. $/.test(txt)) {
            node.nodeValue = ''; document.execCommand('insertOrderedList'); saveEditorHtml();
          }
        });

        document.getElementById('fmtBulletBtn').addEventListener('click', () => { editorEl.focus(); document.execCommand('insertUnorderedList'); saveEditorHtml(); });
        document.getElementById('fmtNumberBtn').addEventListener('click', () => { editorEl.focus(); document.execCommand('insertOrderedList'); saveEditorHtml(); });

        // Color Popovers Toggle
        const tcPop = document.getElementById('textColorPopover');
        const hlPop = document.getElementById('hlColorPopover');
        document.getElementById('textColorPopBtn').addEventListener('click', (e) => {
          e.stopPropagation(); hlPop.classList.add('hidden'); tcPop.classList.toggle('hidden');
        });
        document.getElementById('hlColorPopBtn').addEventListener('click', (e) => {
          e.stopPropagation(); tcPop.classList.add('hidden'); hlPop.classList.toggle('hidden');
        });

        const applyHighlightSelection = (color) => {
          editorEl.focus();
          const sel = window.getSelection();
          if (!sel || !sel.rangeCount || sel.isCollapsed || !editorEl.contains(sel.anchorNode)) {
            showToast(state.lang === 'th' ? 'คลุมข้อความก่อนกดไฮไลท์' : 'Select text first');
            return;
          }
          const range = sel.getRangeAt(0);
          const existingMark = range.commonAncestorContainer.nodeType === 1
            ? range.commonAncestorContainer.closest('mark.pill-hl')
            : range.commonAncestorContainer.parentElement?.closest('mark.pill-hl');
          if (existingMark && editorEl.contains(existingMark)) {
            existingMark.setAttribute('data-hl-color', color);
            existingMark.style.backgroundColor = color;
            saveEditorHtml();
            return;
          }
          const mark = document.createElement('mark');
          mark.className = 'pill-hl';
          mark.setAttribute('data-hl-color', color);
          mark.style.backgroundColor = color;
          try { range.surroundContents(mark); } catch (_) { mark.appendChild(range.extractContents()); range.insertNode(mark); }
          sel.removeAllRanges();
          saveEditorHtml();
        };

        document.getElementById('fmtHighlightBtn').addEventListener('click', () => { applyHighlightSelection(state.previewHighlightColor); hlPop.classList.add('hidden'); });
        main.querySelectorAll('[data-text-color]').forEach(btn => btn.addEventListener('click', () => {
          state.previewTextColor = btn.getAttribute('data-text-color');
          editorEl.style.color = state.previewTextColor;
          tcPop.classList.add('hidden');
          saveState(false); renderAll();
        }));
        document.getElementById('toggleCustomTextColor').addEventListener('click', (e) => {
          e.stopPropagation();
          const panel = document.getElementById('customTextColorPanel');
          if (!panel) return;
          const willOpen = panel.classList.contains('hidden');
          panel.classList.toggle('hidden');
          if (willOpen) {
            mountSleekColorPicker(panel, state.previewTextColor || '#1D1D1F', (hex) => {
              state.previewTextColor = hex;
              editorEl.style.color = hex;
              const triggerA = document.querySelector('#textColorPopBtn span');
              if (triggerA) { triggerA.style.color = hex; triggerA.style.borderBottomColor = hex; }
              syncRender();
            }, () => saveState(false));
          }
        });
        main.querySelectorAll('[data-hl-color]').forEach(btn => btn.addEventListener('click', () => {
          state.previewHighlightColor = btn.getAttribute('data-hl-color');
          applyHighlightSelection(state.previewHighlightColor);
          hlPop.classList.add('hidden');
          renderAll();
        }));
        document.getElementById('toggleCustomHlColor').addEventListener('click', (e) => {
          e.stopPropagation();
          const panel = document.getElementById('customHlColorPanel');
          if (!panel) return;
          const willOpen = panel.classList.contains('hidden');
          panel.classList.toggle('hidden');
          if (willOpen) {
            mountSleekColorPicker(panel, state.previewHighlightColor || '#FEF08A', (hex) => {
              state.previewHighlightColor = hex;
              const triggerDot = document.querySelector('#hlColorPopBtn span');
              if (triggerDot) triggerDot.style.background = hex;
              syncRender();
            }, () => saveState(false));
          }
        });

        // Click-to-Place Textbox Mode (click '+ Textbox', then click anywhere on the paper/PDF to place & type)
        const addTbBtn = document.getElementById('addTextboxBtn');
        const paperStage = document.getElementById('paperStage');
        const updatePlacementUi = () => {
          if (addTbBtn) {
            addTbBtn.classList.toggle('bg-[#1D1D1F]', isPlacingTextbox);
            addTbBtn.classList.toggle('text-white', isPlacingTextbox);
            addTbBtn.classList.toggle('border-[#1D1D1F]', isPlacingTextbox);
            addTbBtn.classList.toggle('bg-white', !isPlacingTextbox);
            addTbBtn.classList.toggle('border-[#E5E5EA]', !isPlacingTextbox);
            const labelSpan = addTbBtn.querySelector('span');
            if (labelSpan) {
              labelSpan.textContent = isPlacingTextbox
                ? (state.lang === 'th' ? 'คลิกบนกระดาษเพื่อวาง' : 'Click paper to place')
                : '+ Textbox';
            }
          }
          if (paperStage) {
            paperStage.classList.toggle('cursor-crosshair', isPlacingTextbox);
            paperStage.classList.toggle('ring-2', isPlacingTextbox);
            paperStage.classList.toggle('ring-[#1D1D1F]/25', isPlacingTextbox);
          }
        };
        updatePlacementUi();

        if (addTbBtn) {
          addTbBtn.addEventListener('click', () => {
            isPlacingTextbox = !isPlacingTextbox;
            updatePlacementUi();
          });
        }

        if (paperStage) {
          paperStage.addEventListener('click', (e) => {
            if (!isPlacingTextbox) return;
            const cv = document.getElementById('thaiPreviewCanvas');
            if (!cv) return;
            e.preventDefault();
            e.stopPropagation();
            const rect = cv.getBoundingClientRect();
            const xRatio = Math.max(0.02, Math.min(0.84, (e.clientX - rect.left) / Math.max(1, rect.width)));
            const yRatio = Math.max(0.02, Math.min(0.92, (e.clientY - rect.top - 14) / Math.max(1, rect.height)));
            const tb = {
              id: 'tb_' + Date.now(),
              page: loadedPdfDoc ? loadedPdfPageNum : 1,
              xRatio,
              yRatio,
              text: '',
              fontSize: state.lastTextboxFontSize || 28,
              color: state.previewTextColor
            };
            isPlacingTextbox = false;
            updatePlacementUi();
            state.textboxes = [...(state.textboxes || []), tb];
            activeEditingTextboxId = tb.id;
            saveState(true);
            syncRender();
            const newInput = overlayLayer.querySelector(`[data-tb-input="${tb.id}"]`);
            if (newInput) newInput.focus();
          }, true);
        }

        const onEscCancelPlacement = (e) => {
          if (e.key === 'Escape' && isPlacingTextbox) {
            isPlacingTextbox = false;
            updatePlacementUi();
          }
        };
        document.addEventListener('keydown', onEscCancelPlacement);

        // Floating Selection Popover when highlighting text in editor
        const selPop = document.getElementById('selectionPopup');
        const popTextRow = document.getElementById('popTextColRow');
        const popHlRow = document.getElementById('popHlColRow');

        if (selPop && popTextRow && popHlRow) {
          popTextRow.innerHTML = PALETTE_TEXT_COLORS.map(c => `<button type="button" data-pop-tc="${c.hex}" title="${c.name}" class="w-5 h-5 rounded-full border border-black/10" style="background:${c.hex};"></button>`).join('');
          popHlRow.innerHTML = PALETTE_HL_COLORS.map(c => `<button type="button" data-pop-hc="${c.hex}" title="${c.name}" class="w-5 h-5 rounded-full border border-black/10" style="background:${c.hex};"></button>`).join('');

          const hideSelPop = () => {
            selPop.classList.add('hidden');
            popTextRow.classList.add('hidden');
            popHlRow.classList.add('hidden');
          };

          const updateSelPopPosition = () => {
            const sel = window.getSelection();
            if (!sel || !sel.rangeCount || sel.isCollapsed || !editorEl.contains(sel.anchorNode)) {
              hideSelPop();
              return;
            }
            const rect = sel.getRangeAt(0).getBoundingClientRect();
            if (!rect || (rect.width === 0 && rect.height === 0)) { hideSelPop(); return; }
            selPop.classList.remove('hidden');
            const popW = selPop.offsetWidth || 220;
            const left = Math.max(12, Math.min(window.innerWidth - popW - 12, rect.left + rect.width / 2 - popW / 2));
            const top = Math.max(12, rect.top - (selPop.offsetHeight || 44) - 10);
            selPop.style.left = Math.round(left) + 'px';
            selPop.style.top = Math.round(top) + 'px';
          };

          editorEl.addEventListener('mouseup', () => setTimeout(updateSelPopPosition, 10));
          editorEl.addEventListener('keyup', () => setTimeout(updateSelPopPosition, 10));

          // Prevent mousedown on popup from clearing editor text selection!
          selPop.onmousedown = (e) => e.preventDefault();
          document.getElementById('popBulletBtn').onclick = () => { document.execCommand('insertUnorderedList'); saveEditorHtml(); hideSelPop(); };
          document.getElementById('popNumberBtn').onclick = () => { document.execCommand('insertOrderedList'); saveEditorHtml(); hideSelPop(); };
          document.getElementById('popTextColToggle').onclick = () => { popHlRow.classList.add('hidden'); popTextRow.classList.toggle('hidden'); };
          document.getElementById('popHlColToggle').onclick = () => { popTextRow.classList.add('hidden'); popHlRow.classList.toggle('hidden'); };
          document.getElementById('popClearHlBtn').onclick = () => {
            const sel = window.getSelection();
            if (sel && sel.rangeCount) {
              const anc = sel.getRangeAt(0).commonAncestorContainer;
              const mark = anc.nodeType === 1 ? anc.closest('mark.pill-hl') : anc.parentElement?.closest('mark.pill-hl');
              if (mark && editorEl.contains(mark)) {
                const parent = mark.parentNode;
                while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
                parent.removeChild(mark);
                saveEditorHtml();
              }
            }
            hideSelPop();
          };
          popTextRow.querySelectorAll('[data-pop-tc]').forEach(b => b.onclick = () => {
            state.previewTextColor = b.getAttribute('data-pop-tc');
            editorEl.style.color = state.previewTextColor;
            saveState(false); syncRender(); hideSelPop();
          });
          popHlRow.querySelectorAll('[data-pop-hc]').forEach(b => b.onclick = () => {
            state.previewHighlightColor = b.getAttribute('data-pop-hc');
            applyHighlightSelection(state.previewHighlightColor);
            hideSelPop();
          });
        }

        // Import PDF for Form Filling
        document.getElementById('importPdfInput').addEventListener('change', async (e) => {
          const file = e.target.files[0]; if (!file) return;
          if (!window.pdfjsLib) {
            showToast('PDF.js ยังโหลดไม่เสร็จ กรุณาลองใหม่');
            return;
          }
          try {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            const buf = await file.arrayBuffer();
            loadedPdfDoc = await window.pdfjsLib.getDocument({ data: buf }).promise;
            loadedPdfName = file.name;
            loadedPdfPageNum = 1;
            loadedPdfPageCount = loadedPdfDoc.numPages;
            state.a4PreviewMode = true;
            await renderPdfPageToCanvas(1);
            renderAll();
            showToast(state.lang === 'th' ? `นำเข้า ${file.name} แล้ว กด "+ Textbox" เพื่อเขียนทับแบบฟอร์ม` : `Loaded ${file.name}. Click "+ Textbox" to fill.`);
          } catch (_) {
            showToast(state.lang === 'th' ? 'ไม่สามารถเปิดไฟล์ PDF นี้ได้' : 'Could not open PDF');
          }
        });

        const clearPdfBtn = document.getElementById('clearPdfBtn');
        if (clearPdfBtn) clearPdfBtn.addEventListener('click', () => {
          loadedPdfDoc = null; loadedPdfBgCanvas = null; loadedPdfName = ''; loadedPdfPageCount = 0;
          renderAll();
        });
        const pdfPrev = document.getElementById('pdfPrevBtn');
        if (pdfPrev) pdfPrev.addEventListener('click', async () => {
          if (loadedPdfPageNum > 1) { loadedPdfPageNum--; await renderPdfPageToCanvas(loadedPdfPageNum); renderAll(); }
        });
        const pdfNext = document.getElementById('pdfNextBtn');
        if (pdfNext) pdfNext.addEventListener('click', async () => {
          if (loadedPdfPageNum < loadedPdfPageCount) { loadedPdfPageNum++; await renderPdfPageToCanvas(loadedPdfPageNum); renderAll(); }
        });

        document.getElementById('openVarModalBtn').addEventListener('click', () => openVariationModal(syncRender));
        const a4Btn = document.getElementById('toggleA4PreviewBtn');
        if (a4Btn) a4Btn.addEventListener('click', () => { state.a4PreviewMode = !state.a4PreviewMode; renderAll(); });
        document.getElementById('downloadSpecimenBtn').addEventListener('click', () => {
          const cv = document.getElementById('thaiPreviewCanvas');
          if (!cv) return;
          const a = document.createElement('a');
          a.download = loadedPdfDoc ? `${loadedPdfName.replace(/\.pdf$/i, '')}-filled.png` : `${getActiveProject().familyName || 'LineLux'}-A4.png`;
          a.href = cv.toDataURL('image/png');
          a.click();
        });
      }

      // --- 6. Login Page (Google OAuth via Supabase) ---

                      </div>
                      <div class="font-semibold text-base text-[#1D1D1F] truncate">${displayName}</div>

                    <button id="syncNowBtn" type="button" class="px-4 py-2.5 rounded-xl bg-[#1D1D1F] text-white text-xs font-medium hover:bg-black transition-colors">${state.lang === 'th' ? 'ซิงก์ฟอนต์ตอนนี้' : 'Sync Fonts Now'}</button>
                    <button id="logoutBtn" type="button" class="px-4 py-2.5 rounded-xl border border-[#D2D2D7] text-[#1D1D1F] text-xs font-medium hover:bg-[#F5F5F7] transition-colors">${state.lang === 'th' ? 'ออกจากระบบ' : 'Sign Out'}</button>
                  </div>
                  <button id="backToStudioFromLogin" type="button" class="w-full text-center text-xs text-[#6E6E73] hover:text-[#1D1D1F] pt-1">${state.lang === 'th' ? '← กลับไปหน้าสตูดิโอ' : '← Back to Studio'}</button>
                </div>
              ` : `
                <div class="bg-white rounded-3xl border border-[#E5E5EA] shadow-[0_8px_30px_rgba(0,0,0,0.04)] p-8 space-y-6 text-center">

                    <div>
                      <h1 class="text-2xl font-semibold tracking-tight text-[#1D1D1F]">${state.lang === 'th' ? 'เข้าสู่ระบบ LineLux' : 'Sign in to LineLux'}</h1>
                      <p class="text-xs text-[#6E6E73] mt-1.5 leading-relaxed">${state.lang === 'th' ? 'บันทึกคลังฟอนต์ลายมือและซิงก์งานของคุณข้ามอุปกรณ์ได้อย่างปลอดภัยด้วยบัญชี Google' : 'Save your handwriting font library and sync seamlessly across devices with Google.'}</p>
                    </div>
                  </div>

                  <div class="space-y-3 pt-1">
                    <button id="googleLoginBtn" type="button" class="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-2xl bg-white border border-[#D2D2D7] hover:border-[#1D1D1F] hover:bg-[#FAFAFC] text-[#1D1D1F] text-sm font-medium shadow-sm transition-all">
                      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" aria-hidden="true">

                      ${state.lang === 'th' ? 'ใช้งานต่อแบบไม่ล็อกอิน (เก็บข้อมูลในเครื่อง)' : 'Continue without signing in (Local only)'}

                  <div class="pt-2 border-t border-[#F2F2F7] text-[11px] text-[#8E8E93]">

                      : (state.lang === 'th' ? 'กรุณากรอกค่า Supabase ด้านล่างเพื่อเปิดใช้งาน Google Login' : 'Configure Supabase below to enable Google Login')}
                  </div>

              <!-- Advanced Supabase Connection Override -->
