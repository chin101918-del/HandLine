                </label>` : ''}
            </div>

            ${state.previewMode === 'real_ttf' ? `
              <div class="rounded-2xl border border-[#E5E5EA] bg-white overflow-hidden">
                <div class="px-4 py-2.5 border-b border-[#F2F2F7] flex flex-wrap items-center justify-between gap-2 text-[11px] text-[#6E6E73]">
                  <span><strong>Compiled Reference / Uploaded .TTF (@font-face — Not Current Unsaved Project):</strong> ${activeFontLabel}</span>
                  <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-800 font-medium">OpenType GDEF · GPOS mark/mkmk · GSUB ccmp</span>
                </div>
                <div id="realTtfBox" class="p-7 min-h-[240px] whitespace-pre-wrap break-words text-[#1D1D1F]" style="font-family:'${activeFontFamily}', 'Noto Sans Thai', sans-serif; font-size:${state.previewSize}px; line-height:${state.previewLineHeight}; letter-spacing:${state.previewSpacing}px;"></div>
              </div>
            ` : `
              <div class="bg-white rounded-2xl border border-[#E5E5EA] px-4 py-3 text-xs space-y-2">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <span class="font-semibold text-[#1D1D1F]">${state.lang === 'th' ? 'ผสมลายมือจากหลายโปรเจกต์ (Character Variation)' : 'Mix Drawn Projects (Character Variation)'}</span>
                  <div class="flex items-center gap-1.5">
                    <button id="mixAllProjBtn" type="button" class="px-2.5 py-1 rounded-lg bg-[#F5F5F7] hover:bg-[#E5E5EA] font-medium">${state.lang === 'th' ? 'เลือกทุกโปรเจกต์' : 'Mix All'}</button>
                    <button id="mixOnlyActiveBtn" type="button" class="px-2.5 py-1 rounded-lg border border-[#D2D2D7] hover:bg-[#F5F5F7]">${state.lang === 'th' ? 'เฉพาะโปรเจกต์นี้' : 'Active Only'}</button>
                  </div>
                </div>
                <div id="mixProjectPills" class="flex flex-wrap gap-1.5">
                  ${state.projects.map(p => {
                    const isPrimary = p.id === getActiveProject().id;
                    const isChecked = isPrimary || (Array.isArray(state.mixProjectIds) && state.mixProjectIds.includes(p.id));
                    const gCount = Object.values(p.glyphs || {}).filter(g => getValidInstances(g).length > 0).length;
                    return `<label class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl border cursor-pointer ${isChecked ? 'bg-[#1D1D1F] text-white border-[#1D1D1F]' : 'bg-[#F5F5F7] text-[#424245] border-[#E5E5EA]'}">
                      <input type="checkbox" data-mix-proj="${p.id}" ${isChecked ? 'checked' : ''} ${isPrimary ? 'disabled' : ''} class="accent-white" />
                      <span>${p.name}</span>
                      <span class="opacity-70 text-[10px]">(${gCount})</span>
                    </label>`;
                  }).join('')}
                </div>
              </div>

              <div class="rounded-2xl border border-[#E5E5EA] bg-white overflow-hidden">
                <div class="px-4 py-2.5 border-b border-[#F2F2F7] flex items-center justify-between text-[11px] text-[#6E6E73]">
                  <span><strong>HandLine Variation Preview:</strong> <span id="varDiagText">${state.lang === 'th' ? 'ใช้ตัวอย่างลายมือจริงของโปรเจกต์ที่เลือก' : 'Rendering active project glyph instances'}</span></span>
                  <button id="downloadSpecimenBtn" type="button" class="text-[#1D1D1F] font-medium hover:underline">${state.lang === 'th' ? 'บันทึกภาพ (.PNG)' : 'Save (.PNG)'}</button>
                </div>
                <canvas id="thaiPreviewCanvas" class="w-full h-[260px] block"></canvas>
              </div>
            `}
          </div>
        `;

        const syncRender = () => {
          if (state.previewMode === 'real_ttf') {
            const box = document.getElementById('realTtfBox');
            if (box) {
              const slant = state.variation[state.varScriptTab].slantAngle || 0;
              box.textContent = state.previewText;
              box.style.fontSize = state.previewSize + 'px';
              box.style.lineHeight = String(state.previewLineHeight);
              box.style.letterSpacing = state.previewSpacing + 'px';
              box.style.transform = slant ? `skewX(${-slant}deg)` : 'none';
              box.style.transformOrigin = 'left bottom';
            }
          } else {
            const cv = document.getElementById('thaiPreviewCanvas');
            if (cv) {
              const layout = renderEditorSimulatedPreview(cv, state.previewText, state.previewSize, state.previewLineHeight, state.previewSpacing);
              const diag = document.getElementById('varDiagText');
              if (diag && layout) {
                const glyphs = layout.filter(it => it.type === 'glyph');
                const altUsed = glyphs.filter(it => it.instanceIndex > 0).length;
                const scales = glyphs.map(it => it.scaleFactor);
                const minS = scales.length ? Math.min(...scales).toFixed(2) : '1.00';
                const maxS = scales.length ? Math.max(...scales).toFixed(2) : '1.00';
                const usedProjs = new Set(glyphs.filter(it => it.strokes && it.sourceProjectId).map(it => it.sourceProjectId)).size;
                const mixCount = getPreviewSourceProjects(getActiveProject()).length;
                diag.textContent = `Seed ${state.variation.seed} · Projects: ${usedProjs}/${mixCount} · Alternates: ${altUsed}/${glyphs.length} · Scale ${minS}x–${maxS}x`;
              }
            }
          }
        };
        syncRender();

        document.getElementById('previewSampleBtn').addEventListener('click', loadSampleGlyphs);
        const dlSpec = document.getElementById('downloadSpecimenBtn');
        if (dlSpec) dlSpec.addEventListener('click', () => {
          const cv = document.getElementById('thaiPreviewCanvas');
          if (!cv) return;
          const a = document.createElement('a'); a.download = `${getActiveProject().familyName || 'Handwriting'}-specimen.png`; a.href = cv.toDataURL('image/png'); a.click();
        });
        document.getElementById('varTabThai').addEventListener('click', () => { state.varScriptTab = 'thai'; renderAll(); });
        document.getElementById('varTabEng').addEventListener('click', () => { state.varScriptTab = 'english'; renderAll(); });
        document.getElementById('varSeedInput').addEventListener('input', (e) => { state.variation.seed = Number(e.target.value) || 1; saveState(); syncRender(); });
        document.getElementById('varRandomBtn').addEventListener('click', () => {
          const nextSeed = Math.floor(Math.random() * 90000000) + 10000000;
          state.variation.seed = nextSeed;
          const seedEl = document.getElementById('varSeedInput');
          if (seedEl) seedEl.value = String(nextSeed);
          saveState();
          syncRender();
        });
        document.getElementById('varResetBtn').addEventListener('click', () => {
          state.variation[state.varScriptTab] = { intensity: 0, sizeVariation: 0, slantAngle: 0, charSpacing: 0, wordSpacing: 0 };
          saveState(); renderAll();
        });
        const bindVar = (id, key, valId, suffix) => {
          document.getElementById(id).addEventListener('input', (e) => {
            const v = Number(e.target.value);
            state.variation[state.varScriptTab][key] = v;
            document.getElementById(valId).textContent = v + suffix;
            if (key === 'slantAngle') getActiveProject().slantAngle = v;
            saveState(); syncRender();
          });
        };
        bindVar('vIntSlider', 'intensity', 'vIntVal', '%');
        bindVar('vSizeSlider', 'sizeVariation', 'vSizeVal', '%');
        bindVar('vSlantSlider', 'slantAngle', 'vSlantVal', '°');
        bindVar('vCharSlider', 'charSpacing', 'vCharVal', '%');
        bindVar('vWordSlider', 'wordSpacing', 'vWordVal', '%');
        const mixAllBtn = document.getElementById('mixAllProjBtn');
        if (mixAllBtn) mixAllBtn.addEventListener('click', () => {
          const activeId = getActiveProject().id;
          state.mixProjectIds = state.projects.filter(p => p.id !== activeId).map(p => p.id);
          saveState(); renderAll();
        });
        const mixOnlyBtn = document.getElementById('mixOnlyActiveBtn');
        if (mixOnlyBtn) mixOnlyBtn.addEventListener('click', () => {
          state.mixProjectIds = [];
          saveState(); renderAll();
        });
        main.querySelectorAll('[data-mix-proj]').forEach(chk => {
          chk.addEventListener('change', (e) => {
            const pid = chk.getAttribute('data-mix-proj');
            const set = new Set(Array.isArray(state.mixProjectIds) ? state.mixProjectIds : []);
            if (e.target.checked) set.add(pid); else set.delete(pid);
            state.mixProjectIds = Array.from(set);
            saveState(); renderAll();
          });
        });
        document.getElementById('modeRealBtn').addEventListener('click', () => { state.previewMode = 'real_ttf'; renderAll(); });
        document.getElementById('modeSimBtn').addEventListener('click', () => { state.previewMode = 'editor_simulated'; renderAll(); });
        document.getElementById('previewInput').addEventListener('input', (e) => { state.previewText = e.target.value; saveState(); syncRender(); });
        document.getElementById('pvSizeSlider').addEventListener('input', (e) => { state.previewSize = Number(e.target.value); document.getElementById('pvSizeVal').textContent = state.previewSize + 'px'; syncRender(); });
        document.getElementById('pvLhSlider').addEventListener('input', (e) => { state.previewLineHeight = Number(e.target.value); document.getElementById('pvLhVal').textContent = state.previewLineHeight; syncRender(); });
        document.getElementById('pvSpSlider').addEventListener('input', (e) => { state.previewSpacing = Number(e.target.value); document.getElementById('pvSpVal').textContent = state.previewSpacing + 'px'; syncRender(); });
        main.querySelectorAll('[data-preset]').forEach(btn => btn.addEventListener('click', () => {
          state.previewText = PRESET_SENTENCES[Number(btn.getAttribute('data-preset'))];
          document.getElementById('previewInput').value = state.previewText;
          saveState(); syncRender();
        }));

        const ttfUpload = document.getElementById('loadLocalTtfInput');
        if (ttfUpload) {
          ttfUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
              const buf = await file.arrayBuffer();
              const fam = 'UserUploadedTTF_' + Date.now();
              const face = new FontFace(fam, buf);
              await face.load();
              document.fonts.add(face);
              state.customLoadedFontFamily = fam;
              state.customLoadedFontName = file.name;
              renderAll();
              showToast(`Loaded ${file.name} via FontFace API`);
            } catch (err) {
              showToast('Could not load font file');
            }
          });
        }
      }

      function renderExport(main) {
        const proj = getActiveProject();
        const drawn = Object.values(proj.glyphs).filter(g => g.strokes && g.strokes.length > 0);
        const thaiCons = drawn.filter(g => g.codepoint >= 0x0E01 && g.codepoint <= 0x0E2E).length;
        const thaiMarks = drawn.filter(g => COMBINING_SET.has(g.character)).length;
        const feaPreview = generateFeaSnippet(proj);

        main.innerHTML = `
          <div class="max-w-4xl mx-auto space-y-5">
            <div>
              <h1 class="text-2xl font-semibold tracking-tight">${t('exportTitle')}</h1>
              <p class="text-sm text-[#6E6E73] mt-1">${t('exportSub')}</p>
            </div>

            <div class="bg-white rounded-2xl border border-[#E5E5EA] p-5 space-y-4">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                <label class="space-y-1"><span class="text-[#6E6E73]">Font Family Name</span><input id="expFamily" type="text" value="${proj.familyName}" class="w-full px-3 py-2 rounded-xl border border-[#D2D2D7] text-sm" /></label>
                <label class="space-y-1"><span class="text-[#6E6E73]">Subfamily / Style</span><input id="expStyle" type="text" value="${proj.styleName}" class="w-full px-3 py-2 rounded-xl border border-[#D2D2D7] text-sm" /></label>
                <label class="space-y-1"><span class="text-[#6E6E73]">Full Name</span><input id="expFull" type="text" value="${proj.fullName || ''}" class="w-full px-3 py-2 rounded-xl border border-[#D2D2D7] text-sm" /></label>
                <label class="space-y-1"><span class="text-[#6E6E73]">PostScript Name</span><input id="expPs" type="text" value="${proj.postscriptName || ''}" class="w-full px-3 py-2 rounded-xl border border-[#D2D2D7] text-sm" /></label>
                <label class="space-y-1"><span class="text-[#6E6E73]">Designer</span><input id="expDesigner" type="text" value="${proj.designer}" class="w-full px-3 py-2 rounded-xl border border-[#D2D2D7] text-sm" /></label>
                <label class="space-y-1"><span class="text-[#6E6E73]">Version</span><input id="expVersion" type="text" value="${proj.version}" class="w-full px-3 py-2 rounded-xl border border-[#D2D2D7] text-sm" /></label>
                <label class="space-y-1 sm:col-span-2"><span class="text-[#6E6E73]">Copyright</span><input id="expCopy" type="text" value="${proj.copyrightText || ''}" class="w-full px-3 py-2 rounded-xl border border-[#D2D2D7] text-sm" /></label>
                <label class="space-y-1 sm:col-span-2"><span class="text-[#6E6E73]">Geometric Slant (${proj.slantAngle || 0}°, แยกจาก Italic Style)</span><input id="expSlant" type="range" min="-25" max="25" value="${proj.slantAngle || 0}" class="w-full" /></label>
              </div>

              <div class="p-4 rounded-xl bg-[#F5F5F7] text-xs space-y-1.5">
                <div class="font-semibold text-[#1D1D1F]">${state.lang === 'th' ? 'สรุปการตรวจสอบก่อนคอมไพล์' : 'Pre-Export Coverage & Validation Summary'}</div>
                <div>• ${state.lang === 'th' ? 'อักขระที่วาดแล้ว' : 'Drawn glyphs'}: <strong>${drawn.length}</strong> / ${CHARACTER_SET.length} (${Math.round(drawn.length / CHARACTER_SET.length * 100)}%)</div>
                <div>• ${state.lang === 'th' ? 'พยัญชนะไทย' : 'Thai consonants'}: <strong>${thaiCons}</strong>/44 · ${state.lang === 'th' ? 'สระ/วรรณยุกต์ประกอบ (GPOS)' : 'Thai combining marks'}: <strong>${thaiMarks}</strong></div>
                <div class="text-[#6E6E73] pt-1">
                  ${state.lang === 'th'
                    ? 'การคอมไพล์ไฟล์ .TTF จากลายมือของคุณทำงานผ่านเซิร์ฟเวอร์ Python FastAPI + FontTools/ufoLib2/ufo2ft ในชุดซอร์สโค้ด (พรีวิวนี้ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์เครื่องของคุณได้โดยตรง)'
                    : 'Compiling your custom strokes into .TTF runs via the Python FastAPI + FontTools/ufoLib2/ufo2ft backend in the source archive (this preview cannot connect to your private local server).'}
                </div>
              </div>

              <div class="flex flex-wrap gap-3">
                <button id="exportJsonBtn" type="button" class="px-4 py-2.5 rounded-xl bg-[#1D1D1F] text-white text-xs font-medium hover:bg-black">
                  ${state.lang === 'th' ? 'ส่งออกไฟล์โปรเจกต์ (.JSON สำหรับ FastAPI /compile/ttf)' : 'Export FastAPI Compile Payload (.JSON)'}
                </button>
                <button id="downloadSampleTtfBtn" type="button" class="px-4 py-2.5 rounded-xl bg-white border border-[#1D1D1F] text-xs font-medium hover:bg-[#F2F2F7]">
                  ${state.lang === 'th' ? 'ดาวน์โหลดตัวอย่าง SampleThaiHandwriting-Regular.ttf' : 'Download SampleThaiHandwriting-Regular.ttf'}
                </button>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-[#E5E5EA] p-5 space-y-2">
              <div class="text-xs font-semibold">${state.lang === 'th' ? 'โค้ด OpenType Feature (.fea) ที่คำนวณจากพิกัด Anchor ของโปรเจกต์' : 'Geometry-Derived Thai OpenType (.fea) Preview'}</div>
              <pre class="p-3.5 rounded-xl bg-[#F5F5F7] text-[11px] font-mono overflow-x-auto text-[#1D1D1F]">${feaPreview}</pre>
            </div>
          </div>
        `;

        document.getElementById('expSlant').addEventListener('input', (e) => {
          proj.slantAngle = Number(e.target.value);
          e.target.previousElementSibling.textContent = `Geometric Slant (${proj.slantAngle}°, แยกจาก Italic Style)`;
          saveState();
        });
        ['expFamily','expStyle','expFull','expPs','expDesigner','expVersion','expCopy'].forEach(id => {
          document.getElementById(id).addEventListener('input', () => {
            proj.familyName = document.getElementById('expFamily').value;
            proj.styleName = document.getElementById('expStyle').value;
            proj.fullName = document.getElementById('expFull').value;
            proj.postscriptName = document.getElementById('expPs').value;
            proj.designer = document.getElementById('expDesigner').value;
            proj.version = document.getElementById('expVersion').value;
            proj.copyrightText = document.getElementById('expCopy').value;
            saveState();
          });
        });

        document.getElementById('exportJsonBtn').addEventListener('click', () => {
          const payload = {
            family_name: proj.familyName, style_name: proj.styleName,
            full_name: proj.fullName, postscript_name: proj.postscriptName,
            designer: proj.designer, copyright_text: proj.copyrightText, version: proj.version, slant_angle: proj.slantAngle || 0,
            metrics: { units_per_em: 1000, ascender: 880, cap_height: 700, x_height: 500, baseline: 0, descender: -260, line_gap: 90 },
            glyphs: drawn.map(g => ({
              codepoint: g.codepoint, character: g.character, category: g.category,
              canvas_width: g.canvasWidth, canvas_height: g.canvasHeight,
              strokes: g.strokes, alternate_strokes: (g.instances || []).slice(1).map(it => it.strokes).filter(st => st && st.length > 0), advance_width: g.advanceWidth, lsb: g.lsb, rsb: g.rsb, anchors: g.anchors, is_completed: true
            }))
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = `${proj.familyName || 'HandwritingFont'}-compile-payload.json`; a.click();
          URL.revokeObjectURL(url);
          showToast(state.lang === 'th' ? 'ส่งออกไฟล์ JSON เรียบร้อยแล้ว' : 'Exported compile payload JSON');
        });

        document.getElementById('downloadSampleTtfBtn').addEventListener('click', () => {
          const bin = atob(SAMPLE_TTF_B64);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const blob = new Blob([bytes], { type: 'font/ttf' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = 'SampleThaiHandwriting-Regular.ttf'; a.click();
          URL.revokeObjectURL(url);
          showToast('Downloaded SampleThaiHandwriting-Regular.ttf');
        });
      }

      function renderSettings(main) {
        main.innerHTML = `
          <div class="max-w-2xl mx-auto space-y-5">
            <div>
              <h1 class="text-2xl font-semibold tracking-tight">${t('settingsTitle')}</h1>
              <p class="text-sm text-[#6E6E73] mt-1">${t('settingsSub')}</p>
            </div>
            <div class="bg-white rounded-2xl border border-[#E5E5EA] p-5 space-y-4 text-sm">
              <label class="flex items-center justify-between gap-4"><span>${state.lang === 'th' ? 'ขนาดช่องเขียนอักขระ' : 'Actual-Size Cell Width'}: <strong id="setCellVal">${state.cellWidth}px</strong></span><input id="setCellSlider" type="range" min="76" max="132" step="4" value="${state.cellWidth}" /></label>
              <label class="flex items-center justify-between gap-4"><span>${state.lang === 'th' ? 'รองรับแรงกด Apple Pencil' : 'Apple Pencil Pressure Sensitivity'}</span><input id="setPressure" type="checkbox" ${state.pressureSensitive ? 'checked' : ''} /></label>
              <label class="flex items-center justify-between gap-4"><span>Baseline: <strong id="setBaseVal">${Math.round(state.guides.baseline*100)}%</strong></span><input id="setBaseSlider" type="range" min="0.64" max="0.84" step="0.01" value="${state.guides.baseline}" /></label>
              <label class="flex items-center justify-between gap-4"><span>x-Height: <strong id="setXVal">${Math.round(state.guides.xHeight*100)}%</strong></span><input id="setXSlider" type="range" min="0.34" max="0.56" step="0.01" value="${state.guides.xHeight}" /></label>
              <label class="flex items-center justify-between gap-4"><span>Ascender: <strong id="setAscVal">${Math.round(state.guides.ascender*100)}%</strong></span><input id="setAscSlider" type="range" min="0.08" max="0.24" step="0.01" value="${state.guides.ascender}" /></label>
              <label class="flex items-center justify-between gap-4"><span>Descender: <strong id="setDescVal">${Math.round(state.guides.descender*100)}%</strong></span><input id="setDescSlider" type="range" min="0.84" max="0.96" step="0.01" value="${state.guides.descender}" /></label>
            </div>
          </div>
        `;
        document.getElementById('setCellSlider').addEventListener('input', (e) => { state.cellWidth = Number(e.target.value); document.getElementById('setCellVal').textContent = state.cellWidth + 'px'; saveState(); });
        document.getElementById('setPressure').addEventListener('change', (e) => { state.pressureSensitive = e.target.checked; saveState(); });
        document.getElementById('setBaseSlider').addEventListener('input', (e) => { state.guides.baseline = Number(e.target.value); document.getElementById('setBaseVal').textContent = Math.round(state.guides.baseline*100)+'%'; saveState(); });
        document.getElementById('setXSlider').addEventListener('input', (e) => { state.guides.xHeight = Number(e.target.value); document.getElementById('setXVal').textContent = Math.round(state.guides.xHeight*100)+'%'; saveState(); });
        document.getElementById('setAscSlider').addEventListener('input', (e) => { state.guides.ascender = Number(e.target.value); document.getElementById('setAscVal').textContent = Math.round(state.guides.ascender*100)+'%'; saveState(); });
        document.getElementById('setDescSlider').addEventListener('input', (e) => { state.guides.descender = Number(e.target.value); document.getElementById('setDescVal').textContent = Math.round(state.guides.descender*100)+'%'; saveState(); });
      }

      function renderAll() {
        renderSidebar();
        const main = document.getElementById('mainContent');
        if (state.tab === 'dashboard') renderDashboard(main);
        else if (state.tab === 'my-fonts') renderMyFonts(main);
        else if (state.tab === 'studio') renderStudio(main);
        else if (state.tab === 'preview') renderPreview(main);
        else if (state.tab === 'export') renderExport(main);
        else if (state.tab === 'settings') renderSettings(main);
        if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
      }

      function toggleLanguage() { state.lang = state.lang === 'th' ? 'en' : 'th'; saveState(); renderAll(); }
      document.getElementById('langToggleBtn').addEventListener('click', toggleLanguage);
      document.getElementById('mobileLangBtn').addEventListener('click', toggleLanguage);
      document.getElementById('mobileMenuBtn').addEventListener('click', openMobileSidebar);
      document.getElementById('closeSidebarBtn').addEventListener('click', closeMobileSidebar);
      document.getElementById('sidebarBackdrop').addEventListener('click', closeMobileSidebar);

      async function bootstrapApp() {
        const idb = await loadFromIndexedDB();
        if (idb.projects && idb.projects.length > 0) {
          const byId = new Map(state.projects.map(p => [p.id, p]));
          idb.projects.forEach(p => {
            const mig = migrateProject(p);
            const cur = byId.get(mig.id);
            if (!cur || new Date(mig.updatedAt || 0) >= new Date(cur.updatedAt || 0)) {
              byId.set(mig.id, mig);
            }
          });
          state.projects = Array.from(byId.values());
          if (!state.projects.some(p => p.id === state.activeProjectId)) {
            state.activeProjectId = state.projects[0].id;
          }
        }
        if (idb.meta) {
          if (idb.meta.variation) state.variation = { ...state.variation, ...idb.meta.variation };
          if (idb.meta.inputMode) state.inputMode = idb.meta.inputMode;
          if (idb.meta.guides) state.guides = { ...state.guides, ...idb.meta.guides };
          if (idb.meta.activeProjectId && state.projects.some(p => p.id === idb.meta.activeProjectId)) {
            state.activeProjectId = idb.meta.activeProjectId;
          }
        }
        renderAll();
      }
      bootstrapApp();
    })();
  </script>
</body>
</html>
