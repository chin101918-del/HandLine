                <label class="space-y-1"><span class="text-[#6E6E73]">Size Var <strong id="vSizeVal">${state.variation[state.varScriptTab].sizeVariation}%</strong></span><input id="vSizeSlider" type="range" min="0" max="50" value="${state.variation[state.varScriptTab].sizeVariation}" class="w-full" /></label>
                <label class="space-y-1"><span class="text-[#6E6E73]">Slant <strong id="vSlantVal">${state.variation[state.varScriptTab].slantAngle}°</strong></span><input id="vSlantSlider" type="range" min="-25" max="25" value="${state.variation[state.varScriptTab].slantAngle}" class="w-full" /></label>
                <label class="space-y-1"><span class="text-[#6E6E73]">Char <strong id="vCharVal">${state.variation[state.varScriptTab].charSpacing}%</strong></span><input id="vCharSlider" type="range" min="0" max="50" value="${state.variation[state.varScriptTab].charSpacing}" class="w-full" /></label>
                <label class="space-y-1"><span class="text-[#6E6E73]">Word <strong id="vWordVal">${state.variation[state.varScriptTab].wordSpacing}%</strong></span><input id="vWordSlider" type="range" min="0" max="50" value="${state.variation[state.varScriptTab].wordSpacing}" class="w-full" /></label>
              </div>

              ${state.previewMode === 'editor_simulated' && state.projects.length > 1 ? `
                <div class="pt-2.5 border-t border-[#F2F2F7] flex flex-wrap items-center gap-2">
                  <span class="text-[#6E6E73]">${state.lang === 'th' ? 'ผสมลายมือจากโปรเจกต์:' : 'Mix projects:'}</span>
                  ${state.projects.map(p => {
                    const isPrimary = p.id === getActiveProject().id;
                    const checked = isPrimary || (Array.isArray(state.mixProjectIds) && state.mixProjectIds.includes(p.id));
                    return `<label class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border cursor-pointer ${checked ? 'bg-[#1D1D1F] text-white border-[#1D1D1F]' : 'bg-[#F5F5F7] text-[#424245] border-[#E5E5EA]'}">
                      <input type="checkbox" data-mix-proj="${p.id}" ${checked ? 'checked' : ''} ${isPrimary ? 'disabled' : ''} class="hidden" />
                      <span>${p.name}</span>
                    </label>`;
                  }).join('')}
                </div>
              ` : ''}
            </div>

            <!-- Live Preview Surface -->
            ${state.previewMode === 'real_ttf' ? `
              <div class="rounded-2xl border border-[#E5E5EA] bg-white overflow-hidden">
                <div class="px-4 py-2.5 border-b border-[#F2F2F7] flex items-center justify-between text-xs text-[#6E6E73]">
                  <span>${state.customLoadedFontName || 'SampleThaiHandwriting-Regular.ttf'}</span>
                  <label class="cursor-pointer text-[#1D1D1F] font-medium hover:underline">
                    ${state.lang === 'th' ? 'อัปโหลด .TTF' : 'Upload .TTF'}
                    <input id="loadLocalTtfInput" type="file" accept=".ttf,.otf" class="hidden" />
                  </label>
                </div>
                <div id="realTtfBox" class="p-7 min-h-[260px] break-words space-y-1" style="font-family:'${activeFontFamily}', 'Noto Sans Thai', sans-serif;"></div>
              </div>
            ` : `
              <div class="rounded-2xl border border-[#E5E5EA] bg-white overflow-hidden">
                <div class="px-4 py-2.5 border-b border-[#F2F2F7] flex items-center justify-between text-[11px] text-[#6E6E73]">
                  <span id="varDiagText">LineLux Variation Preview</span>
                  <button id="downloadSpecimenBtn" type="button" class="text-[#1D1D1F] font-medium hover:underline">${state.lang === 'th' ? 'บันทึก PNG' : 'Save PNG'}</button>
                </div>
                <canvas id="thaiPreviewCanvas" class="w-full block"></canvas>
              </div>
            `}
          </div>
        `;

        const inputEl = document.getElementById('previewInput');
        const syncRender = () => {
          if (state.previewMode === 'real_ttf') {
            const box = document.getElementById('realTtfBox');
            if (box) {
              const slant = state.variation[state.varScriptTab].slantAngle || 0;
              box.innerHTML = renderRichTtfHtml(state.previewText, state.previewHighlightColor);
              box.style.color = state.previewTextColor;
              box.style.fontSize = state.previewSize + 'px';
              box.style.lineHeight = String(state.previewLineHeight);
              box.style.letterSpacing = state.previewSpacing + 'px';
              box.style.transform = slant ? `skewX(${-slant}deg)` : 'none';
              box.style.transformOrigin = 'left bottom';
            }
          } else {
            const cv = document.getElementById('thaiPreviewCanvas');
            if (cv) {
              const items = renderVariationPreviewCanvas(cv, state.previewText, state.previewSize, state.previewLineHeight, state.previewSpacing);
              const diag = document.getElementById('varDiagText');
              if (diag && items) {
                const glyphs = items.filter(it => it.type === 'glyph');
                const altUsed = glyphs.filter(it => it.instanceIndex > 0).length;
                const usedProjs = new Set(glyphs.filter(it => it.strokes && it.sourceProjectId).map(it => it.sourceProjectId)).size;
                diag.textContent = `Seed ${state.variation.seed} · Projects: ${usedProjs}/${getPreviewSourceProjects(getActiveProject()).length} · Alternates: ${altUsed}/${glyphs.length}`;
              }
            }
          }
        };
        syncRender();

        // Notion-style Auto-Continue Lists on Enter
        inputEl.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          const pos = inputEl.selectionStart;
          const before = inputEl.value.slice(0, pos);
          const lineStart = before.lastIndexOf('\n') + 1;
          const currentLine = before.slice(lineStart);
          const bMatch = currentLine.match(/^(\s*[-*]\s+)(.*)$/);
          const nMatch = currentLine.match(/^(\s*)(\d+)\.\s+(.*)$/);
          if (bMatch && bMatch[2].trim() !== '') {
            e.preventDefault();
            const ins = '\n' + bMatch[1];
            inputEl.value = before + ins + inputEl.value.slice(inputEl.selectionEnd);
            inputEl.selectionStart = inputEl.selectionEnd = pos + ins.length;
            state.previewText = inputEl.value; saveState(false); syncRender();
          } else if (nMatch && nMatch[3].trim() !== '') {
            e.preventDefault();
            const ins = `\n${nMatch[1]}${Number(nMatch[2]) + 1}. `;
            inputEl.value = before + ins + inputEl.value.slice(inputEl.selectionEnd);
            inputEl.selectionStart = inputEl.selectionEnd = pos + ins.length;
            state.previewText = inputEl.value; saveState(false); syncRender();
          }
        });

        inputEl.addEventListener('input', (e) => { state.previewText = e.target.value; saveState(false); syncRender(); });

        // Bullet / Number / Pill Highlight Toolbar Buttons
        const prefixCurrentLine = (prefix) => {
          const start = inputEl.selectionStart;
          const val = inputEl.value;
          const lineStart = val.lastIndexOf('\n', start - 1) + 1;
          inputEl.value = val.slice(0, lineStart) + prefix + val.slice(lineStart);
          inputEl.selectionStart = inputEl.selectionEnd = start + prefix.length;
          inputEl.focus();
          state.previewText = inputEl.value; saveState(false); syncRender();
        };
        document.getElementById('fmtBulletBtn').addEventListener('click', () => prefixCurrentLine('- '));
        document.getElementById('fmtNumberBtn').addEventListener('click', () => prefixCurrentLine('1. '));
        document.getElementById('fmtHighlightBtn').addEventListener('click', () => {
          const s0 = inputEl.selectionStart, s1 = inputEl.selectionEnd;
          const val = inputEl.value;
          if (s1 > s0) {
            const sel = val.slice(s0, s1);
            const wrapped = sel.startsWith('==') && sel.endsWith('==') ? sel.slice(2, -2) : `==${sel}==`;
            inputEl.value = val.slice(0, s0) + wrapped + val.slice(s1);
            inputEl.selectionStart = s0; inputEl.selectionEnd = s0 + wrapped.length;
          } else {
            const ins = '==ข้อความไฮไลท์==';
            inputEl.value = val.slice(0, s0) + ins + val.slice(s1);
            inputEl.selectionStart = s0 + 2; inputEl.selectionEnd = s0 + ins.length - 2;
          }
          inputEl.focus();
          state.previewText = inputEl.value; saveState(false); syncRender();
        });

        // Color Swatches & Pickers
        main.querySelectorAll('[data-text-color]').forEach(btn => btn.addEventListener('click', () => {
          state.previewTextColor = btn.getAttribute('data-text-color');
          saveState(false); renderAll();
        }));
        document.getElementById('customTextColor').addEventListener('input', (e) => {
          state.previewTextColor = e.target.value; saveState(false); syncRender();
        });
        main.querySelectorAll('[data-hl-color]').forEach(btn => btn.addEventListener('click', () => {
          state.previewHighlightColor = btn.getAttribute('data-hl-color');
          saveState(false); renderAll();
        }));
        document.getElementById('customHlColor').addEventListener('input', (e) => {
          state.previewHighlightColor = e.target.value; saveState(false); syncRender();
        });

        // Variation & Mode Controls
        document.getElementById('modeSimBtn').addEventListener('click', () => { state.previewMode = 'editor_simulated'; renderAll(); });
        document.getElementById('modeRealBtn').addEventListener('click', () => { state.previewMode = 'real_ttf'; renderAll(); });
        document.getElementById('varTabThai').addEventListener('click', () => { state.varScriptTab = 'thai'; renderAll(); });
        document.getElementById('varTabEng').addEventListener('click', () => { state.varScriptTab = 'english'; renderAll(); });
        document.getElementById('varRandomBtn').addEventListener('click', () => {
          state.variation.seed = Math.floor(Math.random() * 90000000) + 10000000;
          saveState(false); syncRender();
        });
        document.getElementById('varResetBtn').addEventListener('click', () => {
          state.variation[state.varScriptTab] = { intensity: 0, sizeVariation: 0, slantAngle: 0, charSpacing: 0, wordSpacing: 0 };
          saveState(true); renderAll();
        });
        document.getElementById('pvSizeSlider').addEventListener('input', (e) => {
          state.previewSize = Number(e.target.value);
          document.getElementById('pvSizeVal').textContent = state.previewSize;
          saveState(false); syncRender();
        });
        const bindVar = (id, key, valId, suffix) => {
          document.getElementById(id).addEventListener('input', (e) => {
            const v = Number(e.target.value);
            state.variation[state.varScriptTab][key] = v;
            document.getElementById(valId).textContent = v + suffix;
            if (key === 'slantAngle') getActiveProject().slantAngle = v;
            saveState(false); syncRender();
          });
        };
        bindVar('vIntSlider', 'intensity', 'vIntVal', '%');
        bindVar('vSizeSlider', 'sizeVariation', 'vSizeVal', '%');
        bindVar('vSlantSlider', 'slantAngle', 'vSlantVal', '°');
        bindVar('vCharSlider', 'charSpacing', 'vCharVal', '%');
        bindVar('vWordSlider', 'wordSpacing', 'vWordVal', '%');

        main.querySelectorAll('[data-mix-proj]').forEach(chk => chk.addEventListener('change', (e) => {
          const pid = chk.getAttribute('data-mix-proj');
          const set = new Set(Array.isArray(state.mixProjectIds) ? state.mixProjectIds : []);
          if (e.target.checked) set.add(pid); else set.delete(pid);
          state.mixProjectIds = Array.from(set);
          saveState(true); renderAll();
        }));

        const dlSpec = document.getElementById('downloadSpecimenBtn');
        if (dlSpec) dlSpec.addEventListener('click', () => {
          const cv = document.getElementById('thaiPreviewCanvas');
          if (!cv) return;
          const a = document.createElement('a'); a.download = `${getActiveProject().familyName || 'LineLux'}-preview.png`; a.href = cv.toDataURL('image/png'); a.click();
        });

        const ttfUpload = document.getElementById('loadLocalTtfInput');
        if (ttfUpload) ttfUpload.addEventListener('change', async (e) => {
          const file = e.target.files[0]; if (!file) return;
          try {
            const buf = await file.arrayBuffer();
            const fam = 'LineLuxUploaded_' + Date.now();
            const face = new FontFace(fam, buf);
            await face.load(); document.fonts.add(face);
            state.customLoadedFontFamily = fam; state.customLoadedFontName = file.name;
            renderAll(); showToast(`Loaded ${file.name}`);
          } catch (_) { showToast('Could not load font file'); }
        });
      }

      // --- 5. Export ---
      function renderExport(main) {
        const proj = getActiveProject();
        const drawn = Object.values(proj.glyphs).filter(g => getValidInstances(g).length > 0);
        main.innerHTML = `
          <div class="max-w-3xl mx-auto space-y-5">
            <h1 class="text-2xl font-semibold tracking-tight">${state.lang === 'th' ? 'ส่งออกฟอนต์ (.TTF)' : 'Export (.TTF)'}</h1>
            <div class="bg-white rounded-2xl border border-[#E5E5EA] p-5 space-y-4">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                <label class="space-y-1"><span class="text-[#6E6E73]">Font Family Name</span><input id="expFamily" type="text" value="${proj.familyName}" class="w-full px-3 py-2 rounded-xl border border-[#D2D2D7] text-sm" /></label>
                <label class="space-y-1"><span class="text-[#6E6E73]">Style (Subfamily)</span><input id="expStyle" type="text" value="${proj.styleName}" class="w-full px-3 py-2 rounded-xl border border-[#D2D2D7] text-sm" /></label>
                <label class="space-y-1"><span class="text-[#6E6E73]">Designer</span><input id="expDesigner" type="text" value="${proj.designer}" class="w-full px-3 py-2 rounded-xl border border-[#D2D2D7] text-sm" /></label>
                <label class="space-y-1"><span class="text-[#6E6E73]">Version</span><input id="expVersion" type="text" value="${proj.version}" class="w-full px-3 py-2 rounded-xl border border-[#D2D2D7] text-sm" /></label>
              </div>
              <div class="text-xs text-[#6E6E73]">${state.lang === 'th' ? `อักขระที่วาดแล้ว ${drawn.length}/${CHARACTER_SET.length} ตัว · Geometric Slant ${proj.slantAngle || 0}°` : `Drawn glyphs: ${drawn.length}/${CHARACTER_SET.length} · Slant ${proj.slantAngle || 0}°`}</div>
              <div class="flex flex-wrap gap-3">
                <button id="exportJsonBtn" type="button" class="px-4 py-2.5 rounded-xl bg-[#1D1D1F] text-white text-xs font-medium hover:bg-black">${state.lang === 'th' ? 'ส่งออก JSON สำหรับ Backend .TTF' : 'Export FastAPI Payload (.JSON)'}</button>
                <button id="downloadSampleTtfBtn" type="button" class="px-4 py-2.5 rounded-xl border border-[#D2D2D7] hover:bg-[#F5F5F7] text-xs font-medium">${state.lang === 'th' ? 'ดาวน์โหลดตัวอย่าง .TTF' : 'Download Sample .TTF'}</button>
              </div>
            </div>
          </div>
        `;
        ['expFamily','expStyle','expDesigner','expVersion'].forEach(id => {
          document.getElementById(id).addEventListener('input', () => {
            proj.familyName = document.getElementById('expFamily').value;
            proj.styleName = document.getElementById('expStyle').value;
            proj.designer = document.getElementById('expDesigner').value;
            proj.version = document.getElementById('expVersion').value;
            saveState(false);
          });
        });
        document.getElementById('exportJsonBtn').addEventListener('click', () => {
          const payload = {
            family_name: proj.familyName, style_name: proj.styleName, designer: proj.designer,
            version: proj.version, slant_angle: proj.slantAngle || 0,
            metrics: { units_per_em: 1000, ascender: 880, cap_height: 700, x_height: 500, baseline: 0, descender: -260, line_gap: 90 },
            glyphs: drawn.map(g => {
              const valid = getValidInstances(g);
              return { codepoint: g.codepoint, character: g.character, category: g.category, canvas_width: g.canvasWidth, canvas_height: g.canvasHeight, strokes: valid[0].strokes, alternate_strokes: valid.slice(1).map(v => v.strokes), is_completed: true };
            })
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${proj.familyName || 'LineLux'}-compile-payload.json`; a.click();
          showToast(state.lang === 'th' ? 'ส่งออกไฟล์ JSON แล้ว' : 'Exported JSON payload');
        });
        document.getElementById('downloadSampleTtfBtn').addEventListener('click', () => {
          const bin = atob(SAMPLE_TTF_B64); const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], { type: 'font/ttf' })); a.download = 'LineLux-Sample-Regular.ttf'; a.click();
        });
      }

      // --- 6. Login Page (Google OAuth via Supabase) ---
      function renderLogin(main) {
        const isConfigured = Boolean(supaConfig.url && supaConfig.anonKey);
        main.innerHTML = `
          <div class="max-w-md mx-auto space-y-6 py-4">
            <div>
              <h1 class="text-2xl font-semibold tracking-tight">${state.lang === 'th' ? 'บัญชีผู้ใช้ LineLux' : 'LineLux Account'}</h1>
              <p class="text-sm text-[#6E6E73] mt-1">${state.lang === 'th' ? 'เข้าสู่ระบบด้วย Google ผ่าน Supabase เพื่อเก็บและซิงก์ฟอนต์ลายมือของคุณข้ามอุปกรณ์' : 'Sign in with Google via Supabase to sync your handwriting fonts across devices.'}</p>
            </div>

            ${currentUser ? `
              <div class="bg-white rounded-2xl border border-[#E5E5EA] p-6 space-y-4">
                <div class="flex items-center gap-3">
                  <div class="w-11 h-11 rounded-full bg-[#1D1D1F] text-white flex items-center justify-center font-semibold">
                    ${(currentUser.user_metadata?.full_name || currentUser.email || 'U').charAt(0).toUpperCase()}
                  </div>
                  <div class="min-w-0">
                    <div class="font-semibold text-sm truncate">${currentUser.user_metadata?.full_name || 'Google User'}</div>
                    <div class="text-xs text-[#6E6E73] truncate">${currentUser.email || ''}</div>
                  </div>
                </div>
                <div class="flex gap-2 pt-2">
                  <button id="syncNowBtn" type="button" class="flex-1 px-4 py-2.5 rounded-xl bg-[#1D1D1F] text-white text-xs font-medium">${state.lang === 'th' ? 'ซิงก์ฟอนต์ตอนนี้' : 'Sync Fonts Now'}</button>
                  <button id="logoutBtn" type="button" class="px-4 py-2.5 rounded-xl border border-[#D2D2D7] text-xs font-medium hover:bg-[#F5F5F7]">${state.lang === 'th' ? 'ออกจากระบบ' : 'Sign Out'}</button>
                </div>
              </div>
            ` : `
              <div class="bg-white rounded-2xl border border-[#E5E5EA] p-6 space-y-4">
                <button id="googleLoginBtn" type="button" class="w-full flex items-center justify-center gap-2.5 px-4 py-3 rounded-xl bg-[#1D1D1F] text-white text-sm font-medium hover:bg-black transition-colors">
                  <span>G</span>
                  <span>${state.lang === 'th' ? 'เข้าสู่ระบบด้วย Google' : 'Continue with Google'}</span>
                </button>
                <p class="text-[11px] text-[#8E8E93] text-center">
                  ${isConfigured
                    ? (state.lang === 'th' ? 'เชื่อมต่อ Supabase พร้อมใช้งานแล้ว' : 'Supabase configured and ready')
                    : (state.lang === 'th' ? 'กรุณากรอก Supabase URL และ Anon Key ด้านล่างเพื่อเปิดใช้งาน Google Login' : 'Enter your Supabase URL & Anon Key below to enable Google Login')}
                </p>
              </div>
            `}

            <!-- Supabase Project Config -->
            <div class="bg-white rounded-2xl border border-[#E5E5EA] p-5 space-y-3 text-xs">
              <div class="font-semibold text-sm">${state.lang === 'th' ? 'ตั้งค่าการเชื่อมต่อ Supabase' : 'Supabase Connection'}</div>
              <label class="block space-y-1">
                <span class="text-[#6E6E73]">Supabase Project URL</span>
                <input id="supaUrlInput" type="url" value="${supaConfig.url || ''}" placeholder="https://xxxx.supabase.co" class="w-full px-3 py-2 rounded-xl border border-[#D2D2D7]" />
              </label>
              <label class="block space-y-1">
                <span class="text-[#6E6E73]">Supabase Anon Key (Public)</span>
                <input id="supaKeyInput" type="password" value="${supaConfig.anonKey || ''}" placeholder="eyJhbGciOi..." class="w-full px-3 py-2 rounded-xl border border-[#D2D2D7]" />
              </label>
              <button id="saveSupaCfgBtn" type="button" class="px-4 py-2 rounded-xl bg-[#F5F5F7] hover:bg-[#E5E5EA] font-medium">${state.lang === 'th' ? 'บันทึกการตั้งค่า Supabase' : 'Save Supabase Config'}</button>
            </div>
          </div>
        `;

        const gBtn = document.getElementById('googleLoginBtn');
        if (gBtn) gBtn.addEventListener('click', async () => {
          const client = initSupabaseClient();
          if (!client) {
            showToast(state.lang === 'th' ? 'กรุณาบันทึก Supabase URL และ Anon Key ก่อนเข้าสู่ระบบ' : 'Please save Supabase URL & Anon Key first');
            return;
          }
          try {
            const { error } = await client.auth.signInWithOAuth({
              provider: 'google',
              options: { redirectTo: window.location.href.split('#')[0] }
            });
            if (error) showToast(error.message);
          } catch (err) {
            showToast(String(err));
          }
        });

        const syncBtn = document.getElementById('syncNowBtn');
        if (syncBtn) syncBtn.addEventListener('click', async () => {
          await syncActiveProjectToCloud();
          await syncUserFontsFromCloud();
          showToast(state.lang === 'th' ? 'ซิงก์ข้อมูลฟอนต์เรียบร้อย' : 'Cloud sync complete');
        });

        const outBtn = document.getElementById('logoutBtn');
        if (outBtn) outBtn.addEventListener('click', async () => {
          if (supabaseClient) await supabaseClient.auth.signOut();
          currentUser = null;
          renderAll();
          showToast(state.lang === 'th' ? 'ออกจากระบบแล้ว' : 'Signed out');
        });

        document.getElementById('saveSupaCfgBtn').addEventListener('click', async () => {
          supaConfig = {
            url: document.getElementById('supaUrlInput').value.trim(),
            anonKey: document.getElementById('supaKeyInput').value.trim()
          };
          try { localStorage.setItem(SUPA_CFG_KEY, JSON.stringify(supaConfig)); } catch (_) {}
          const client = initSupabaseClient();
          if (client) {
            const { data } = await client.auth.getSession();
            currentUser = data?.session?.user || null;
            if (currentUser) await syncUserFontsFromCloud();
          }
          renderAll();
          showToast(state.lang === 'th' ? 'บันทึกการตั้งค่า Supabase แล้ว' : 'Saved Supabase config');
        });
      }

      // --- 7. Settings (All Secondary Controls Consolidated Here!) ---
      function renderSettings(main) {
        main.innerHTML = `
          <div class="max-w-2xl mx-auto space-y-5">
            <h1 class="text-2xl font-semibold tracking-tight">${state.lang === 'th' ? 'ตั้งค่า' : 'Settings'}</h1>

            <!-- Writing & Apple Pencil -->
            <div class="bg-white rounded-2xl border border-[#E5E5EA] p-5 space-y-4 text-sm">
              <div class="text-xs font-semibold uppercase tracking-wider text-[#8E8E93]">${state.lang === 'th' ? 'ปากกาและ Writing Studio' : 'Pen & Writing Studio'}</div>
              <div class="flex items-center justify-between gap-4">
                <span>${state.lang === 'th' ? 'โหมดป้องกันฝ่ามือ (iPad / Apple Pencil)' : 'Input Protection Mode'}</span>
                <div class="inline-flex rounded-xl bg-[#F5F5F7] p-0.5 text-xs">
                  <button id="setModePencil" type="button" class="px-3 py-1 rounded-lg font-medium ${state.inputMode === 'pencil_only' ? 'bg-[#1D1D1F] text-white' : 'text-[#6E6E73]'}">Apple Pencil Only</button>
                  <button id="setModeFinger" type="button" class="px-3 py-1 rounded-lg font-medium ${state.inputMode === 'finger_drawing' ? 'bg-white shadow-sm' : 'text-[#6E6E73]'}">Finger Drawing</button>
                </div>
              </div>
              <label class="flex items-center justify-between gap-4"><span>${state.lang === 'th' ? 'ความสมูทของเส้น' : 'Stroke Smoothing'}: <strong id="setSmoothVal">${Math.round((state.smoothing || 0.45)*100)}%</strong></span><input id="setSmoothSlider" type="range" min="0.1" max="0.75" step="0.05" value="${state.smoothing || 0.45}" /></label>
              <label class="flex items-center justify-between gap-4"><span>${state.lang === 'th' ? 'ขนาดช่องเขียนอักขระ' : 'Cell Size'}: <strong id="setCellVal">${state.cellWidth}px</strong></span><input id="setCellSlider" type="range" min="76" max="132" step="4" value="${state.cellWidth}" /></label>
              <label class="flex items-center justify-between gap-4"><span>${state.lang === 'th' ? 'รองรับแรงกด Apple Pencil' : 'Apple Pencil Pressure'}</span><input id="setPressure" type="checkbox" ${state.pressureSensitive ? 'checked' : ''} /></label>
              <div class="flex items-center justify-between gap-4">
                <span>${state.lang === 'th' ? 'ตัวกรองอักขระในสตูดิโอ' : 'Studio Character Filter'}</span>
                <div class="inline-flex rounded-xl bg-[#F5F5F7] p-0.5 text-xs">
                  <button type="button" data-set-filter="all" class="px-2.5 py-1 rounded-lg ${state.filterMode === 'all' ? 'bg-white shadow-sm font-medium' : 'text-[#6E6E73]'}">${state.lang === 'th' ? 'ทั้งหมด' : 'All'}</button>
                  <button type="button" data-set-filter="todo" class="px-2.5 py-1 rounded-lg ${state.filterMode === 'todo' ? 'bg-white shadow-sm font-medium' : 'text-[#6E6E73]'}">${state.lang === 'th' ? 'ยังไม่เขียน' : 'Todo'}</button>
                  <button type="button" data-set-filter="done" class="px-2.5 py-1 rounded-lg ${state.filterMode === 'done' ? 'bg-white shadow-sm font-medium' : 'text-[#6E6E73]'}">${state.lang === 'th' ? 'เขียนแล้ว' : 'Done'}</button>
                </div>
              </div>
            </div>

            <!-- Guides -->
            <div class="bg-white rounded-2xl border border-[#E5E5EA] p-5 space-y-4 text-sm">
              <div class="text-xs font-semibold uppercase tracking-wider text-[#8E8E93]">${state.lang === 'th' ? 'เส้นไกด์และลายน้ำ' : 'Typography Guides'}</div>
              <label class="flex items-center justify-between"><span>${state.lang === 'th' ? 'แสดงเส้นกึ่งกลาง' : 'Show Center Guide'}</span><input id="setCenterGuide" type="checkbox" ${state.showCenterGuide ? 'checked' : ''} /></label>
              <label class="flex items-center justify-between"><span>${state.lang === 'th' ? 'แสดงลายน้ำอักขระตัวอย่าง' : 'Show Ghost Character'}</span><input id="setGhostChar" type="checkbox" ${state.showGhostChar ? 'checked' : ''} /></label>
              <label class="flex items-center justify-between"><span>Baseline: <strong id="setBaseVal">${Math.round(state.guides.baseline*100)}%</strong></span><input id="setBaseSlider" type="range" min="0.64" max="0.84" step="0.01" value="${state.guides.baseline}" /></label>
              <label class="flex items-center justify-between"><span>x-Height: <strong id="setXVal">${Math.round(state.guides.xHeight*100)}%</strong></span><input id="setXSlider" type="range" min="0.34" max="0.56" step="0.01" value="${state.guides.xHeight}" /></label>
              <label class="flex items-center justify-between"><span>Ascender: <strong id="setAscVal">${Math.round(state.guides.ascender*100)}%</strong></span><input id="setAscSlider" type="range" min="0.08" max="0.24" step="0.01" value="${state.guides.ascender}" /></label>
              <label class="flex items-center justify-between"><span>Descender: <strong id="setDescVal">${Math.round(state.guides.descender*100)}%</strong></span><input id="setDescSlider" type="range" min="0.84" max="0.96" step="0.01" value="${state.guides.descender}" /></label>
            </div>

            <!-- Tools & Backup -->
            <div class="bg-white rounded-2xl border border-[#E5E5EA] p-5 space-y-3 text-xs">
              <div class="text-xs font-semibold uppercase tracking-wider text-[#8E8E93]">${state.lang === 'th' ? 'เครื่องมือและสำรองข้อมูล' : 'Utilities & Backup'}</div>
              <div class="flex flex-wrap gap-2">
                <button id="setSampleBtn" type="button" class="px-3.5 py-2 rounded-xl bg-[#F5F5F7] hover:bg-[#E5E5EA] font-medium">${state.lang === 'th' ? 'เติมลายมือตัวอย่าง 10 อักขระ' : 'Load 10 Sample Glyphs'}</button>
                <label class="cursor-pointer px-3.5 py-2 rounded-xl border border-[#D2D2D7] hover:bg-[#F5F5F7] font-medium">
                  ${state.lang === 'th' ? 'นำเข้าสำรอง (.JSON)' : 'Restore Backup (.JSON)'}
                  <input id="setImportJson" type="file" accept=".json,application/json" class="hidden" />
                </label>
              </div>
            </div>
          </div>
        `;

        document.getElementById('setModePencil').addEventListener('click', () => { state.inputMode = 'pencil_only'; saveState(true); renderAll(); });
        document.getElementById('setModeFinger').addEventListener('click', () => { state.inputMode = 'finger_drawing'; saveState(true); renderAll(); });
        document.getElementById('setSmoothSlider').addEventListener('input', (e) => { state.smoothing = Number(e.target.value); document.getElementById('setSmoothVal').textContent = Math.round(state.smoothing*100)+'%'; saveState(false); });
        document.getElementById('setCellSlider').addEventListener('input', (e) => { state.cellWidth = Number(e.target.value); document.getElementById('setCellVal').textContent = state.cellWidth+'px'; saveState(false); });
        document.getElementById('setPressure').addEventListener('change', (e) => { state.pressureSensitive = e.target.checked; saveState(true); });
        main.querySelectorAll('[data-set-filter]').forEach(b => b.addEventListener('click', () => { state.filterMode = b.getAttribute('data-set-filter'); saveState(true); renderAll(); }));
        document.getElementById('setCenterGuide').addEventListener('change', (e) => { state.showCenterGuide = e.target.checked; saveState(true); });
        document.getElementById('setGhostChar').addEventListener('change', (e) => { state.showGhostChar = e.target.checked; saveState(true); });
        document.getElementById('setBaseSlider').addEventListener('input', (e) => { state.guides.baseline = Number(e.target.value); document.getElementById('setBaseVal').textContent = Math.round(state.guides.baseline*100)+'%'; saveState(false); });
        document.getElementById('setXSlider').addEventListener('input', (e) => { state.guides.xHeight = Number(e.target.value); document.getElementById('setXVal').textContent = Math.round(state.guides.xHeight*100)+'%'; saveState(false); });
        document.getElementById('setAscSlider').addEventListener('input', (e) => { state.guides.ascender = Number(e.target.value); document.getElementById('setAscVal').textContent = Math.round(state.guides.ascender*100)+'%'; saveState(false); });
        document.getElementById('setDescSlider').addEventListener('input', (e) => { state.guides.descender = Number(e.target.value); document.getElementById('setDescVal').textContent = Math.round(state.guides.descender*100)+'%'; saveState(false); });
        document.getElementById('setSampleBtn').addEventListener('click', loadSampleGlyphs);
        document.getElementById('setImportJson').addEventListener('change', (e) => {
          const file = e.target.files[0]; if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              const restored = createProject(parsed.family_name || parsed.name || 'Imported Font', parsed.family_name || parsed.familyName || 'LineLuxImported');
              if (Array.isArray(parsed.glyphs)) {
                parsed.glyphs.forEach(g => {
                  const insts = [{ id: 'imp_' + g.codepoint, strokes: g.strokes || [], createdAt: new Date().toISOString() }];
                  if (Array.isArray(g.alternate_strokes)) g.alternate_strokes.forEach((st, i) => insts.push({ id: `imp_${g.codepoint}_${i}`, strokes: st, createdAt: new Date().toISOString() }));
                  restored.glyphs[g.codepoint] = { codepoint: g.codepoint, character: g.character, category: g.category || 'thai_consonants', canvasWidth: g.canvas_width || 96, canvasHeight: g.canvas_height || 120, strokes: insts[0].strokes, instances: insts, activeInstanceIdx: 0, isCompleted: true, updatedAt: new Date().toISOString() };
                });
              }
              state.projects.unshift(restored); state.activeProjectId = restored.id; saveState(true); renderAll();
              showToast(state.lang === 'th' ? 'นำเข้าไฟล์สำรองแล้ว' : 'Restored backup JSON');
            } catch (_) { showToast('Invalid JSON file'); }
          };
          reader.readAsText(file);
        });
      }

      function renderAll() {
        renderSidebar();
        const main = document.getElementById('mainContent');
        if (state.tab === 'dashboard') renderDashboard(main);
        else if (state.tab === 'my-fonts') renderMyFonts(main);
        else if (state.tab === 'studio') renderStudio(main);
        else if (state.tab === 'preview') renderPreview(main);
        else if (state.tab === 'export') renderExport(main);
        else if (state.tab === 'login') renderLogin(main);
        else if (state.tab === 'settings') renderSettings(main);
        if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
      }

      function toggleLanguage() { state.lang = state.lang === 'th' ? 'en' : 'th'; saveState(true); renderAll(); }
      document.getElementById('langToggleBtn').addEventListener('click', toggleLanguage);
      document.getElementById('mobileLangBtn').addEventListener('click', toggleLanguage);
      document.getElementById('sidebarAuthBtn').addEventListener('click', () => { state.tab = 'login'; closeMobileSidebar(); renderAll(); });
      document.getElementById('mobileMenuBtn').addEventListener('click', openMobileSidebar);
      document.getElementById('closeSidebarBtn').addEventListener('click', closeMobileSidebar);
      document.getElementById('sidebarBackdrop').addEventListener('click', closeMobileSidebar);

      async function bootstrapApp() {
        // 1. Restore from IndexedDB first (never discards local data)
        const idb = await loadFromIndexedDB();
        if (idb.projects && idb.projects.length > 0) {
          const byId = new Map(state.projects.map(p => [p.id, p]));
          idb.projects.forEach(p => {
            const mig = migrateProject(p);
            const cur = byId.get(mig.id);
            if (!cur || new Date(mig.updatedAt || 0) >= new Date(cur.updatedAt || 0)) byId.set(mig.id, mig);
          });
          state.projects = Array.from(byId.values());
          if (!state.projects.some(p => p.id === state.activeProjectId)) state.activeProjectId = state.projects[0].id;
        }
        if (idb.meta) {
          if (idb.meta.variation) state.variation = { ...state.variation, ...idb.meta.variation };
          if (idb.meta.inputMode) state.inputMode = idb.meta.inputMode;
          if (idb.meta.guides) state.guides = { ...state.guides, ...idb.meta.guides };
          if (idb.meta.previewTextColor) state.previewTextColor = idb.meta.previewTextColor;
          if (idb.meta.previewHighlightColor) state.previewHighlightColor = idb.meta.previewHighlightColor;
          if (Array.isArray(idb.meta.mixProjectIds)) state.mixProjectIds = idb.meta.mixProjectIds;
          if (idb.meta.activeProjectId && state.projects.some(p => p.id === idb.meta.activeProjectId)) state.activeProjectId = idb.meta.activeProjectId;
        }

        // 2. Restore Supabase Google Auth session if configured
        const client = initSupabaseClient();
        if (client) {
          try {
            const { data } = await client.auth.getSession();
            currentUser = data?.session?.user || null;
            client.auth.onAuthStateChange((_ev, session) => {
              currentUser = session?.user || null;
              if (currentUser) syncUserFontsFromCloud();
              renderAll();
            });
            if (currentUser) await syncUserFontsFromCloud();
          } catch (_) {}
        }

        renderAll();
      }
      bootstrapApp();
    })();
  </script>
</body>
</html>
