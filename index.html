      function loadSupaConfig() {
        try {
          if (window.__LINELUX_SUPABASE__ && window.__LINELUX_SUPABASE__.url && window.__LINELUX_SUPABASE__.anonKey) {
            return window.__LINELUX_SUPABASE__;
          }
          const raw = localStorage.getItem(SUPA_CFG_KEY);
          if (raw) return JSON.parse(raw);
        } catch (_) {}
        return { url: '', anonKey: '' };
      }

      function initSupabaseClient() {
        supabaseClient = null;
        if (supaConfig && supaConfig.url && supaConfig.anonKey && window.supabase && typeof window.supabase.createClient === 'function') {
          try {
            supabaseClient = window.supabase.createClient(supaConfig.url.trim(), supaConfig.anonKey.trim());
          } catch (_) {
            supabaseClient = null;
          }
        }
        return supabaseClient;
      }

            .eq('user_id', currentUser.id)
            .order('updated_at', { ascending: false });
          if (error || !projs || projs.length === 0) return;

          const { data: glyphRows } = await supabaseClient
            .from('glyphs')
            .select('*')
            .in('project_id', projs.map(p => p.id));

          const byId = new Map(state.projects.map(p => [p.id, p]));
          for (const row of projs) {
            const pGlyphs = {};
            (glyphRows || []).filter(g => g.project_id === row.id).forEach(g => {
              const isMulti = Array.isArray(g.strokes) && g.strokes.length > 0 && g.strokes[0] && Array.isArray(g.strokes[0].strokes);
              const instances = isMulti
                ? g.strokes
                : [{ id: 'cloud_' + g.codepoint, strokes: Array.isArray(g.strokes) ? g.strokes : [], createdAt: g.updated_at }];
              pGlyphs[g.codepoint] = {
                codepoint: g.codepoint,
                character: g.character,
                category: g.category || 'thai_consonants',
                canvasWidth: g.canvas_width || 96,
                canvasHeight: g.canvas_height || 120,
                strokes: instances[0]?.strokes || [],
                instances,
                activeInstanceIdx: 0,
                isCompleted: instances.some(it => it.strokes && it.strokes.length > 0),
                updatedAt: g.updated_at
              };
            });
            byId.set(row.id, migrateProject({
              id: row.id,
              name: row.name,
              familyName: row.family_name,
              styleName: row.style_name || 'Regular',
              designer: row.designer || '',
              version: row.version || '1.000',
              glyphs: pGlyphs,
              updatedAt: row.updated_at
            }));
          }
          state.projects = Array.from(byId.values());
          if (!state.projects.some(p => p.id === state.activeProjectId)) state.activeProjectId = state.projects[0].id;
          persistNow();
          renderAll();
          showToast(state.lang === 'th' ? 'ดึงข้อมูลฟอนต์จากบัญชี Google สำเร็จ' : 'Synced fonts from your Google account');
        } catch (_) {}
      }

      async function syncActiveProjectToCloud() {
        if (!supabaseClient || !currentUser) return;
        const proj = getActiveProject();
        try {
          const { error: pErr } = await supabaseClient.from('font_projects').upsert({
            id: proj.id,
            user_id: currentUser.id,
            name: proj.name,
            family_name: proj.familyName,
            style_name: proj.styleName || 'Regular',
            designer: proj.designer || '',
            version: proj.version || '1.000'
          });
          if (pErr) return;
          const rows = Object.values(proj.glyphs || {})
            .filter(g => getValidInstances(g).length > 0)
            .map(g => ({
              project_id: proj.id,
              codepoint: g.codepoint,
              character: g.character,
              category: g.category || 'thai_consonants',
              canvas_width: g.canvasWidth || 96,
              canvas_height: g.canvasHeight || 120,
              strokes: ensureGlyphInstances(g),
              is_completed: true
            }));
          if (rows.length > 0) {
            await supabaseClient.from('glyphs').upsert(rows, { onConflict: 'project_id,codepoint' });
          }
        } catch (_) {}
      }

      // --- IndexedDB + Debounced Persistence (fixes 2nd-stroke lag!) ---
      function openHandLineDB() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
          const timer = setTimeout(() => reject(new Error('IDB timeout')), 1200);
          const req = indexedDB.open(IDB_NAME, IDB_VER);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('font_sets')) db.createObjectStore('font_sets', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
          };
          req.onsuccess = () => { clearTimeout(timer); resolve(req.result); };
          req.onerror = () => { clearTimeout(timer); reject(req.error); };
        });
      }

      function saveToIndexedDB(projects, currentState) {
        openHandLineDB().then(db => {
          const tx = db.transaction(['font_sets', 'meta'], 'readwrite');
          const store = tx.objectStore('font_sets');
          projects.forEach(p => store.put(p));
          if (currentState) {
            tx.objectStore('meta').put({
              key: 'app_settings',
              activeProjectId: currentState.activeProjectId,
              variation: currentState.variation,
              inputMode: currentState.inputMode,
              guides: currentState.guides,
              lang: currentState.lang,
              previewText: currentState.previewText,
              previewSize: currentState.previewSize,
              previewLineHeight: currentState.previewLineHeight,
              previewSpacing: currentState.previewSpacing,
              previewTextColor: currentState.previewTextColor,
              previewHighlightColor: currentState.previewHighlightColor,
              mixProjectIds: currentState.mixProjectIds,
              cellWidth: currentState.cellWidth
            });
          }
        }).catch(() => {});
      }

      async function loadFromIndexedDB() {
        try {
          const db = await openHandLineDB();
          const tx = db.transaction(['font_sets', 'meta'], 'readonly');
          const projects = await new Promise((res, rej) => {
            const r = tx.objectStore('font_sets').getAll();
            r.onsuccess = () => res(r.result || []);
            r.onerror = () => rej(r.error);
          });
          const meta = await new Promise((res) => {
            const r = tx.objectStore('meta').get('app_settings');
            r.onsuccess = () => res(r.result || null);
            r.onerror = () => res(null);
          });
          return { projects, meta };
        } catch (_) {
          return { projects: [], meta: null };
        }
      }

      function ensureGlyphInstances(g) {
        if (!g) return [];
        if (Array.isArray(g.instances) && g.instances.length > 0) return g.instances;
        if (Array.isArray(g.strokes) && g.strokes.length > 0) {
          g.instances = [{ id: 'inst_mig_' + g.codepoint, strokes: g.strokes, createdAt: g.updatedAt || new Date().toISOString() }];
          g.activeInstanceIdx = 0;
          return g.instances;
        }
        g.instances = [{ id: 'inst_0_' + (g.codepoint || 0), strokes: [], createdAt: new Date().toISOString() }];
        g.activeInstanceIdx = 0;
        return g.instances;
      }

      function migrateProject(p) {
        const fam = p.familyName || 'LineLuxHand';
        const style = p.styleName || 'Regular';
        const glyphs = p.glyphs || {};
        Object.values(glyphs).forEach(g => ensureGlyphInstances(g));
        return {
          ...p,
          slantAngle: typeof p.slantAngle === 'number' ? p.slantAngle : 0,
          fullName: p.fullName || `${fam} ${style}`,
          postscriptName: p.postscriptName || `${fam}-${style}`.replace(/[^A-Za-z0-9_-]/g, ''),
          copyrightText: p.copyrightText || `Copyright (c) 2026 ${p.designer || fam}`,
          versions: Array.isArray(p.versions) ? p.versions : [],
          glyphs
        };
      }

      function loadState() {
        try {
          const rawV2 = localStorage.getItem(STORAGE_KEY_V2);
          if (rawV2) {
            const parsed = JSON.parse(rawV2);
            if (parsed && Array.isArray(parsed.projects) && parsed.projects.length > 0) {
              return {
                ...defaultState,
                ...parsed,
                projects: parsed.projects.map(migrateProject),
                guides: { ...defaultState.guides, ...(parsed.guides || {}) },
                variation: { ...defaultState.variation, ...(parsed.variation || {}) }
              };
            }
          }
          const rawV1 = localStorage.getItem(STORAGE_KEY_V1);
          if (rawV1) {
            const old = JSON.parse(rawV1);
            if (old && Array.isArray(old.projects) && old.projects.length > 0) {
              const migrated = {
                ...defaultState,
                ...old,
                schemaVersion: 2,
                projects: old.projects.map(migrateProject),
                guides: { ...defaultState.guides, ...(old.guides || {}) }
              };
              localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(migrated));
              return migrated;
            }
          }
        } catch (_) {}
        return JSON.parse(JSON.stringify(defaultState));
      }

      let state = loadState();
      let saveTimer = null;

      function persistNow() {
        saveToIndexedDB(state.projects, state);
        try { localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(state)); } catch (_) {}
        if (currentUser && supabaseClient) syncActiveProjectToCloud();
        const lbl = document.getElementById('saveStatusLabel');
        if (lbl) lbl.textContent = state.lang === 'th' ? 'บันทึกแล้ว' : 'Saved';
      }

      // Debounced save so lifting the pen between stroke 1 and stroke 2 NEVER blocks the UI thread!
      function saveState(immediate = false) {
        const lbl = document.getElementById('saveStatusLabel');
        if (lbl) lbl.textContent = state.lang === 'th' ? 'กำลังบันทึก...' : 'Saving...';
        clearTimeout(saveTimer);
        if (immediate) {
          persistNow();
        } else {
          saveTimer = setTimeout(persistNow, 550);
        }
      }

      function getActiveProject() {
        return state.projects.find(p => p.id === state.activeProjectId) || state.projects[0];
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => el.classList.add('hidden'), 2600);
      }

      // --- Smooth Curve Drawing (Quadratic Midpoint Bezier) ---
      function drawSmoothStroke(ctx, stroke, scale = 1, offsetX = 0, offsetY = 0, pressureSensitive = true, inkColor = '#1D1D1F') {
        const pts = stroke.points;
        if (!pts || pts.length === 0) return;
        ctx.strokeStyle = inkColor;
        ctx.fillStyle = inkColor;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (pts.length === 1) {
          const p = pts[0];
          const r = Math.max(1, stroke.width * scale * 0.5 * (pressureSensitive ? 0.65 + 0.7 * (p.pressure ?? 0.5) : 1));
          ctx.beginPath();
          ctx.arc(offsetX + p.x * scale, offsetY + p.y * scale, r, 0, Math.PI * 2);
          ctx.fill();
          return;
        }

        if (pts.length === 2) {
          const p0 = pts[0], p1 = pts[1];
          const pr = pressureSensitive ? ((p0.pressure ?? 0.5) + (p1.pressure ?? 0.5)) / 2 : 0.5;
          ctx.lineWidth = Math.max(1.1, stroke.width * scale * (0.65 + 0.7 * pr));
          ctx.beginPath();
          ctx.moveTo(offsetX + p0.x * scale, offsetY + p0.y * scale);
          ctx.lineTo(offsetX + p1.x * scale, offsetY + p1.y * scale);
          ctx.stroke();
          return;
        }

        // Smooth quadratic Bézier curve through midpoints
        let prevMidX = offsetX + ((pts[0].x + pts[1].x) * 0.5) * scale;
        let prevMidY = offsetY + ((pts[0].y + pts[1].y) * 0.5) * scale;

        // First half-segment
        ctx.lineWidth = Math.max(1.1, stroke.width * scale * (pressureSensitive ? 0.65 + 0.7 * (pts[0].pressure ?? 0.5) : 1));
        ctx.beginPath();
        ctx.moveTo(offsetX + pts[0].x * scale, offsetY + pts[0].y * scale);
        ctx.lineTo(prevMidX, prevMidY);
        ctx.stroke();

        for (let i = 1; i < pts.length - 1; i++) {
          const curr = pts[i];
          const next = pts[i + 1];
          const midX = offsetX + ((curr.x + next.x) * 0.5) * scale;
          const midY = offsetY + ((curr.y + next.y) * 0.5) * scale;
          const pr = pressureSensitive ? (curr.pressure ?? 0.5) : 0.5;
          ctx.lineWidth = Math.max(1.1, stroke.width * scale * (0.65 + 0.7 * pr));
          ctx.beginPath();
          ctx.moveTo(prevMidX, prevMidY);
          ctx.quadraticCurveTo(offsetX + curr.x * scale, offsetY + curr.y * scale, midX, midY);
          ctx.stroke();
          prevMidX = midX;
          prevMidY = midY;
        }

        // Final half-segment
        const last = pts[pts.length - 1];
        ctx.lineWidth = Math.max(1.1, stroke.width * scale * (pressureSensitive ? 0.65 + 0.7 * (last.pressure ?? 0.5) : 1));
        ctx.beginPath();
        ctx.moveTo(prevMidX, prevMidY);
        ctx.lineTo(offsetX + last.x * scale, offsetY + last.y * scale);
        ctx.stroke();
      }

      // --- Seeded Variation Engine + Cross-Project Character Variation ---
      function createSeededRng(seed) {
        let a = (Number(seed) || 1) >>> 0;
        return () => {
          a = (a + 0x6D2B79F5) >>> 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function getValidInstances(glyph) {
        if (!glyph) return [];
        if (Array.isArray(glyph.instances) && glyph.instances.length > 0) {
          const valid = glyph.instances.filter(inst => inst && Array.isArray(inst.strokes) && inst.strokes.length > 0);
          if (valid.length > 0) return valid;
        }
        if (Array.isArray(glyph.strokes) && glyph.strokes.length > 0) {
          return [{ id: 'primary_' + glyph.codepoint, strokes: glyph.strokes }];
        }
        return [];
      }

      function getPreviewSourceProjects(primaryProj) {
        const selectedIds = new Set(Array.isArray(state.mixProjectIds) ? state.mixProjectIds : []);
        const extras = state.projects.filter(p => p.id !== primaryProj.id && selectedIds.has(p.id));
        return [primaryProj, ...extras];
      }

      function collectVariationInstances(cp, sourceProjects) {
        const pool = [];
        for (const p of sourceProjects) {
          const glyph = p && p.glyphs ? p.glyphs[cp] : null;
          if (!glyph) continue;
          const valid = getValidInstances(glyph);
          for (const inst of valid) {
            pool.push({
              ...inst,
              id: `${p.id}::${inst.id}`,
              sourceProjectId: p.id,
              sourceProjectName: p.name,
              canvasWidth: inst.canvasWidth || glyph.canvasWidth || 96,
              canvasHeight: inst.canvasHeight || glyph.canvasHeight || 120
            });
          }
        }
        return pool;
      }

      // Parse Notion-style lines (bullet `- ` / `* `, numbered `1. `, and `==highlight==` pill spans)
      function parseRichPreviewLines(rawText) {
        return rawText.split('\n').map(line => {
          let listType = null;
          let listPrefix = '';
          let content = line;

          const bulletMatch = line.match(/^\s*[-*]\s+(.*)$/);
          const numMatch = line.match(/^\s*(\d+\.)\s+(.*)$/);
          if (bulletMatch) {
            listType = 'bullet';
            listPrefix = '•';
            content = bulletMatch[1];
          } else if (numMatch) {
            listType = 'number';
            listPrefix = numMatch[1];
            content = numMatch[2];
          }

          // Split into plain & ==highlighted== segments
          const segments = [];
          const regex = /==([^=]+)==/g;
          let lastIdx = 0;
          let m;
          while ((m = regex.exec(content)) !== null) {
            if (m.index > lastIdx) segments.push({ text: content.slice(lastIdx, m.index), highlighted: false });
            segments.push({ text: m[1], highlighted: true });
            lastIdx = regex.lastIndex;
          }
          if (lastIdx < content.length) segments.push({ text: content.slice(lastIdx), highlighted: false });
          if (segments.length === 0) segments.push({ text: '', highlighted: false });

          return { listType, listPrefix, segments };
        });
      }

      function computePreviewLayout(text, proj, variation, fontSize, lineHeight, baseTracking, guides, maxWidth, extraProjects = null) {
        const rng = createSeededRng(variation.seed);
        const lastChosenByCp = {};
        const padX = 28;
        const lineStep = fontSize * lineHeight;
        let baselineY = padX + fontSize * 1.15;
        const items = [];
        const pills = [];
        const markers = [];
        const richLines = parseRichPreviewLines(text);

        const sourceProjects = Array.isArray(extraProjects) && extraProjects.length > 0
          ? [proj, ...extraProjects.filter(p => p && p.id !== proj.id)]
          : getPreviewSourceProjects(proj);

        for (let lineIdx = 0; lineIdx < richLines.length; lineIdx++) {
          const line = richLines[lineIdx];
          const indentPx = line.listType ? Math.round(fontSize * 0.95) : 0;
          let cursorX = padX + indentPx;
          let activeBase = null;

          if (line.listType) {
            markers.push({
              type: line.listType,
              prefix: line.listPrefix,
              x: padX + (line.listType === 'bullet' ? fontSize * 0.25 : 0),
              y: baselineY
            });
          }

          for (const seg of line.segments) {
            const segChars = Array.from(seg.text);
            let pillStartX = seg.highlighted ? cursorX : null;
            let pillLineY = baselineY;

            for (let i = 0; i < segChars.length; i++) {
              const ch = segChars[i];
              const cp = ch.codePointAt(0);
              const isThai = cp >= 0x0E00 && cp <= 0x0E7F;
              const script = isThai ? 'thai' : 'english';
              const cfg = isThai ? variation.thai : variation.english;
              const intensity = Math.max(0, Math.min(100, Number(cfg.intensity) || 0)) / 100;

              if (ch === ' ') {
                const wsCfg = (activeBase && activeBase.isThai) ? variation.thai : variation.english;
                const wsInt = Math.max(0, Math.min(100, Number(wsCfg.intensity) || 0)) / 100;
                const wsPct = Math.max(0, Math.min(50, Number(wsCfg.wordSpacing) || 0)) / 100;
                const baseSpace = fontSize * 0.36;
                const wordDelta = wsInt === 0 ? 0 : (rng() * 2 - 1) * wsPct * baseSpace * wsInt;
                const advance = Math.max(fontSize * 0.14, baseSpace + wordDelta + baseTracking);
                items.push({ type: 'space', char: ' ', x: cursorX, y: baselineY, advance: Number(advance.toFixed(2)), wordDelta: Number(wordDelta.toFixed(2)) });
                cursorX += advance;
                activeBase = null;
                continue;
              }

              const isAbove = ABOVE_VOWELS.has(cp);
              const isTone = TONE_MARKS.has(cp);
              const isBelow = BELOW_MARKS.has(cp);
              const isCombining = isAbove || isTone || isBelow;
              const validInsts = collectVariationInstances(cp, sourceProjects);

              let chosenIdx = 0;
              if (validInsts.length > 1 && intensity > 0) {
                const prev = lastChosenByCp[cp];
                const shouldVary = intensity >= 0.99 || rng() < intensity;
                if (shouldVary) {
                  const cands = [];
                  for (let k = 0; k < validInsts.length; k++) if (k !== prev) cands.push(k);
                  chosenIdx = cands[Math.floor(rng() * cands.length)];
                }
              }
              lastChosenByCp[cp] = chosenIdx;
              const selectedInst = validInsts.length > 0 ? validInsts[chosenIdx] : null;

              if (isCombining && activeBase) {
                const isToneStacked = isTone && activeBase.hasUpperMark;
                if (isAbove) activeBase.hasUpperMark = true;
                let mMinX = Infinity, mMaxX = -Infinity;
                if (selectedInst) {
                  selectedInst.strokes.forEach(st => st.points.forEach(p => { if (p.x < mMinX) mMinX = p.x; if (p.x > mMaxX) mMaxX = p.x; }));
                }
                items.push({
                  type: 'glyph', char: ch, codepoint: cp, script, isCombining: true,
                  sourceProjectId: selectedInst ? selectedInst.sourceProjectId : proj.id,
                  instanceIndex: chosenIdx,
                  instanceId: selectedInst ? selectedInst.id : null,
                  strokes: selectedInst ? selectedInst.strokes : null,
                  canvasWidth: (selectedInst && selectedInst.canvasWidth) || 96,
                  canvasHeight: (selectedInst && selectedInst.canvasHeight) || 120,
                  minX: isFinite(mMinX) ? mMinX : 0, maxX: isFinite(mMaxX) ? mMaxX : 50,
                  scaleFactor: activeBase.scaleFactor, slantDeg: activeBase.slantDeg,
                  baselineY: activeBase.baselineY, baseCenterX: activeBase.xCenter,
                  baseCp: activeBase.cp, stackAboveVowel: isToneStacked,
                  charSpaceDelta: 0, charSpaceAfter: 0, attachedBaseIndex: activeBase.itemIdx
                });
                continue;
              }

              const sizePct = Math.max(0, Math.min(50, Number(cfg.sizeVariation) || 0)) / 100;
              const scaleFactor = intensity === 0 ? 1.0 : Number(Math.max(0.65, Math.min(1.45, 1 + (rng() * 2 - 1) * sizePct * intensity)).toFixed(4));
              const baseSlant = Math.max(-25, Math.min(25, Number(cfg.slantAngle) || 0));
              const slantJitter = intensity === 0 ? 0 : (rng() * 2 - 1) * 3.5 * intensity;
              const slantDeg = Number(Math.max(-25, Math.min(25, baseSlant + slantJitter)).toFixed(2));
              const baselineJitterPx = intensity === 0 ? 0 : Number(((rng() * 2 - 1) * fontSize * 0.03 * intensity).toFixed(2));
              const charSpacePct = Math.max(0, Math.min(50, Number(cfg.charSpacing) || 0)) / 100;
              const charSpaceDelta = intensity === 0 ? 0 : (rng() * 2 - 1) * charSpacePct * (fontSize * 0.28) * intensity;
              const charSpaceAfter = Number((fontSize * 0.12 + baseTracking + charSpaceDelta).toFixed(2));

              const chCanvas = (selectedInst && selectedInst.canvasHeight) || 120;
              const span = Math.max(chCanvas * (guides.baseline - guides.ascender), 1);
              const scale = (fontSize * scaleFactor) / span;
              let minX = Infinity, maxX = -Infinity;
              if (selectedInst) {
                selectedInst.strokes.forEach(st => st.points.forEach(p => { if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x; }));
              }
              const glyphW = (selectedInst && isFinite(minX))
                ? Math.max((maxX - minX) * scale, fontSize * 0.22 * scaleFactor)
                : fontSize * 0.56 * scaleFactor;

              if (cursorX + glyphW > maxWidth - padX && cursorX > padX + indentPx) {
                if (seg.highlighted && pillStartX !== null && cursorX > pillStartX) {
                  pills.push({ x: pillStartX, y: pillLineY, width: cursorX - pillStartX });
                }
                cursorX = padX + indentPx;
                baselineY += lineStep;
                if (seg.highlighted) { pillStartX = cursorX; pillLineY = baselineY; }
              }

              const x = Number(cursorX.toFixed(2));
              const y = Number((baselineY + baselineJitterPx).toFixed(2));
              const itemIdx = items.length;
              items.push({
                type: 'glyph', char: ch, codepoint: cp, script, isCombining: false,
                sourceProjectId: selectedInst ? selectedInst.sourceProjectId : proj.id,
                instanceIndex: chosenIdx,
                instanceId: selectedInst ? selectedInst.id : null,
                strokes: selectedInst ? selectedInst.strokes : null,
                canvasWidth: (selectedInst && selectedInst.canvasWidth) || 96,
                canvasHeight: chCanvas,
                minX: isFinite(minX) ? minX : 0, maxX: isFinite(maxX) ? maxX : 50,
                glyphW: Number(glyphW.toFixed(2)), x, baselineY: y,
                scaleFactor, slantDeg, charSpaceDelta: Number(charSpaceDelta.toFixed(2)),
                charSpaceAfter, attachedBaseIndex: null
              });

              activeBase = { itemIdx, xCenter: x + glyphW * 0.5, baselineY: y, scaleFactor, slantDeg, cp, isThai, hasUpperMark: false };
              cursorX += glyphW + Math.max(-fontSize * 0.06, charSpaceAfter);
            }

            if (seg.highlighted && pillStartX !== null && cursorX > pillStartX) {
              pills.push({ x: pillStartX, y: pillLineY, width: cursorX - pillStartX });
            }
          }
          baselineY += lineStep;
        }
        return { items, pills, markers, totalHeight: Math.max(280, Math.round(baselineY + 24)) };
      }

      // Draw Pill-Shaped Highlight Capsule
      function drawPillRect(ctx, x, y, w, h, color) {
        const r = Math.min(h / 2, w / 2);
        ctx.save();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.arcTo(x + w, y, x + w, y + r, r);
        ctx.lineTo(x + w, y + h - r);
        ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
        ctx.lineTo(x + r, y + h);
        ctx.arcTo(x, y + h, x, y + h - r, r);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y, x + r, y, r);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function renderVariationPreviewCanvas(canvas, text, fontSize, lineHeight, letterSpacing) {
        const ctx = canvas.getContext('2d');
        if (!ctx) return null;
        const proj = getActiveProject();
        const dpr = window.devicePixelRatio || 1;
        const width = canvas.clientWidth || 720;
        const result = computePreviewLayout(text, proj, state.variation, fontSize, lineHeight, letterSpacing, state.guides, width);
        const height = result.totalHeight;

        canvas.style.height = height + 'px';
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);

        // 1. Draw Pill-Shaped Highlights underneath text
        const pillPadX = Math.round(fontSize * 0.24);
        const pillH = Math.round(fontSize * 1.18);
        for (const p of result.pills) {
          drawPillRect(ctx, p.x - pillPadX, p.y - fontSize * 0.86, p.width + pillPadX * 2, pillH, state.previewHighlightColor);
        }

        // 2. Draw Notion-style Bullet & Numbered List Markers
        ctx.fillStyle = state.previewTextColor;
        for (const mk of result.markers) {
          if (mk.type === 'bullet') {
            ctx.beginPath();
            ctx.arc(mk.x, mk.y - fontSize * 0.30, Math.max(2.5, fontSize * 0.085), 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.font = `500 ${Math.round(fontSize * 0.62)}px "Inter", "Noto Sans Thai", sans-serif`;
            ctx.textBaseline = 'alphabetic';
            ctx.fillText(mk.prefix, mk.x, mk.y - fontSize * 0.04);
          }
        }

        // 3. Draw Handwritten Glyphs with Smooth Curves & Per-Glyph Variation
        for (const item of result.items) {
          if (item.type !== 'glyph') continue;
          const span = Math.max(item.canvasHeight * (state.guides.baseline - state.guides.ascender), 1);
          const scale = (fontSize * item.scaleFactor) / span;
          const shear = Math.tan((item.slantDeg * Math.PI) / 180);

          if (item.strokes && item.strokes.length > 0) {
            let offsetX, offsetY, pivotX, pivotY;
            if (item.isCombining) {
              const markCenter = ((item.minX + item.maxX) / 2) * scale;
              const tallShift = TALL_ASCENDERS.has(item.baseCp) ? -fontSize * item.scaleFactor * 0.14 : 0;
              offsetX = item.baseCenterX - markCenter + tallShift;
              offsetY = item.baselineY - item.canvasHeight * state.guides.baseline * scale;
              if (item.stackAboveVowel) offsetY -= fontSize * item.scaleFactor * 0.24;
              pivotX = item.baseCenterX;
              pivotY = item.baselineY;
            } else {
              offsetX = item.x - item.minX * scale;
              offsetY = item.baselineY - item.canvasHeight * state.guides.baseline * scale;
              pivotX = item.x + item.glyphW * 0.5;
              pivotY = item.baselineY;
            }

            ctx.save();
            ctx.translate(pivotX, pivotY);
            if (Math.abs(shear) > 1e-4) ctx.transform(1, 0, -shear, 1, 0, 0);
            ctx.translate(-pivotX, -pivotY);
            for (const st of item.strokes) {
              drawSmoothStroke(ctx, st, scale, offsetX, offsetY, state.pressureSensitive, state.previewTextColor);
            }
            ctx.restore();
          } else {
            ctx.save();
            const px = item.isCombining ? item.baseCenterX : item.x;
            ctx.translate(px, item.baselineY);
            if (Math.abs(shear) > 1e-4) ctx.transform(1, 0, -shear, 1, 0, 0);
            ctx.fillStyle = state.previewTextColor;
            ctx.globalAlpha = 0.28;
            ctx.font = `400 ${Math.round(fontSize * item.scaleFactor)}px "Noto Sans Thai", "Inter", sans-serif`;
            ctx.textBaseline = 'alphabetic';
            ctx.fillText(item.char, 0, 0);
            ctx.restore();
          }
        }
        ctx.restore();
        return result.items;
      }

      // Render Notion-style HTML for Real .TTF Preview mode (with Pill Highlight + Text Color + Lists)
      function renderRichTtfHtml(rawText, hlColor) {
        const esc = (str) => str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return parseRichPreviewLines(rawText).map(line => {
          const inner = line.segments.map(seg =>
            seg.highlighted
              ? `<span class="pill-hl" style="background-color:${hlColor};">${esc(seg.text)}</span>`
              : esc(seg.text)
          ).join('');
          if (line.listType === 'bullet') {
            return `<div class="flex items-baseline gap-2.5"><span class="select-none opacity-80">•</span><div class="flex-1">${inner || '&nbsp;'}</div></div>`;
          }
          if (line.listType === 'number') {
            return `<div class="flex items-baseline gap-2.5"><span class="select-none opacity-80 text-[0.68em] font-sans">${esc(line.listPrefix)}</span><div class="flex-1">${inner || '&nbsp;'}</div></div>`;
          }
          return `<div>${inner || '&nbsp;'}</div>`;
        }).join('');
      }

      // --- Writing Studio: Lag-Free Offscreen Cached Cell Drawing ---
      function renderBaseLayer(baseCanvas, spec, strokes, width, height) {
        const ctx = baseCanvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const tw = Math.round(width * dpr), th = Math.round(height * dpr);
        if (baseCanvas.width !== tw || baseCanvas.height !== th) { baseCanvas.width = tw; baseCanvas.height = th; }
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, width, height);

        const drawGuide = (ratio, color, dashed = true) => {
          const y = Math.round(height * ratio) + 0.5;
          ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1;
          if (dashed) ctx.setLineDash([3, 3]);
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
          ctx.restore();
        };
        drawGuide(state.guides.ascender, 'rgba(148, 163, 184, 0.30)', true);
        drawGuide(state.guides.capHeight, 'rgba(148, 163, 184, 0.20)', true);
        drawGuide(state.guides.xHeight, 'rgba(37, 99, 235, 0.16)', true);
        drawGuide(state.guides.baseline, 'rgba(29, 29, 31, 0.24)', false);
        drawGuide(state.guides.descender, 'rgba(148, 163, 184, 0.30)', true);

        if (state.showCenterGuide) {
          const cx = Math.round(width / 2) + 0.5;
          ctx.save(); ctx.strokeStyle = 'rgba(148, 163, 184, 0.20)'; ctx.setLineDash([2, 4]);
          ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, height); ctx.stroke(); ctx.restore();
        }

        if (state.showGhostChar && strokes.length === 0) {
          ctx.save();
          ctx.fillStyle = 'rgba(29, 29, 31, 0.08)';
          ctx.font = `400 ${Math.round(height * 0.46)}px "Noto Sans Thai", "Inter", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'alphabetic';
          ctx.fillText(spec.isCombining ? '◌' + spec.char : spec.char, width / 2, height * state.guides.baseline);
          ctx.restore();
        }

        for (const s of strokes) {
          drawSmoothStroke(ctx, s, 1, 0, 0, state.pressureSensitive, '#1D1D1F');
        }
        ctx.restore();
      }

      function setGlyphStrokes(cp, spec, nextStrokes) {
        const proj = getActiveProject();
        const existing = proj.glyphs[cp] || {};
        const insts = ensureGlyphInstances(existing.codepoint ? existing : { codepoint: cp, strokes: [] });
        const activeIdx = Math.min(existing.activeInstanceIdx || 0, insts.length - 1);
        insts[activeIdx] = { ...insts[activeIdx], strokes: nextStrokes };
        const h = Math.round(state.cellWidth * 1.25);
        proj.glyphs[cp] = {
          ...existing,
          codepoint: cp,
          character: spec.char,
          category: spec.category,
          canvasWidth: state.cellWidth,
          canvasHeight: h,
          strokes: nextStrokes,
          instances: insts,
          activeInstanceIdx: activeIdx,
          isCompleted: insts.some(it => it.strokes && it.strokes.length > 0),
          updatedAt: new Date().toISOString()
        };
        proj.updatedAt = new Date().toISOString();
        saveState(false); // Debounced! Never lags on 2nd stroke
      }

      function attachCellEvents(card, canvas, spec) {
        const proj = getActiveProject();
        const getStrokes = () => (proj.glyphs[spec.codepoint] && proj.glyphs[spec.codepoint].strokes) || [];
        const w = state.cellWidth, h = Math.round(w * 1.25);
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);

        // Offscreen base canvas caches guides + committed strokes -> 2nd/3rd/4th strokes stay 120fps smooth!
        const baseCache = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        let activeStroke = null;
        let activePointerId = null;
        let lastPenTime = 0;
        let pendingTouchStart = null;
        let rafPending = false;
        let cachedRect = null;

        const rebuildBaseCache = () => {
          renderBaseLayer(baseCache, spec, getStrokes(), w, h);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(baseCache, 0, 0);
        };

        const renderFrame = () => {
          rafPending = false;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(baseCache, 0, 0);
          if (activeStroke) {
            ctx.save();
            ctx.scale(dpr, dpr);
            drawSmoothStroke(ctx, activeStroke, 1, 0, 0, state.pressureSensitive, '#1D1D1F');
            ctx.restore();
          }
        };

        const scheduleRender = () => {
          if (!rafPending) {
            rafPending = true;
            requestAnimationFrame(renderFrame);
          }
        };

        const updateCardChrome = () => {
          const done = getStrokes().length > 0;
          const badge = card.querySelector('[data-badge]');
          if (badge) {
            badge.className = done
              ? 'w-2 h-2 rounded-full bg-[#1D1D1F]'
              : 'w-2 h-2 rounded-full bg-[#E5E5EA]';
          }
          const clearBtn = card.querySelector('[data-clear]');
          if (clearBtn) clearBtn.disabled = !done;
        };

        const getPoint = (e) => {
          const rect = cachedRect || canvas.getBoundingClientRect();
          const pr = (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : 0.52;
          return {
            x: Number((e.clientX - rect.left).toFixed(2)),
            y: Number((e.clientY - rect.top).toFixed(2)),
            pressure: Number(pr.toFixed(3))
          };
        };

        const eraseNear = (pt) => {
          const strokes = getStrokes();
          const thr = Math.max(9, state.strokeWidth * 2.8);
          const next = strokes.filter(s => !s.points.some(p => Math.hypot(p.x - pt.x, p.y - pt.y) <= thr));
          if (next.length !== strokes.length) {
            setGlyphStrokes(spec.codepoint, spec, next);
            rebuildBaseCache();
            updateCardChrome();
          }
        };

        canvas.addEventListener('pointerdown', (e) => {
          const now = e.timeStamp || Date.now();
          const pType = e.pointerType || 'mouse';
          if (pType === 'touch') {
            if (state.inputMode === 'pencil_only') return;
            if (activePointerId !== null) return;
            if (lastPenTime > 0 && now - lastPenTime < 450) return;
            if (Math.max(e.width || 1, e.height || 1) >= 24) return;
          }
          if (pType === 'pen') lastPenTime = now;
          e.preventDefault();

          // Only update selection border if switching cells (avoids DOM thrashing on 2nd stroke!)
          if (state.selectedCp !== spec.codepoint) {
            const prevCard = document.querySelector(`[data-cell-card="${state.selectedCp}"]`);
            if (prevCard) {
              prevCard.classList.remove('border-[#1D1D1F]', 'ring-2', 'ring-black/5');
              prevCard.classList.add('border-[#E5E5EA]');
            }
            state.selectedCp = spec.codepoint;
            card.classList.remove('border-[#E5E5EA]');
            card.classList.add('border-[#1D1D1F]', 'ring-2', 'ring-black/5');
          }

          activePointerId = e.pointerId;
          cachedRect = canvas.getBoundingClientRect();
          try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

          const pt = getPoint(e);
          if (state.tool === 'eraser') { eraseNear(pt); return; }
          pendingTouchStart = pType === 'touch' ? pt : null;
          activeStroke = { id: 'st_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5), width: state.strokeWidth, points: [pt] };
          if (pType !== 'touch') scheduleRender();
        });

        canvas.addEventListener('pointermove', (e) => {
          if (state.tool === 'eraser') { if (e.buttons > 0) eraseNear(getPoint(e)); return; }
          if (!activeStroke || activePointerId !== e.pointerId) return;
          e.preventDefault();
          const raw = getPoint(e);
          const pts = activeStroke.points;
          const prev = pts[pts.length - 1];
          const dist = Math.hypot(raw.x - prev.x, raw.y - prev.y);
          if (dist >= 1.1) {
            // Exponential moving average smoothing for silky handwriting strokes
            const alpha = 1 - Math.min(0.75, Math.max(0.1, state.smoothing || 0.45));
            const smoothed = {
              x: Number((prev.x + (raw.x - prev.x) * alpha).toFixed(2)),
              y: Number((prev.y + (raw.y - prev.y) * alpha).toFixed(2)),
              pressure: Number((prev.pressure * 0.4 + raw.pressure * 0.6).toFixed(3))
            };
            pts.push(smoothed);
            scheduleRender();
          }
        });

        const finishStroke = (e) => {
          if (e && activePointerId !== null && e.pointerId !== activePointerId) return;
          activePointerId = null;
          cachedRect = null;
          if (!activeStroke) return;
          const finished = activeStroke;
          activeStroke = null;
          if (pendingTouchStart && finished.points.length <= 2) {
            const last = finished.points[finished.points.length - 1];
            if (Math.hypot(last.x - pendingTouchStart.x, last.y - pendingTouchStart.y) < 2.2) {
              pendingTouchStart = null;
              rebuildBaseCache();
              return;
            }
          }
          pendingTouchStart = null;
          const next = [...getStrokes(), finished];
          setGlyphStrokes(spec.codepoint, spec, next);
          rebuildBaseCache();
          updateCardChrome();
        };

        canvas.addEventListener('pointerup', finishStroke);
        canvas.addEventListener('pointercancel', finishStroke);
        canvas.addEventListener('lostpointercapture', () => { activePointerId = null; cachedRect = null; activeStroke = null; pendingTouchStart = null; });

        // Single minimalist Clear button per card
        card.querySelector('[data-clear]').addEventListener('click', (e) => {
          e.stopPropagation();
          if (!getStrokes().length) return;
          setGlyphStrokes(spec.codepoint, spec, []);
          rebuildBaseCache();
          updateCardChrome();
        });

        rebuildBaseCache();
        updateCardChrome();
      }

      // --- Sample Glyphs Helper (moved to Settings) ---
      function loadSampleGlyphs() {
        const proj = getActiveProject();
        const w = state.cellWidth, h = Math.round(w * 1.25);
        const mk = (pts, width = 3.2) => ({

          width,
          points: pts.map(([rx, ry, p = 0.58]) => ({ x: rx * w, y: ry * h, pressure: p }))
        });
        const samples = {
          0x0E01: { char: 'ก', cat: 'thai_consonants', strokes: [mk([[0.28,0.74,0.5],[0.29,0.50,0.65],[0.36,0.44,0.6],[0.32,0.39,0.55],[0.48,0.31,0.7],[0.68,0.37,0.65],[0.71,0.55,0.6],[0.72,0.74,0.5]])] },
          0x0E2A: { char: 'ส', cat: 'thai_consonants', strokes: [mk([[0.28,0.74],[0.29,0.46],[0.45,0.36],[0.66,0.44],[0.68,0.74]]), mk([[0.58,0.42],[0.78,0.26]])] },
          0x0E27: { char: 'ว', cat: 'thai_consonants', strokes: [mk([[0.32,0.68],[0.44,0.74],[0.64,0.68],[0.66,0.46],[0.52,0.36],[0.36,0.40]])] },
          0x0E14: { char: 'ด', cat: 'thai_consonants', strokes: [mk([[0.52,0.56],[0.42,0.68],[0.30,0.62],[0.32,0.44],[0.50,0.34],[0.68,0.44],[0.70,0.74]])] },
          0x0E1B: { char: 'ป', cat: 'thai_consonants', strokes: [mk([[0.28,0.40],[0.30,0.73],[0.68,0.73],[0.70,0.16]])] },
          0x0E31: { char: 'ั', cat: 'thai_vowels', strokes: [mk([[0.34,0.26],[0.48,0.34],[0.66,0.25]])] },
          0x0E35: { char: 'ี', cat: 'thai_vowels', strokes: [mk([[0.32,0.32],[0.50,0.24],[0.66,0.32],[0.32,0.32]]), mk([[0.64,0.32],[0.66,0.20]])] },
          0x0E48: { char: '่', cat: 'thai_tones', strokes: [mk([[0.50,0.16],[0.50,0.28]])] },
          0x0E49: { char: '้', cat: 'thai_tones', strokes: [mk([[0.38,0.26],[0.48,0.18],[0.58,0.24],[0.68,0.16]])] },
          0x0041: { char: 'A', cat: 'latin_upper', strokes: [mk([[0.26,0.74],[0.50,0.28],[0.74,0.74]]), mk([[0.35,0.56],[0.65,0.56]])] }
        };
        Object.entries(samples).forEach(([cpStr, item]) => {

          }));
          const instances = [
            { id: 'inst_s1_' + cp, strokes: item.strokes, createdAt: new Date().toISOString() },
            { id: 'inst_s2_' + cp, strokes: altStrokes, createdAt: new Date().toISOString() }
          ];
          proj.glyphs[cp] = { codepoint: cp, character: item.char, category: item.cat, canvasWidth: w, canvasHeight: h, strokes: instances[0].strokes, instances, activeInstanceIdx: 0, isCompleted: true, updatedAt: new Date().toISOString() };
        });
        saveState(true);
        renderAll();
        showToast(state.lang === 'th' ? 'เติมลายมือตัวอย่าง 10 อักขระแล้ว' : 'Loaded 10 sample glyphs');

      // --- 1. Dashboard (Shows All Fonts + Actionable Essential Lists Only) ---
      function renderDashboard(main) {
        const active = getActiveProject();
        const activeDone = Object.values(active.glyphs).filter(g => getValidInstances(g).length > 0).length;
        const activePct = Math.round((activeDone / CHARACTER_SET.length) * 100);

        const fontListHtml = state.projects.map(p => {
          const done = Object.values(p.glyphs || {}).filter(g => getValidInstances(g).length > 0).length;

          const isAct = p.id === active.id;
          return `
            <div class="flex items-center justify-between gap-4 p-4 rounded-2xl bg-white border ${isAct ? 'border-[#1D1D1F]' : 'border-[#E5E5EA]'}">

                </div>

                  <span class="text-xs text-[#6E6E73]">${done}/${CHARACTER_SET.length}</span>
                </div>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <button type="button" data-dash-write="${p.id}" class="px-3 py-1.5 rounded-xl bg-[#1D1D1F] text-white text-xs font-medium">${state.lang === 'th' ? 'เขียนต่อ' : 'Write'}</button>
                <button type="button" data-dash-preview="${p.id}" class="px-3 py-1.5 rounded-xl bg-[#F5F5F7] hover:bg-[#E5E5EA] text-xs font-medium">${state.lang === 'th' ? 'ตัวอย่าง' : 'Preview'}</button>
              </div>
            </div>
          `;
        }).join('');

        // Meaningful Next-Steps Category Checklist (only incomplete categories)
        const nextCats = CATEGORIES.map(cat => {
          const all = CHARACTER_SET.filter(c => c.category === cat.id);
          const done = all.filter(c => getValidInstances(active.glyphs[c.codepoint]).length > 0).length;
          return { ...cat, done, total: all.length, remaining: all.length - done };

        const todoListHtml = nextCats.length > 0
          ? nextCats.map(c => `

      // --- 2. Font Library (Minimalist — Essentials Only) ---
      function renderMyFonts(main) {
        const active = getActiveProject();
        const cards = state.projects.map(p => {
          const count = Object.values(p.glyphs || {}).filter(g => getValidInstances(g).length > 0).length;
          const pct = Math.round((count / CHARACTER_SET.length) * 100);
          const isAct = p.id === active.id;
          return `
            <div class="p-5 rounded-2xl bg-white border transition-all ${isAct ? 'border-[#1D1D1F]' : 'border-[#E5E5EA]'}">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <h3 class="font-semibold text-base truncate">${p.name}</h3>
                  <p class="text-xs text-[#6E6E73] mt-0.5">${count} / ${CHARACTER_SET.length} ${state.lang === 'th' ? 'อักขระ' : 'glyphs'} (${pct}%)</p>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <button type="button" data-rename="${p.id}" class="p-1.5 rounded-lg text-[#6E6E73] hover:bg-[#F2F2F7]" title="Rename"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                  <button type="button" data-dup="${p.id}" class="p-1.5 rounded-lg text-[#6E6E73] hover:bg-[#F2F2F7]" title="Duplicate"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                  ${state.projects.length > 1 ? `<button type="button" data-del="${p.id}" class="p-1.5 rounded-lg text-[#6E6E73] hover:text-red-600 hover:bg-[#F2F2F7]" title="Delete"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : ''}
                </div>
              </div>
              <div class="mt-3 h-1.5 w-full rounded-full bg-[#F2F2F7] overflow-hidden"><div class="h-full bg-[#1D1D1F]" style="width:${pct}%"></div></div>
              <div class="mt-4 flex justify-end">
                <button type="button" data-open="${p.id}" class="px-3.5 py-1.5 rounded-xl bg-[#F5F5F7] hover:bg-[#1D1D1F] hover:text-white text-xs font-medium transition-colors">${state.lang === 'th' ? 'เปิดเขียน' : 'Open'}</button>
              </div>
            </div>
          `;
        }).join('');

        main.innerHTML = `
          <div class="max-w-4xl mx-auto space-y-6">
            <div class="flex items-center justify-between gap-4">
              <h1 class="text-2xl font-semibold tracking-tight">${state.lang === 'th' ? 'คลังฟอนต์' : 'Font Library'}</h1>
              <button id="newFontBtn" type="button" class="px-4 py-2 rounded-xl bg-[#1D1D1F] text-white text-xs font-medium hover:bg-black">${state.lang === 'th' ? '+ สร้างฟอนต์ใหม่' : '+ New Font'}</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${cards}</div>
          </div>
        `;

        document.getElementById('newFontBtn').addEventListener('click', openNewProjectModal);
        main.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { state.activeProjectId = b.getAttribute('data-open'); state.tab = 'studio'; saveState(true); renderAll(); }));
        main.querySelectorAll('[data-rename]').forEach(b => b.addEventListener('click', () => {
          const target = state.projects.find(p => p.id === b.getAttribute('data-rename'));
          if (!target) return;
          const overlay = document.getElementById('modalOverlay'), card = document.getElementById('modalCard');
          card.innerHTML = `
            <h3 class="text-base font-semibold">${state.lang === 'th' ? 'เปลี่ยนชื่อฟอนต์' : 'Rename Font'}</h3>
            <input id="renameInput" type="text" value="${target.name}" class="mt-3 w-full px-3 py-2 rounded-xl border border-[#D2D2D7] text-sm" />
            <div class="mt-4 flex justify-end gap-2">
              <button id="cancelRenBtn" type="button" class="px-3.5 py-2 rounded-xl border border-[#D2D2D7] text-xs">${state.lang === 'th' ? 'ยกเลิก' : 'Cancel'}</button>
              <button id="saveRenBtn" type="button" class="px-4 py-2 rounded-xl bg-[#1D1D1F] text-white text-xs font-medium">${state.lang === 'th' ? 'บันทึก' : 'Save'}</button>
            </div>`;
          overlay.classList.remove('hidden');
          document.getElementById('cancelRenBtn').addEventListener('click', () => overlay.classList.add('hidden'));
          document.getElementById('saveRenBtn').addEventListener('click', () => {
            const val = document.getElementById('renameInput').value.trim();
            if (val) { target.name = val; saveState(true); renderAll(); }
            overlay.classList.add('hidden');
          });
        }));
        main.querySelectorAll('[data-dup]').forEach(b => b.addEventListener('click', () => {
          const src = state.projects.find(p => p.id === b.getAttribute('data-dup'));
          if (!src) return;
          const copy = JSON.parse(JSON.stringify(src));
          copy.id = 'proj_' + Date.now(); copy.name = src.name + ' (Copy)';
          state.projects.unshift(copy); state.activeProjectId = copy.id; saveState(true); renderAll();
        }));
        main.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
          const id = b.getAttribute('data-del');
          state.projects = state.projects.filter(p => p.id !== id);
          if (state.activeProjectId === id) state.activeProjectId = state.projects[0].id;
          saveState(true); renderAll();
        }));
      }

      function openNewProjectModal() {
        const overlay = document.getElementById('modalOverlay'), card = document.getElementById('modalCard');
        const idx = state.projects.length + 1;
        card.innerHTML = `
          <h3 class="text-base font-semibold">${state.lang === 'th' ? 'สร้างฟอนต์ใหม่' : 'New Font'}</h3>
          <div class="mt-4 space-y-3">
            <label class="block text-xs"><span class="text-[#6E6E73]">${state.lang === 'th' ? 'ชื่อฟอนต์' : 'Font Name'}</span>
              <input id="newProjName" type="text" value="ลายมือของฉัน 0${idx}" class="mt-1 w-full px-3 py-2 rounded-xl border border-[#D2D2D7] text-sm" />
            </label>
            <label class="block text-xs"><span class="text-[#6E6E73]">Font Family (English)</span>

            </label>
          </div>
          <div class="mt-5 flex justify-end gap-2">
            <button id="cancelModalBtn" type="button" class="px-3.5 py-2 rounded-xl border border-[#D2D2D7] text-xs">${state.lang === 'th' ? 'ยกเลิก' : 'Cancel'}</button>
            <button id="confirmModalBtn" type="button" class="px-4 py-2 rounded-xl bg-[#1D1D1F] text-white text-xs font-medium">${state.lang === 'th' ? 'สร้าง' : 'Create'}</button>
          </div>`;
        overlay.classList.remove('hidden');
        document.getElementById('cancelModalBtn').addEventListener('click', () => overlay.classList.add('hidden'));
        document.getElementById('confirmModalBtn').addEventListener('click', () => {
          const name = document.getElementById('newProjName').value.trim() || `Font ${idx}`;
          const family = document.getElementById('newProjFamily').value.trim().replace(/[^A-Za-z0-9]/g, '') || `LineLux${idx}`;
          const created = createProject(name, family);
          state.projects.unshift(created); state.activeProjectId = created.id; state.tab = 'studio';
          overlay.classList.add('hidden'); saveState(true); renderAll();
        });
      }

      // --- 3. Writing Studio (Ultra-Minimalist Header + Single Clear Button Per Card + 120fps Smooth Strokes) ---
      function renderStudio(main) {
        const proj = getActiveProject();
        const cellW = state.cellWidth, cellH = Math.round(cellW * 1.25);
        const filtered = CHARACTER_SET.filter(c => {
          if (c.category !== state.category) return false;
          const done = getValidInstances(proj.glyphs[c.codepoint]).length > 0;
          if (state.filterMode === 'todo') return !done;
          if (state.filterMode === 'done') return done;
          return true;
        });

        const catButtons = CATEGORIES.map(cat => `
          <button type="button" data-cat="${cat.id}" class="px-3 py-1.5 rounded-xl text-xs font-medium transition-colors ${
            state.category === cat.id ? 'bg-[#1D1D1F] text-white' : 'text-[#424245] hover:bg-[#F2F2F7]'
          }">${cat[state.lang]}</button>
        `).join('');

        main.innerHTML = `
          <div class="max-w-7xl mx-auto space-y-5">
            <!-- Ultra-Minimal Sticky Bar -->
            <div class="sticky top-0 z-20 bg-white/95 backdrop-blur rounded-2xl border border-[#E5E5EA] px-3.5 py-2.5 flex flex-wrap items-center justify-between gap-3">
              <div class="flex flex-wrap items-center gap-1">${catButtons}</div>
              <div class="flex items-center gap-2.5 text-xs">
                <div class="inline-flex rounded-xl bg-[#F5F5F7] p-0.5">
                  <button id="toolPenBtn" type="button" class="px-2.5 py-1 rounded-lg font-medium ${state.tool === 'pen' ? 'bg-white text-[#1D1D1F] shadow-sm' : 'text-[#6E6E73]'}">${state.lang === 'th' ? 'ปากกา' : 'Pen'}</button>
                  <button id="toolEraserBtn" type="button" class="px-2.5 py-1 rounded-lg font-medium ${state.tool === 'eraser' ? 'bg-white text-[#1D1D1F] shadow-sm' : 'text-[#6E6E73]'}">${state.lang === 'th' ? 'ยางลบ' : 'Eraser'}</button>
                </div>
                <label class="flex items-center gap-1.5 text-[#6E6E73]">
                  <span>${state.strokeWidth.toFixed(1)}</span>
                  <input id="strokeWidthSlider" type="range" min="1.5" max="6.5" step="0.2" value="${state.strokeWidth}" class="w-16" />
                </label>
              </div>
            </div>

            <!-- Character Sheet Grid (1 Clear Button Only Per Card) -->
            <div id="characterSheetGrid" class="flex flex-wrap gap-3"></div>
          </div>
        `;

        const grid = document.getElementById('characterSheetGrid');
        if (!filtered.length) {
          grid.innerHTML = `<div class="w-full p-10 text-center rounded-2xl bg-white border border-[#E5E5EA] text-sm text-[#6E6E73]">${state.lang === 'th' ? 'ไม่มีอักขระในตัวกรองนี้ (ปรับตัวกรองได้ในหน้าตั้งค่า)' : 'No characters match filter (adjust in Settings)'}</div>`;
        } else {
          filtered.forEach(spec => {
            const card = document.createElement('div');
            card.setAttribute('data-cell-card', String(spec.codepoint));
            card.className = `rounded-2xl bg-white border transition-colors flex flex-col items-center p-2.5 ${
              state.selectedCp === spec.codepoint ? 'border-[#1D1D1F] ring-2 ring-black/5' : 'border-[#E5E5EA]'
            }`;
            card.innerHTML = `
              <div class="w-full flex items-center justify-between mb-1.5 px-1">
                <span class="text-sm font-medium leading-none">${spec.isCombining ? '◌' + spec.char : spec.char}</span>
                <span data-badge class="w-2 h-2 rounded-full bg-[#E5E5EA]"></span>
              </div>
              <canvas class="studio-canvas rounded-xl bg-[#FAFAFC] border border-[#ECECF0] cursor-crosshair" style="width:${cellW}px;height:${cellH}px;"></canvas>
              <div class="w-full flex justify-end mt-1.5 px-0.5">
                <button type="button" data-clear title="${state.lang === 'th' ? 'ล้างกล่อง' : 'Clear'}" class="p-1 rounded-md text-[#8E8E93] hover:text-red-600 hover:bg-[#F2F2F7] disabled:opacity-25">
                  <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            `;
            grid.appendChild(card);
            attachCellEvents(card, card.querySelector('canvas'), spec);
          });
        }

        main.querySelectorAll('[data-cat]').forEach(btn => btn.addEventListener('click', () => { state.category = btn.getAttribute('data-cat'); saveState(true); renderAll(); }));
        document.getElementById('toolPenBtn').addEventListener('click', () => { state.tool = 'pen'; renderAll(); });
        document.getElementById('toolEraserBtn').addEventListener('click', () => { state.tool = 'eraser'; renderAll(); });
        document.getElementById('strokeWidthSlider').addEventListener('input', (e) => {
          state.strokeWidth = Number(e.target.value);
          e.target.previousElementSibling.textContent = state.strokeWidth.toFixed(1);
          saveState(false);
        });
      }
