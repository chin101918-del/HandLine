                <div class="pt-3 space-y-3">
                  <label class="block space-y-1">
                    <span class="text-[#6E6E73]">Supabase Project URL</span>
                    <input id="supaUrlInput" type="url" value="${supaConfig.url || ''}" placeholder="https://xxxx.supabase.co" class="w-full px-3 py-2 rounded-xl border border-[#D2D2D7] bg-white" />
                  </label>
                  <label class="block space-y-1">
                    <span class="text-[#6E6E73]">Supabase Publishable / Anon Key</span>
                    <input id="supaKeyInput" type="password" value="${supaConfig.anonKey || ''}" placeholder="sb_publishable_..." class="w-full px-3 py-2 rounded-xl border border-[#D2D2D7] bg-white" />
                  </label>
                  <button id="saveSupaCfgBtn" type="button" class="px-4 py-2 rounded-xl bg-[#F5F5F7] hover:bg-[#E5E5EA] font-medium">${state.lang === 'th' ? 'บันทึกการตั้งค่า Supabase' : 'Save Supabase Config'}</button>
                </div>
              </details>
            </div>
          </div>
        `;

        const gBtn = document.getElementById('googleLoginBtn');
        if (gBtn) gBtn.addEventListener('click', async () => {
          const client = initSupabaseClient();
          if (!client) {
            showToast(state.lang === 'th' ? 'ไม่พบการเชื่อมต่อ Supabase กรุณารีเฟรชหรือตรวจสอบการตั้งค่า' : 'Supabase not configured');
            return;
          }
          gBtn.disabled = true;
          gBtn.classList.add('opacity-60');
          try {
            const { error } = await client.auth.signInWithOAuth({
              provider: 'google',
              options: { redirectTo: window.location.origin + window.location.pathname }
            });
            if (error) {
              gBtn.disabled = false;
              gBtn.classList.remove('opacity-60');
              showToast(error.message);
            }
          } catch (err) {
            gBtn.disabled = false;
            gBtn.classList.remove('opacity-60');
            showToast(String(err));
          }
        });

        const guestBtn = document.getElementById('continueGuestBtn');
        if (guestBtn) guestBtn.addEventListener('click', () => { state.tab = 'preview'; renderAll(); });

        const backBtn = document.getElementById('backToStudioFromLogin');
        if (backBtn) backBtn.addEventListener('click', () => { state.tab = 'preview'; renderAll(); });

        const syncBtn = document.getElementById('syncNowBtn');
        if (syncBtn) syncBtn.addEventListener('click', async () => {
          await syncActiveProjectToCloud();
          await syncUserFontsFromCloud();
          showToast(state.lang === 'th' ? 'ซิงก์ข้อมูลฟอนต์เรียบร้อย' : 'Cloud sync complete');
        });

        const outBtn = document.getElementById('logoutBtn');
        if (outBtn) outBtn.addEventListener('click', async () => {
          if (supabaseClient) await supabaseClient.auth.signOut();
          currentUser = null;
          renderAll();
          showToast(state.lang === 'th' ? 'ออกจากระบบแล้ว' : 'Signed out');
        });

        document.getElementById('saveSupaCfgBtn').addEventListener('click', async () => {
          supaConfig = {
            url: document.getElementById('supaUrlInput').value.trim(),
            anonKey: document.getElementById('supaKeyInput').value.trim()
          };
          try { localStorage.setItem(SUPA_CFG_KEY, JSON.stringify(supaConfig)); } catch (_) {}
          const client = initSupabaseClient();
          if (client) {
            const { data } = await client.auth.getSession();
            currentUser = data?.session?.user || null;
            if (currentUser) await syncUserFontsFromCloud();
          }
          renderAll();
          showToast(state.lang === 'th' ? 'บันทึกการตั้งค่า Supabase แล้ว' : 'Saved Supabase config');
        });
      }
      // --- 7. Settings (Clean & Minimal) ---
      function renderSettings(main) {
        main.innerHTML = `
          <div class="max-w-2xl mx-auto space-y-5">
            <h1 class="text-2xl font-semibold tracking-tight">${state.lang === 'th' ? 'ตั้งค่า' : 'Settings'}</h1>

            <!-- Writing & Input Protection -->
            <div class="bg-white rounded-2xl border border-[#E5E5EA] p-5 space-y-4 text-sm">
              <div class="text-xs font-semibold uppercase tracking-wider text-[#8E8E93]">${state.lang === 'th' ? 'ทั่วไปและปากกา' : 'General & Pen'}</div>
              <div class="flex items-center justify-between gap-4">
                <span>${state.lang === 'th' ? 'ภาษา (Language)' : 'Language'}</span>
                <div class="inline-flex rounded-xl bg-[#F5F5F7] p-0.5 text-xs">
                  <button id="setLangTh" type="button" class="px-3 py-1 rounded-lg font-medium ${state.lang === 'th' ? 'bg-white shadow-sm' : 'text-[#6E6E73]'}">ไทย</button>
                  <button id="setLangEn" type="button" class="px-3 py-1 rounded-lg font-medium ${state.lang === 'en' ? 'bg-white shadow-sm' : 'text-[#6E6E73]'}">English</button>
                </div>
              </div>
              <div class="flex items-center justify-between gap-4">
                <span>${state.lang === 'th' ? 'โหมดป้องกันฝ่ามือ (iPad / Apple Pencil)' : 'Input Protection Mode'}</span>
                <div class="inline-flex rounded-xl bg-[#F5F5F7] p-0.5 text-xs">
                  <button id="setModePencil" type="button" class="px-3 py-1 rounded-lg font-medium ${state.inputMode === 'pencil_only' ? 'bg-[#1D1D1F] text-white' : 'text-[#6E6E73]'}">Apple Pencil Only</button>
                  <button id="setModeFinger" type="button" class="px-3 py-1 rounded-lg font-medium ${state.inputMode === 'finger_drawing' ? 'bg-white shadow-sm' : 'text-[#6E6E73]'}">Finger Drawing</button>
                </div>
              </div>
              <label class="flex items-center justify-between gap-4"><span>${state.lang === 'th' ? 'ความสมูทของเส้น' : 'Stroke Smoothing'}: <strong id="setSmoothVal">${Math.round((state.smoothing || 0.45)*100)}%</strong></span><input id="setSmoothSlider" type="range" min="0.1" max="0.75" step="0.05" value="${state.smoothing || 0.45}" /></label>
            </div>

            <!-- Guides -->
            <div class="bg-white rounded-2xl border border-[#E5E5EA] p-5 space-y-4 text-sm">
              <div class="text-xs font-semibold uppercase tracking-wider text-[#8E8E93]">${state.lang === 'th' ? 'เส้นไกด์และลายน้ำ' : 'Typography Guides'}</div>
              <label class="flex items-center justify-between"><span>${state.lang === 'th' ? 'แสดงเส้นกึ่งกลาง' : 'Show Center Guide'}</span><input id="setCenterGuide" type="checkbox" ${state.showCenterGuide ? 'checked' : ''} /></label>
              <label class="flex items-center justify-between"><span>${state.lang === 'th' ? 'แสดงลายน้ำอักขระตัวอย่าง' : 'Show Ghost Character'}</span><input id="setGhostChar" type="checkbox" ${state.showGhostChar ? 'checked' : ''} /></label>
              <label class="flex items-center justify-between"><span>Baseline: <strong id="setBaseVal">${Math.round(state.guides.baseline*100)}%</strong></span><input id="setBaseSlider" type="range" min="0.64" max="0.84" step="0.01" value="${state.guides.baseline}" /></label>
              <label class="flex items-center justify-between"><span>x-Height: <strong id="setXVal">${Math.round(state.guides.xHeight*100)}%</strong></span><input id="setXSlider" type="range" min="0.34" max="0.56" step="0.01" value="${state.guides.xHeight}" /></label>
              <label class="flex items-center justify-between"><span>Ascender: <strong id="setAscVal">${Math.round(state.guides.ascender*100)}%</strong></span><input id="setAscSlider" type="range" min="0.08" max="0.24" step="0.01" value="${state.guides.ascender}" /></label>
              <label class="flex items-center justify-between"><span>Descender: <strong id="setDescVal">${Math.round(state.guides.descender*100)}%</strong></span><input id="setDescSlider" type="range" min="0.84" max="0.96" step="0.01" value="${state.guides.descender}" /></label>
            </div>
          </div>
        `;

        document.getElementById('setLangTh').addEventListener('click', () => { state.lang = 'th'; saveState(true); renderAll(); });
        document.getElementById('setLangEn').addEventListener('click', () => { state.lang = 'en'; saveState(true); renderAll(); });
        document.getElementById('setModePencil').addEventListener('click', () => { state.inputMode = 'pencil_only'; saveState(true); renderAll(); });
        document.getElementById('setModeFinger').addEventListener('click', () => { state.inputMode = 'finger_drawing'; saveState(true); renderAll(); });
        document.getElementById('setSmoothSlider').addEventListener('input', (e) => { state.smoothing = Number(e.target.value); document.getElementById('setSmoothVal').textContent = Math.round(state.smoothing*100)+'%'; saveState(false); });
        document.getElementById('setCenterGuide').addEventListener('change', (e) => { state.showCenterGuide = e.target.checked; saveState(true); });
        document.getElementById('setGhostChar').addEventListener('change', (e) => { state.showGhostChar = e.target.checked; saveState(true); });
        document.getElementById('setBaseSlider').addEventListener('input', (e) => { state.guides.baseline = Number(e.target.value); document.getElementById('setBaseVal').textContent = Math.round(state.guides.baseline*100)+'%'; saveState(false); });
        document.getElementById('setXSlider').addEventListener('input', (e) => { state.guides.xHeight = Number(e.target.value); document.getElementById('setXVal').textContent = Math.round(state.guides.xHeight*100)+'%'; saveState(false); });
        document.getElementById('setAscSlider').addEventListener('input', (e) => { state.guides.ascender = Number(e.target.value); document.getElementById('setAscVal').textContent = Math.round(state.guides.ascender*100)+'%'; saveState(false); });
        document.getElementById('setDescSlider').addEventListener('input', (e) => { state.guides.descender = Number(e.target.value); document.getElementById('setDescVal').textContent = Math.round(state.guides.descender*100)+'%'; saveState(false); });
      }

      function renderAll() {
        renderSidebar();
        const main = document.getElementById('mainContent');
        if (state.tab === 'dashboard') renderDashboard(main);
        else if (state.tab === 'my-fonts') {
          if (state.librarySubView === 'studio') renderStudio(main);
          else renderMyFonts(main);
        }
        else if (state.tab === 'preview') renderPreview(main);
        else if (state.tab === 'login') renderLogin(main);
        else if (state.tab === 'settings') renderSettings(main);
        if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
      }

      function toggleLanguage() { state.lang = state.lang === 'th' ? 'en' : 'th'; saveState(true); renderAll(); }
      document.getElementById('mobileAuthBtn').addEventListener('click', () => { state.tab = 'login'; renderAll(); });
      document.getElementById('sidebarAuthBtn').addEventListener('click', () => { state.tab = 'login'; closeMobileSidebar(); renderAll(); });
      document.getElementById('mobileMenuBtn').addEventListener('click', openMobileSidebar);
      document.getElementById('closeSidebarBtn').addEventListener('click', closeMobileSidebar);
      document.getElementById('sidebarBackdrop').addEventListener('click', closeMobileSidebar);

      async function bootstrapApp() {
        // 1. Restore from IndexedDB first (never discards local data)
        const idb = await loadFromIndexedDB();
        if (idb.projects && idb.projects.length > 0) {
          const byId = new Map(state.projects.map(p => [p.id, p]));
          idb.projects.forEach(p => {
            const mig = migrateProject(p);
            const cur = byId.get(mig.id);
            if (!cur || new Date(mig.updatedAt || 0) >= new Date(cur.updatedAt || 0)) byId.set(mig.id, mig);
          });
          state.projects = Array.from(byId.values());
          if (!state.projects.some(p => p.id === state.activeProjectId)) state.activeProjectId = state.projects[0].id;
        }
        if (idb.meta) {
          if (idb.meta.variation) state.variation = { ...state.variation, ...idb.meta.variation };
          if (idb.meta.inputMode) state.inputMode = idb.meta.inputMode;
          if (idb.meta.guides) state.guides = { ...state.guides, ...idb.meta.guides };
          if (idb.meta.previewTextColor) state.previewTextColor = idb.meta.previewTextColor;
          if (idb.meta.previewHighlightColor) state.previewHighlightColor = idb.meta.previewHighlightColor;
          if (idb.meta.previewHtml) state.previewHtml = idb.meta.previewHtml;
          if (Array.isArray(idb.meta.mixProjectIds)) state.mixProjectIds = idb.meta.mixProjectIds;
          if (idb.meta.activeProjectId && state.projects.some(p => p.id === idb.meta.activeProjectId)) state.activeProjectId = idb.meta.activeProjectId;
        }

        // 2. Restore Supabase Google Auth session if configured
        const client = initSupabaseClient();
        if (client) {
          try {
            const { data } = await client.auth.getSession();
            currentUser = data?.session?.user || null;
            client.auth.onAuthStateChange((_ev, session) => {
              currentUser = session?.user || null;
              if (currentUser) syncUserFontsFromCloud();
              renderAll();
            });
            if (currentUser) await syncUserFontsFromCloud();
          } catch (_) {}
        }

        for (const p of state.projects) {
          if (p.fontType === 'ttf' && p.ttfBase64 && p.ttfFamily) {
            try {
              const bin = atob(p.ttfBase64);
              const bytes = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
              const face = new FontFace(p.ttfFamily, bytes.buffer);
              await face.load();
              document.fonts.add(face);
            } catch (_) {}
          }
        }
        renderAll();
      }
      bootstrapApp();
    })();
  </script>
</body>
</html>
