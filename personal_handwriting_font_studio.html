<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Personal Handwriting Font Studio — สตูดิโอสร้างฟอนต์ลายมือ</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #F5F5F7;
      --bg-surface: #FFFFFF;
      --border-subtle: #E5E5EA;
      --text-primary: #1D1D1F;
      --text-secondary: #6E6E73;
      --accent-ink: #1D1D1F;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }
    .studio-canvas {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    input[type="range"] {
      accent-color: #1D1D1F;
    }
    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #D2D2D7;
      border-radius: 999px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col lg:flex-row bg-[#F5F5F7] text-[#1D1D1F]">
  <!-- Mobile / Tablet Header -->
  <header class="lg:hidden sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-[#E5E5EA] px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <button id="mobileMenuBtn" type="button" class="p-2 rounded-xl border border-[#E5E5EA] hover:bg-[#F5F5F7]" aria-label="Menu">
        <i data-lucide="menu" class="w-4 h-4"></i>
      </button>
      <div>
        <div class="text-sm font-semibold leading-tight">Personal Handwriting</div>
        <div class="text-[11px] text-[#6E6E73] leading-tight">Font Studio</div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="mobileSaveBadge" class="text-[11px] text-[#6E6E73] px-2 py-1 rounded-lg bg-[#F5F5F7]">บันทึกอัตโนมัติ</span>
      <button id="mobileLangBtn" type="button" class="text-xs px-2.5 py-1.5 rounded-lg border border-[#D2D2D7] font-medium">EN</button>
    </div>
  </header>

  <!-- Sidebar Navigation -->
  <aside id="sidebar" class="hidden lg:flex fixed lg:sticky top-0 left-0 z-40 h-screen w-64 shrink-0 bg-white border-r border-[#E5E5EA] flex-col justify-between p-4">
    <div>
      <div class="flex items-center justify-between px-2 py-2.5 mb-4">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-[#1D1D1F] text-white flex items-center justify-center text-sm font-semibold">กA</div>
          <div>
            <div class="text-sm font-semibold tracking-tight leading-tight">Personal Handwriting</div>
            <div class="text-[11px] text-[#6E6E73] leading-tight">Font Studio</div>
          </div>
        </div>
        <button id="closeSidebarBtn" type="button" class="lg:hidden p-1.5 rounded-lg hover:bg-[#F5F5F7]">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Active Project Pill -->
      <div class="mb-4 px-3 py-2.5 rounded-xl bg-[#F5F5F7] border border-[#ECECF0]">
        <div class="text-[10px] uppercase tracking-wider text-[#8E8E93]" data-i18n="activeProjectLabel">โปรเจกต์ปัจจุบัน</div>
        <div id="sidebarProjectName" class="text-xs font-semibold truncate mt-0.5">ลายมือของฉัน 01</div>
        <div class="mt-2 h-1.5 w-full rounded-full bg-[#E5E5EA] overflow-hidden">
          <div id="sidebarProgressBar" class="h-full bg-[#1D1D1F] transition-all duration-300" style="width: 0%"></div>
        </div>
        <div id="sidebarProgressText" class="text-[11px] text-[#6E6E73] mt-1">0 / 151 อักขระ</div>
      </div>

      <nav id="navList" class="space-y-1"></nav>
    </div>

    <div class="pt-4 border-t border-[#E5E5EA] space-y-2.5">
      <div class="flex items-center justify-between px-2">
        <span id="saveStatusText" class="text-[11px] text-[#6E6E73] flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-600"></span>
          <span data-i18n="autoSaved">บันทึกอัตโนมัติแล้ว</span>
        </span>
        <button id="langToggleBtn" type="button" class="text-xs px-2.5 py-1 rounded-lg border border-[#D2D2D7] hover:bg-[#F5F5F7] font-medium">EN</button>
      </div>
    </div>
  </aside>

  <!-- Mobile Sidebar Backdrop -->
  <div id="sidebarBackdrop" class="hidden fixed inset-0 z-30 bg-black/25 lg:hidden"></div>

  <!-- Main Workspace -->
  <main id="mainContent" class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8 overflow-y-auto scrollbar-thin"></main>

  <!-- Modal Container -->
  <div id="modalOverlay" class="hidden fixed inset-0 z-50 bg-black/30 backdrop-blur-[2px] flex items-center justify-center p-4">
    <div id="modalCard" class="bg-white rounded-2xl border border-[#E5E5EA] w-full max-w-md p-6 shadow-xl"></div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden px-4 py-2.5 rounded-xl bg-[#1D1D1F] text-white text-xs font-medium shadow-lg"></div>

  <script>
    (() => {
      'use strict';

      // --- Character Set Definitions ---
      const COMBINING_SET = new Set(['ั','ิ','ี','ึ','ื','ุ','ู','ฺ','็','่','้','๊','๋','์','ํ']);
      const ABOVE_VOWELS = new Set([0x0E31, 0x0E34, 0x0E35, 0x0E36, 0x0E37, 0x0E47, 0x0E4D]);
      const TONE_MARKS = new Set([0x0E48, 0x0E49, 0x0E4A, 0x0E4B, 0x0E4C, 0x0E4E]);
      const BELOW_MARKS = new Set([0x0E38, 0x0E39, 0x0E3A]);
      const TALL_ASCENDERS = new Set([0x0E1B, 0x0E1D, 0x0E1F, 0x0E2C]);

      function buildSpecs(chars, category) {
        return chars.map(ch => ({
          codepoint: ch.codePointAt(0),
          char: ch,
          category,
          isCombining: COMBINING_SET.has(ch)
        }));
      }

      const CHARACTER_SET = [
        ...buildSpecs(['ก','ข','ฃ','ค','ฅ','ฆ','ง','จ','ฉ','ช','ซ','ฌ','ญ','ฎ','ฏ','ฐ','ฑ','ฒ','ณ','ด','ต','ถ','ท','ธ','น','บ','ป','ผ','ฝ','พ','ฟ','ภ','ม','ย','ร','ล','ว','ศ','ษ','ส','ห','ฬ','อ','ฮ'], 'thai_consonants'),
        ...buildSpecs(['ะ','ั','า','ำ','ิ','ี','ึ','ื','ุ','ู','เ','แ','โ','ใ','ไ','ฤ','ฦ'], 'thai_vowels'),
        ...buildSpecs(['่','้','๊','๋','็','์','ํ','ฯ','ๆ','฿'], 'thai_tones'),
        ...buildSpecs(['๐','๑','๒','๓','๔','๕','๖','๗','๘','๙'], 'thai_digits'),
        ...buildSpecs('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''), 'latin_upper'),
        ...buildSpecs('abcdefghijklmnopqrstuvwxyz'.split(''), 'latin_lower'),
        ...buildSpecs('0123456789.,!?;:-()"\'/'.split(''), 'digits_punct')
      ];

      const CATEGORIES = [
        { id: 'thai_consonants', th: 'พยัญชนะไทย (ก–ฮ)', en: 'Thai Consonants' },
        { id: 'thai_vowels', th: 'สระไทย', en: 'Thai Vowels' },
        { id: 'thai_tones', th: 'วรรณยุกต์และเครื่องหมาย', en: 'Tones & Marks' },
        { id: 'thai_digits', th: 'ตัวเลขไทย', en: 'Thai Digits' },
        { id: 'latin_upper', th: 'อังกฤษ A–Z', en: 'English A–Z' },
        { id: 'latin_lower', th: 'อังกฤษ a–z', en: 'English a–z' },
        { id: 'digits_punct', th: 'ตัวเลขและสัญลักษณ์', en: 'Digits & Symbols' }
      ];

      const NAV_ITEMS = [
        { id: 'dashboard', icon: 'layout-dashboard', th: 'แดชบอร์ด', en: 'Dashboard' },
        { id: 'my-fonts', icon: 'folder-open', th: 'ฟอนต์ของฉัน', en: 'My Fonts' },
        { id: 'studio', icon: 'pen-tool', th: 'สตูดิโอลายมือ', en: 'Handwriting Studio' },
        { id: 'preview', icon: 'eye', th: 'ตัวอย่างฟอนต์', en: 'Font Preview' },
        { id: 'export', icon: 'download', th: 'ส่งออกฟอนต์', en: 'Export' },
        { id: 'settings', icon: 'settings', th: 'ตั้งค่า', en: 'Settings' }
      ];

      const PRESET_SENTENCES = [
        'สวัสดีครับ ยินดีต้อนรับสู่สตูดิโอลายมือ',
        'พี่ปี้ปุ๋ย น้ำดื่มเย็นชื่นใจ',
        'ผู้ใหญ่หาผ้าใหม่ ให้สะใภ้ใช้คล้องคอ',
        'กตัญญู ฐานข้อมูล ปลา ฝา ฟัน',
        'The quick brown fox jumps over 0123456789'
      ];

      const I18N = {
        th: {
          activeProjectLabel: 'โปรเจกต์ปัจจุบัน',
          autoSaved: 'บันทึกอัตโนมัติแล้ว',
          charsUnit: 'อักขระ',
          dashboardTitle: 'แดชบอร์ดสตูดิโอ',
          dashboardSub: 'ติดตามความคืบหน้าของลายมือภาษาไทยและอังกฤษ พร้อมกลับไปเขียนต่อได้ทันที',
          continueStudio: 'เขียนลายมือต่อในสตูดิโอ',
          openPreview: 'ดูตัวอย่างฟอนต์',
          loadSamples: 'เติมลายมือตัวอย่าง 10 อักขระ',
          myFontsTitle: 'ฟอนต์ของฉัน',
          myFontsSub: 'จัดการโปรเจกต์ฟอนต์ลายมือทั้งหมดของคุณ บันทึกอัตโนมัติในเครื่อง',
          newFontBtn: 'สร้างฟอนต์ใหม่',
          studioTitle: 'สตูดิโอลายมือ (Character Sheet)',
          studioSub: 'เขียนลงในแต่ละช่องขนาดใกล้เคียงตัวอักษรจริง รองรับเมาส์ แทร็กแพด ทัชสกรีน และ Apple Pencil',
          penTool: 'ปากกา',
          eraserTool: 'ยางลบ',
          centerGuide: 'เส้นกึ่งกลาง',
          ghostChar: 'ลายน้ำอักขระ',
          filterAll: 'ทั้งหมด',
          filterTodo: 'ยังไม่เขียน',
          filterDone: 'เขียนแล้ว',
          previewTitle: 'ตัวอย่างฟอนต์ภาษาไทยและอังกฤษ',
          previewSub: 'ทดสอบการจัดวางสระบน สระล่าง และวรรณยุกต์ภาษาไทยแบบเรียลไทม์ก่อนส่งออก',
          exportTitle: 'ส่งออกฟอนต์ (.TTF)',
          exportSub: 'ตรวจสอบโครงสร้าง OpenType ภาษาไทย (GPOS mark/mkmk & GSUB ccmp) และเตรียมข้อมูลสำหรับคอมไพล์ไฟล์ .TTF',
          settingsTitle: 'ตั้งค่าสตูดิโอและเส้นไกด์',
          settingsSub: 'ปรับขนาดช่องเขียน สัดส่วนเส้นฐาน (Baseline) และความไวแรงกดให้เหมาะกับมือของคุณ'
        },
        en: {
          activeProjectLabel: 'Active Project',
          autoSaved: 'Auto-saved',
          charsUnit: 'glyphs',
          dashboardTitle: 'Studio Dashboard',
          dashboardSub: 'Track your Thai & English handwriting progress and jump right back into writing.',
          continueStudio: 'Continue in Handwriting Studio',
          openPreview: 'Open Font Preview',
          loadSamples: 'Load 10 Sample Glyphs',
          myFontsTitle: 'My Fonts',
          myFontsSub: 'Manage multiple handwriting font projects with automatic local persistence.',
          newFontBtn: 'New Font Project',
          studioTitle: 'Handwriting Studio (Character Sheet)',
          studioSub: 'Write directly inside actual-size character cells with Mouse, Trackpad, Touch, or Apple Pencil.',
          penTool: 'Pen',
          eraserTool: 'Eraser',
          centerGuide: 'Center Guide',
          ghostChar: 'Ghost Glyph',
          filterAll: 'All',
          filterTodo: 'Unwritten',
          filterDone: 'Completed',
          previewTitle: 'Thai & English Font Preview',
          previewSub: 'Test live Thai vowel and tone mark stacking before compiling your TrueType font.',
          exportTitle: 'Export Font (.TTF)',
          exportSub: 'Inspect Thai OpenType GPOS/GSUB rules, validate glyph coverage, and export project data.',
          settingsTitle: 'Studio & Guide Settings',
          settingsSub: 'Calibrate actual-size cell dimensions, typographic guide ratios, and Apple Pencil pressure.'
        }
      };

      const STORAGE_KEY = 'phfs_canvas_state_v1';

      function createProject(name, familyName) {
        const now = new Date().toISOString();
        return {
          id: 'proj_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          name,
          familyName,
          styleName: 'Regular',
          designer: 'Personal Studio User',
          version: '1.000',
          unitsPerEm: 1000,
          glyphs: {},
          createdAt: now,
          updatedAt: now
        };
      }

      const defaultState = {
        lang: 'th',
        tab: 'studio',
        category: 'thai_consonants',
        filterMode: 'all',
        selectedCp: 0x0E01,
        tool: 'pen',
        strokeWidth: 3.2,
        pressureSensitive: true,
        cellWidth: 96,
        showCenterGuide: true,
        showGhostChar: true,
        guides: {
          ascender: 0.14,
          capHeight: 0.28,
          xHeight: 0.44,
          baseline: 0.74,
          descender: 0.92
        },
        previewText: 'สวัสดีครับ พี่ปี้ปุ๋ย น้ำดื่มเย็นชื่นใจ\nThe quick brown fox 12345',
        previewSize: 44,
        previewLineHeight: 1.7,
        previewSpacing: 2,
        projects: [createProject('ลายมือของฉัน 01', 'MyThaiHand')],
        activeProjectId: null
      };
      defaultState.activeProjectId = defaultState.projects[0].id;

      let state = loadState();
      const undoStacks = {};
      const redoStacks = {};

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.projects) && parsed.projects.length > 0) {
              return { ...defaultState, ...parsed, guides: { ...defaultState.guides, ...(parsed.guides || {}) } };
            }
          }
        } catch (e) {
          // Ignore sandbox storage restrictions
        }
        return JSON.parse(JSON.stringify(defaultState));
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          // Ignore storage errors
        }
        updateSidebarStats();
      }

      function getActiveProject() {
        return state.projects.find(p => p.id === state.activeProjectId) || state.projects[0];
      }

      function t(key) {
        return (I18N[state.lang] && I18N[state.lang][key]) || key;
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => el.classList.add('hidden'), 2600);
      }

      // Sample natural-looking handwritten strokes for 10 Thai & English chars so users can immediately test Preview/Export
      function loadSampleGlyphs() {
        const proj = getActiveProject();
        const w = state.cellWidth;
        const h = Math.round(w * 1.25);
        const mk = (pts, width = 3.2) => ({
          id: 's_' + Math.random().toString(36).slice(2, 8),
          width,
          points: pts.map(([rx, ry, p = 0.55]) => ({ x: rx * w, y: ry * h, pressure: p }))
        });

        const samples = {
          0x0E01: { char: 'ก', cat: 'thai_consonants', strokes: [mk([[0.28,0.74,0.5],[0.29,0.50,0.65],[0.36,0.44,0.6],[0.32,0.39,0.55],[0.48,0.31,0.7],[0.68,0.37,0.65],[0.71,0.55,0.6],[0.72,0.74,0.5]])] },
          0x0E2A: { char: 'ส', cat: 'thai_consonants', strokes: [mk([[0.28,0.74],[0.29,0.46],[0.45,0.36],[0.66,0.44],[0.68,0.74]]), mk([[0.58,0.42],[0.78,0.26]])] },
          0x0E27: { char: 'ว', cat: 'thai_consonants', strokes: [mk([[0.32,0.68],[0.44,0.74],[0.64,0.68],[0.66,0.46],[0.52,0.36],[0.36,0.40]])] },
          0x0E14: { char: 'ด', cat: 'thai_consonants', strokes: [mk([[0.52,0.56],[0.42,0.68],[0.30,0.62],[0.32,0.44],[0.50,0.34],[0.68,0.44],[0.70,0.74]])] },
          0x0E1B: { char: 'ป', cat: 'thai_consonants', strokes: [mk([[0.28,0.40],[0.30,0.73],[0.68,0.73],[0.70,0.16]])] },
          0x0E31: { char: 'ั', cat: 'thai_vowels', strokes: [mk([[0.34,0.26],[0.48,0.34],[0.66,0.25]])] },
          0x0E35: { char: 'ี', cat: 'thai_vowels', strokes: [mk([[0.32,0.32],[0.50,0.24],[0.66,0.32],[0.32,0.32]]), mk([[0.64,0.32],[0.66,0.20]])] },
          0x0E48: { char: '่', cat: 'thai_tones', strokes: [mk([[0.50,0.16],[0.50,0.28]])] },
          0x0E49: { char: '้', cat: 'thai_tones', strokes: [mk([[0.38,0.26],[0.48,0.18],[0.58,0.24],[0.68,0.16]])] },
          0x0041: { char: 'A', cat: 'latin_upper', strokes: [mk([[0.26,0.74],[0.50,0.28],[0.74,0.74]]), mk([[0.35,0.56],[0.65,0.56]])] }
        };

        Object.entries(samples).forEach(([cpStr, item]) => {
          const cp = Number(cpStr);
          proj.glyphs[cp] = {
            codepoint: cp,
            character: item.char,
            category: item.cat,
            canvasWidth: w,
            canvasHeight: h,
            strokes: item.strokes,
            isCompleted: true,
            updatedAt: new Date().toISOString()
          };
        });
        proj.updatedAt = new Date().toISOString();
        saveState();
        renderAll();
        showToast(state.lang === 'th' ? 'เติมลายมือตัวอย่าง 10 อักขระเรียบร้อยแล้ว' : 'Loaded 10 sample glyphs');
      }

      // --- Sidebar & Navigation ---
      function updateSidebarStats() {
        const proj = getActiveProject();
        const done = Object.values(proj.glyphs).filter(g => g.strokes && g.strokes.length > 0).length;
        const pct = Math.round((done / CHARACTER_SET.length) * 100);
        const nameEl = document.getElementById('sidebarProjectName');
        const barEl = document.getElementById('sidebarProgressBar');
        const textEl = document.getElementById('sidebarProgressText');
        if (nameEl) nameEl.textContent = proj.name;
        if (barEl) barEl.style.width = pct + '%';
        if (textEl) textEl.textContent = `${done} / ${CHARACTER_SET.length} ${t('charsUnit')} (${pct}%)`;
      }

      function renderSidebar() {
        const nav = document.getElementById('navList');
        nav.innerHTML = NAV_ITEMS.map(item => {
          const active = state.tab === item.id;
          return `
            <button type="button" data-nav="${item.id}" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm transition-colors ${
              active ? 'bg-[#1D1D1F] text-white font-medium' : 'text-[#424245] hover:bg-[#F2F2F7]'
            }">
              <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0"></i>
              <span>${item[state.lang]}</span>
            </button>
          `;
        }).join('');

        nav.querySelectorAll('[data-nav]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.tab = btn.getAttribute('data-nav');
            closeMobileSidebar();
            saveState();
            renderAll();
          });
        });

        document.getElementById('langToggleBtn').textContent = state.lang === 'th' ? 'EN' : 'ไทย';
        document.getElementById('mobileLangBtn').textContent = state.lang === 'th' ? 'EN' : 'ไทย';
        document.querySelectorAll('[data-i18n]').forEach(el => {
          el.textContent = t(el.getAttribute('data-i18n'));
        });
        updateSidebarStats();
      }

      function openMobileSidebar() {
        document.getElementById('sidebar').classList.remove('hidden');
        document.getElementById('sidebar').classList.add('flex');
        document.getElementById('sidebarBackdrop').classList.remove('hidden');
      }

      function closeMobileSidebar() {
        if (window.innerWidth < 1024) {
          document.getElementById('sidebar').classList.add('hidden');
          document.getElementById('sidebar').classList.remove('flex');
          document.getElementById('sidebarBackdrop').classList.add('hidden');
        }
      }

      // --- Canvas Drawing Engine for Character Cells ---
      function drawCellCanvas(canvas, spec, strokes, width, height, extraStroke = null) {
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        const dpr = window.devicePixelRatio || 1;
        const targetW = Math.round(width * dpr);
        const targetH = Math.round(height * dpr);
        if (canvas.width !== targetW || canvas.height !== targetH) {
          canvas.width = targetW;
          canvas.height = targetH;
        }

        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, width, height);

        const drawGuide = (ratio, color, dashed = true) => {
          const y = Math.round(height * ratio) + 0.5;
          ctx.save();
          ctx.strokeStyle = color;
          ctx.lineWidth = 1;
          if (dashed) ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
          ctx.restore();
        };

        drawGuide(state.guides.ascender, 'rgba(148, 163, 184, 0.36)', true);
        drawGuide(state.guides.capHeight, 'rgba(148, 163, 184, 0.24)', true);
        drawGuide(state.guides.xHeight, 'rgba(37, 99, 235, 0.20)', true);
        drawGuide(state.guides.baseline, 'rgba(29, 29, 31, 0.28)', false);
        drawGuide(state.guides.descender, 'rgba(148, 163, 184, 0.36)', true);

        if (state.showCenterGuide) {
          const cx = Math.round(width / 2) + 0.5;
          ctx.save();
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.24)';
          ctx.setLineDash([2, 4]);
          ctx.beginPath();
          ctx.moveTo(cx, 0);
          ctx.lineTo(cx, height);
          ctx.stroke();
          ctx.restore();
        }

        const list = extraStroke ? [...strokes, extraStroke] : strokes;

        if (state.showGhostChar && list.length === 0) {
          ctx.save();
          ctx.fillStyle = 'rgba(29, 29, 31, 0.08)';
          ctx.font = `400 ${Math.round(height * 0.46)}px "Noto Sans Thai", "Inter", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'alphabetic';
          ctx.fillText(spec.isCombining ? '◌' + spec.char : spec.char, width / 2, height * state.guides.baseline);
          ctx.restore();
        }

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#1D1D1F';
        ctx.fillStyle = '#1D1D1F';

        for (const s of list) {
          const pts = s.points;
          if (!pts || pts.length === 0) continue;
          if (pts.length === 1) {
            const p = pts[0];
            const r = Math.max(1, s.width * 0.5 * (state.pressureSensitive ? 0.65 + 0.7 * p.pressure : 1));
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fill();
            continue;
          }
          for (let i = 1; i < pts.length; i++) {
            const p0 = pts[i - 1];
            const p1 = pts[i];
            const pr = state.pressureSensitive ? (p0.pressure + p1.pressure) / 2 : 0.5;
            ctx.lineWidth = Math.max(1.1, s.width * (0.65 + 0.7 * pr));
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function setGlyphStrokes(cp, spec, nextStrokes, recordUndo = true) {
        const proj = getActiveProject();
        const prev = (proj.glyphs[cp] && proj.glyphs[cp].strokes) ? proj.glyphs[cp].strokes : [];
        if (recordUndo) {
          undoStacks[cp] = [...(undoStacks[cp] || []).slice(-19), prev];
          redoStacks[cp] = [];
        }
        const h = Math.round(state.cellWidth * 1.25);
        proj.glyphs[cp] = {
          codepoint: cp,
          character: spec.char,
          category: spec.category,
          canvasWidth: state.cellWidth,
          canvasHeight: h,
          strokes: nextStrokes,
          isCompleted: nextStrokes.length > 0,
          updatedAt: new Date().toISOString()
        };
        proj.updatedAt = new Date().toISOString();
        saveState();
      }

      function attachCellEvents(card, canvas, spec) {
        let activeStroke = null;
        const proj = getActiveProject();
        const getStrokes = () => (proj.glyphs[spec.codepoint] && proj.glyphs[spec.codepoint].strokes) || [];
        const w = state.cellWidth;
        const h = Math.round(w * 1.25);

        const updateCardChrome = () => {
          const strokes = getStrokes();
          const done = strokes.length > 0;
          const badge = card.querySelector('[data-badge]');
          if (badge) {
            badge.className = done
              ? 'w-4 h-4 rounded-full bg-[#1D1D1F] text-white flex items-center justify-center text-[10px]'
              : 'w-2 h-2 rounded-full bg-[#E5E5EA]';
            badge.innerHTML = done ? '✓' : '';
          }
          const undoBtn = card.querySelector('[data-undo]');
          const redoBtn = card.querySelector('[data-redo]');
          const clearBtn = card.querySelector('[data-clear]');
          if (undoBtn) undoBtn.disabled = !(undoStacks[spec.codepoint] && undoStacks[spec.codepoint].length > 0);
          if (redoBtn) redoBtn.disabled = !(redoStacks[spec.codepoint] && redoStacks[spec.codepoint].length > 0);
          if (clearBtn) clearBtn.disabled = !done;
        };

        const getPoint = (e) => {
          const rect = canvas.getBoundingClientRect();
          const pr = (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : 0.52;
          return {
            x: Number((e.clientX - rect.left).toFixed(2)),
            y: Number((e.clientY - rect.top).toFixed(2)),
            pressure: Number(pr.toFixed(3))
          };
        };

        const eraseNear = (pt) => {
          const strokes = getStrokes();
          const threshold = Math.max(9, state.strokeWidth * 2.8);
          const next = strokes.filter(s => !s.points.some(p => Math.hypot(p.x - pt.x, p.y - pt.y) <= threshold));
          if (next.length !== strokes.length) {
            setGlyphStrokes(spec.codepoint, spec, next, true);
            drawCellCanvas(canvas, spec, next, w, h);
            updateCardChrome();
          }
        };

        canvas.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          state.selectedCp = spec.codepoint;
          document.querySelectorAll('[data-cell-card]').forEach(c => {
            c.classList.remove('border-[#1D1D1F]', 'ring-2', 'ring-black/5');
            c.classList.add('border-[#E5E5EA]');
          });
          card.classList.remove('border-[#E5E5EA]');
          card.classList.add('border-[#1D1D1F]', 'ring-2', 'ring-black/5');

          canvas.setPointerCapture(e.pointerId);
          const pt = getPoint(e);
          if (state.tool === 'eraser') {
            eraseNear(pt);
            return;
          }
          activeStroke = {
            id: 'st_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            width: state.strokeWidth,
            points: [pt]
          };
          drawCellCanvas(canvas, spec, getStrokes(), w, h, activeStroke);
        });

        canvas.addEventListener('pointermove', (e) => {
          if (state.tool === 'eraser') {
            if (e.buttons > 0) eraseNear(getPoint(e));
            return;
          }
          if (!activeStroke) return;
          e.preventDefault();
          const pt = getPoint(e);
          const pts = activeStroke.points;
          const prev = pts[pts.length - 1];
          if (!prev || Math.hypot(pt.x - prev.x, pt.y - prev.y) >= 0.75) {
            pts.push(pt);
            drawCellCanvas(canvas, spec, getStrokes(), w, h, activeStroke);
          }
        });

        const finishStroke = () => {
          if (!activeStroke) return;
          const finished = activeStroke;
          activeStroke = null;
          const next = [...getStrokes(), finished];
          setGlyphStrokes(spec.codepoint, spec, next, true);
          drawCellCanvas(canvas, spec, next, w, h);
          updateCardChrome();
        };

        canvas.addEventListener('pointerup', finishStroke);
        canvas.addEventListener('pointercancel', finishStroke);

        // Cell buttons
        card.querySelector('[data-undo]').addEventListener('click', (e) => {
          e.stopPropagation();
          const stack = undoStacks[spec.codepoint] || [];
          if (!stack.length) return;
          const current = getStrokes();
          const prev = stack.pop();
          redoStacks[spec.codepoint] = [...(redoStacks[spec.codepoint] || []), current];
          setGlyphStrokes(spec.codepoint, spec, prev, false);
          drawCellCanvas(canvas, spec, prev, w, h);
          updateCardChrome();
        });

        card.querySelector('[data-redo]').addEventListener('click', (e) => {
          e.stopPropagation();
          const stack = redoStacks[spec.codepoint] || [];
          if (!stack.length) return;
          const current = getStrokes();
          const next = stack.pop();
          undoStacks[spec.codepoint] = [...(undoStacks[spec.codepoint] || []), current];
          setGlyphStrokes(spec.codepoint, spec, next, false);
          drawCellCanvas(canvas, spec, next, w, h);
          updateCardChrome();
        });

        card.querySelector('[data-clear]').addEventListener('click', (e) => {
          e.stopPropagation();
          if (!getStrokes().length) return;
          setGlyphStrokes(spec.codepoint, spec, [], true);
          drawCellCanvas(canvas, spec, [], w, h);
          updateCardChrome();
        });

        drawCellCanvas(canvas, spec, getStrokes(), w, h);
        updateCardChrome();
      }

      // --- Thai Preview Rendering Engine ---
      function renderThaiPreview(canvas, text, fontSize, lineHeight, letterSpacing) {
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        const proj = getActiveProject();
        const dpr = window.devicePixelRatio || 1;
        const width = canvas.clientWidth || 720;
        const height = 280;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);

        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);

        const padX = 28;
        const lineStep = fontSize * lineHeight;
        let cursorX = padX;
        let baselineY = padX + fontSize * 1.15;
        let lastBaseCenterX = cursorX;
        let lastBaseCp = 0;
        let hasUpperMark = false;

        for (const ch of Array.from(text)) {
          if (ch === '\n') {
            cursorX = padX;
            baselineY += lineStep;
            hasUpperMark = false;
            continue;
          }
          if (ch === ' ') {
            cursorX += fontSize * 0.36 + letterSpacing;
            hasUpperMark = false;
            continue;
          }

          const cp = ch.codePointAt(0);
          const glyph = proj.glyphs[cp];
          const isAbove = ABOVE_VOWELS.has(cp);
          const isTone = TONE_MARKS.has(cp);
          const isBelow = BELOW_MARKS.has(cp);
          const isCombining = isAbove || isTone || isBelow;

          if (!isCombining && cursorX > width - padX - fontSize) {
            cursorX = padX;
            baselineY += lineStep;
            hasUpperMark = false;
          }

          if (glyph && glyph.strokes && glyph.strokes.length > 0) {
            const span = Math.max(glyph.canvasHeight * (state.guides.baseline - state.guides.ascender), 1);
            const scale = fontSize / span;
            let minX = Infinity, maxX = -Infinity;
            glyph.strokes.forEach(s => s.points.forEach(p => {
              if (p.x < minX) minX = p.x;
              if (p.x > maxX) maxX = p.x;
            }));
            const glyphW = Math.max((maxX - minX) * scale, fontSize * 0.22);

            let offsetX = cursorX - minX * scale;
            let offsetY = baselineY - glyph.canvasHeight * state.guides.baseline * scale;

            if (isCombining) {
              const markCenter = ((minX + maxX) / 2) * scale;
              const tallShift = TALL_ASCENDERS.has(lastBaseCp) ? -fontSize * 0.14 : 0;
              offsetX = lastBaseCenterX - markCenter + tallShift;
              if (isTone && hasUpperMark) offsetY -= fontSize * 0.24;
              if (isAbove) hasUpperMark = true;
            } else {
              lastBaseCenterX = cursorX + glyphW * 0.5;
              lastBaseCp = cp;
              hasUpperMark = false;
            }

            ctx.strokeStyle = '#1D1D1F';
            ctx.fillStyle = '#1D1D1F';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            for (const s of glyph.strokes) {
              const pts = s.points;
              if (pts.length === 1) {
                ctx.beginPath();
                ctx.arc(offsetX + pts[0].x * scale, offsetY + pts[0].y * scale, Math.max(1, s.width * scale * 0.5), 0, Math.PI * 2);
                ctx.fill();
                continue;
              }
              for (let i = 1; i < pts.length; i++) {
                const p0 = pts[i - 1], p1 = pts[i];
                ctx.lineWidth = Math.max(1.2, s.width * scale * (0.65 + 0.7 * ((p0.pressure + p1.pressure) / 2)));
                ctx.beginPath();
                ctx.moveTo(offsetX + p0.x * scale, offsetY + p0.y * scale);
                ctx.lineTo(offsetX + p1.x * scale, offsetY + p1.y * scale);
                ctx.stroke();
              }
            }
            if (!isCombining) cursorX += glyphW + fontSize * 0.14 + letterSpacing;
          } else {
            ctx.save();
            ctx.fillStyle = '#C7C7CC';
            ctx.font = `400 ${fontSize}px "Noto Sans Thai", "Inter", sans-serif`;
            ctx.textBaseline = 'alphabetic';
            ctx.fillText(ch, isCombining ? lastBaseCenterX : cursorX, baselineY);
            const m = ctx.measureText(ch).width;
            if (!isCombining) {
              lastBaseCenterX = cursorX + m * 0.5;
              lastBaseCp = cp;
              hasUpperMark = false;
              cursorX += m + letterSpacing;
            } else if (isAbove) {
              hasUpperMark = true;
            }
            ctx.restore();
          }
        }
        ctx.restore();
      }

      // --- OpenType FEA Preview Generator (for Export Inspector) ---
      function generateFeaSnippet(proj) {
        const drawn = Object.values(proj.glyphs).filter(g => g.strokes && g.strokes.length > 0);
        const bases = drawn.filter(g => g.codepoint >= 0x0E01 && g.codepoint <= 0x0E2E);
        const above = drawn.filter(g => ABOVE_VOWELS.has(g.codepoint));
        const tones = drawn.filter(g => TONE_MARKS.has(g.codepoint));
        const lines = [
          'languagesystem DFLT dflt;',
          'languagesystem thai dflt;',
          'languagesystem latn dflt;',
          ''
        ];
        above.forEach(g => lines.push(`markClass uni${g.codepoint.toString(16).toUpperCase().padStart(4,'0')} <anchor 0 540> @MC_top;`));
        tones.forEach(g => lines.push(`markClass uni${g.codepoint.toString(16).toUpperCase().padStart(4,'0')} <anchor 0 600> @MC_tone;`));
        if (bases.length && (above.length || tones.length)) {
          lines.push('', 'feature mark {', '  lookup thai_mark_to_base {');
          bases.slice(0, 8).forEach(b => {
            const x = TALL_ASCENDERS.has(b.codepoint) ? 210 : 320;
            lines.push(`    pos base uni${b.codepoint.toString(16).toUpperCase().padStart(4,'0')} <anchor ${x} 620> mark @MC_top;`);
          });
          if (bases.length > 8) lines.push(`    # ... +${bases.length - 8} more Thai consonants`);
          lines.push('  } thai_mark_to_base;', '} mark;');
        }
        if (above.length && tones.length) {
          lines.push('', 'feature mkmk {', '  lookup thai_tone_above_vowel {');
          above.slice(0, 5).forEach(v => {
            lines.push(`    pos mark uni${v.codepoint.toString(16).toUpperCase().padStart(4,'0')} <anchor 0 760> mark @MC_tone;`);
          });
          lines.push('  } thai_tone_above_vowel;', '} mkmk;');
        }
        return lines.join('\n');
      }

            saveState();
            renderAll();
            showToast(state.lang === 'th' ? 'ทำสำเนาโปรเจกต์แล้ว' : 'Project duplicated');

                <div class="text-[#6E6E73] pt-1">

                    ? 'การคอมไพล์ไฟล์ .TTF พร้อมตาราง OpenType GPOS/GSUB ทำงานผ่านโมดูล Python FastAPI + FontTools/ufoLib2/ufo2ft ที่แนบมาในชุดซอร์สโค้ด (ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์เครื่องของคุณจากหน้าพรีวิวนี้ได้โดยตรง)'

              <div class="text-xs font-semibold">${state.lang === 'th' ? 'ตัวอย่างโค้ด OpenType Feature (.fea) ภาษาไทย' : 'Generated Thai OpenType Feature (.fea) Preview'}</div>

        ['expFamily', 'expStyle', 'expDesigner', 'expVersion'].forEach(id => {

            style_name: proj.styleName,
            designer: proj.designer,

            metrics: {
              units_per_em: 1000,
              ascender: 880,
              cap_height: 700,

              descender: -260,

              category: g.category,
              canvas_width: g.canvasWidth,
              canvas_height: g.canvasHeight,
              strokes: g.strokes,
              is_completed: true
            }))
          };

          a.href = url;
          a.download = `${proj.familyName || 'HandwritingFont'}-compile-payload.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast(state.lang === 'th' ? 'ดาวน์โหลดไฟล์ JSON สำหรับคอมไพล์ .TTF แล้ว' : 'Exported FastAPI compile payload JSON');
        });
      }

      function renderSettings(main) {
        main.innerHTML = `
          <div class="max-w-2xl mx-auto space-y-5">
            <div>
              <h1 class="text-2xl font-semibold tracking-tight">${t('settingsTitle')}</h1>
              <p class="text-sm text-[#6E6E73] mt-1">${t('settingsSub')}</p>
            </div>

            <div class="bg-white rounded-2xl border border-[#E5E5EA] p-5 space-y-4 text-sm">
              <label class="flex items-center justify-between gap-4">
                <span>${state.lang === 'th' ? 'ขนาดช่องเขียนอักขระ (ขนาดใกล้เคียงจริง)' : 'Actual-Size Cell Width'}: <strong id="setCellVal">${state.cellWidth}px</strong></span>
                <input id="setCellSlider" type="range" min="76" max="132" step="4" value="${state.cellWidth}" />
              </label>
              <label class="flex items-center justify-between gap-4">
                <span>${state.lang === 'th' ? 'รองรับแรงกด Apple Pencil' : 'Apple Pencil Pressure Sensitivity'}</span>
                <input id="setPressure" type="checkbox" ${state.pressureSensitive ? 'checked' : ''} />
              </label>
              <label class="flex items-center justify-between gap-4">
                <span>${state.lang === 'th' ? 'ตำแหน่ง Baseline' : 'Baseline Guide'}: <strong id="setBaseVal">${Math.round(state.guides.baseline*100)}%</strong></span>
                <input id="setBaseSlider" type="range" min="0.64" max="0.84" step="0.01" value="${state.guides.baseline}" />
              </label>
              <label class="flex items-center justify-between gap-4">
                <span>${state.lang === 'th' ? 'ตำแหน่ง x-Height' : 'x-Height Guide'}: <strong id="setXVal">${Math.round(state.guides.xHeight*100)}%</strong></span>
                <input id="setXSlider" type="range" min="0.34" max="0.56" step="0.01" value="${state.guides.xHeight}" />
              </label>
              <label class="flex items-center justify-between gap-4">
                <span>${state.lang === 'th' ? 'ตำแหน่ง Ascender' : 'Ascender Guide'}: <strong id="setAscVal">${Math.round(state.guides.ascender*100)}%</strong></span>
                <input id="setAscSlider" type="range" min="0.08" max="0.24" step="0.01" value="${state.guides.ascender}" />
              </label>
              <label class="flex items-center justify-between gap-4">
                <span>${state.lang === 'th' ? 'ตำแหน่ง Descender' : 'Descender Guide'}: <strong id="setDescVal">${Math.round(state.guides.descender*100)}%</strong></span>
                <input id="setDescSlider" type="range" min="0.84" max="0.96" step="0.01" value="${state.guides.descender}" />
              </label>
            </div>
          </div>
        `;

        document.getElementById('setCellSlider').addEventListener('input', (e) => {
          state.cellWidth = Number(e.target.value);
          document.getElementById('setCellVal').textContent = state.cellWidth + 'px';
          saveState();
        });
        document.getElementById('setPressure').addEventListener('change', (e) => {
          state.pressureSensitive = e.target.checked;
          saveState();
        });
        document.getElementById('setBaseSlider').addEventListener('input', (e) => {
          state.guides.baseline = Number(e.target.value);
          document.getElementById('setBaseVal').textContent = Math.round(state.guides.baseline * 100) + '%';
          saveState();
        });
        document.getElementById('setXSlider').addEventListener('input', (e) => {
          state.guides.xHeight = Number(e.target.value);
          document.getElementById('setXVal').textContent = Math.round(state.guides.xHeight * 100) + '%';
          saveState();
        });
        document.getElementById('setAscSlider').addEventListener('input', (e) => {
          state.guides.ascender = Number(e.target.value);
          document.getElementById('setAscVal').textContent = Math.round(state.guides.ascender * 100) + '%';
          saveState();
        });
        document.getElementById('setDescSlider').addEventListener('input', (e) => {
          state.guides.descender = Number(e.target.value);
          document.getElementById('setDescVal').textContent = Math.round(state.guides.descender * 100) + '%';
          saveState();
        });
      }

      function renderAll() {
        renderSidebar();
        const main = document.getElementById('mainContent');
        if (state.tab === 'dashboard') renderDashboard(main);
        else if (state.tab === 'my-fonts') renderMyFonts(main);
        else if (state.tab === 'studio') renderStudio(main);
        else if (state.tab === 'preview') renderPreview(main);
        else if (state.tab === 'export') renderExport(main);
        else if (state.tab === 'settings') renderSettings(main);

        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      }

      // Global Event Bindings
      function toggleLanguage() {
        state.lang = state.lang === 'th' ? 'en' : 'th';
        saveState();
        renderAll();
      }
      document.getElementById('langToggleBtn').addEventListener('click', toggleLanguage);
      document.getElementById('mobileLangBtn').addEventListener('click', toggleLanguage);
      document.getElementById('mobileMenuBtn').addEventListener('click', openMobileSidebar);
      document.getElementById('closeSidebarBtn').addEventListener('click', closeMobileSidebar);
      document.getElementById('sidebarBackdrop').addEventListener('click', closeMobileSidebar);

      renderAll();
    })();
  </script>
</body>
</html>
